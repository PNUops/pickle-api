            \ 겹치면 차단을 적용하며, 허용 목록과 달리 금액 한도가 0이어도 유지돼요. 자체 서빙 모델에는 적용하지 않아요. 각 항목은\
            \ 허용 목록과 같은 부호 없는 모델 패턴이에요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*, */*-pro).\
            \ 차단은 ~를 제거한 이름도 검사하며 별칭의 실제 대상 모델은 추적하지 않아요. 정확한 모델명은 :batch 같은 변형도 포\
            함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type:
          - "array"
          - "null"
        grantedCreditLimit:
          description: "키 하나에 부여할 금액 한도예요(USD 크레딧). 생략하거나 null이나 0을 보내면 유료 모델을 쓸 수\
            \ 없어요."
          minimum: 0
          type:
          - "number"
          - "null"
        grantedCreditLimitReset:
          anyOf:
          - $ref: "#/components/schemas/CreditLimitReset"
          - type: "null"
          description: "금액 한도 리셋 창이에요. 생략하거나 null이면 리셋 없는 총액 상한이며, 리셋 창은 UTC 자정을 기\
            준으로 해요."
        grantedDailyTokens:
          description: "부여할 일일 토큰 수예요. 생략하거나 null이면 일일 한도가 없고, 0이면 자체 서빙(토큰) 축을 쓸\
            \ 수 없어요."
          format: "int64"
          minimum: 0
          type:
          - "integer"
          - "null"
        grantedPassthroughEndpoints:
          description: "이 키에 부여할 기능 권한이에요. 생략하거나 null이면 신청 목록(reqPassthroughEndpoints)으\
            로 승인하며, 빈 배열이면 chat을 포함해 어떤 기능도 쓸 수 없어요. 현재 부여할 수 있는 값은 chat, web_search,\
            \ pdf_ocr, images, embeddings, rerank, speech, transcriptions, videos,\
            \ batches이며, web_search나 pdf_ocr를 포함하면 chat도 함께 부여해야 하고, batches는 chat이\
            나 embeddings와 함께 부여해야 해요. 모델 조회에는 이 목록을 적용하지 않아요."
          items:
            enum:
            - "chat"
            - "web_search"
            - "pdf_ocr"
            - "containers"
            - "images"
            - "embeddings"
            - "rerank"
            - "speech"
            - "transcriptions"
            - "videos"
            - "batches"
            - "files"
            type: "string"
          maxItems: 20
          minItems: 0
          type:
          - "array"
          - "null"
        grantedRpm:
          description: "부여할 분당 요청 수이며, 생략하거나 null이면 서비스 기본값을 적용해요."
          format: "int32"
          maximum: 10000
          minimum: 1
          type:
          - "integer"
          - "null"
        grantedTpm:
          description: "부여할 분당 토큰 수이며, 생략하거나 null이면 서비스 기본값을 적용해요."
          format: "int32"
          minimum: 1
          type:
          - "integer"
          - "null"
        openrouterAccountId:
          description: "유료 모델을 결제할 기관 사업 계정이에요. 연결 가능한 계정이 하나뿐이면 생략할 수 있어요."
          format: "uuid"
          type:
          - "string"
          - "null"
      type: "object"
