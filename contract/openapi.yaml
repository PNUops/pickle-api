        grantedCreditAllowedModels:
          description: "승인자가 부여한 유료 모델 허용 목록이에요. 빈 배열이면 이 목록으로 제한하지 않아요. 각 항목에는 부호\
            \ 없는 모델 패턴을 입력해요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*, */*-pro). 공\
            급자 *는 ~별칭도 포함하며 특정 공급자를 허용할 때는 ~별칭을 별도로 적어야 해요. 정확한 모델명은 :batch 같은 변형도\
