            , 현재 상태는 lastAttemptAt·intervalSeconds를 직접 재해석하지 말고 top-level availability를\
            \ 사용. AUTH_UNVERIFIED는 도달했지만 인증 여부를 확인하지 못한 상태"
      required:
      - "stale"
      - "status"
