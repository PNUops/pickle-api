    PaidAccess:
      description: "유료 모델의 연결과 목록 제한 상태예요. LISTED는 허용 목록이나 차단 목록으로 범위를 좁힌 상태이며, UNRESTRICTED는\
        \ 두 목록이 모두 비어 목록으로 제한하지 않는 상태예요."
      enum:
      - "NONE"
      - "PENDING"
      - "UNRESTRICTED"
      - "LISTED"
      type: "string"
    PaidModel:
      description: "유료 모델"
      properties:
        completionPricePerMillion:
          description: "출력 100만 토큰당 USD이며, 가격을 모르면 null이에요."
          type:
          - "number"
          - "null"
        contextLength:
          description: "컨텍스트 길이이며, 알 수 없으면 null이에요."
          format: "int32"
          type:
          - "integer"
          - "null"
        id:
          description: "요청의 model 필드에 넣는 이름"
          example: "openai/gpt-5.6-luna"
          type: "string"
        name:
          description: "표시 이름"
          type: "string"
        pricing:
          anyOf:
          - $ref: "#/components/schemas/ModelPricing"
          - type: "null"
          description: "입력과 출력을 포함한 전체 가격 항목이며, 목록에 가격 정보가 없으면 null이에요."
        promptPricePerMillion:
          description: "입력 100만 토큰당 USD이며, 가격을 모르면 null이에요."
          type:
          - "number"
          - "null"
      required:
      - "id"
      - "name"
      type: "object"
    PaidModels:
      description: "유료 모델과 그 목록의 상태"
      properties:
        access:
          $ref: "#/components/schemas/PaidAccess"
          description: "유료 모델 연결과 목록 제한 상태"
        allowedPatterns:
          description: "이 키의 모델 허용 목록이며, 비어 있으면 이 목록으로 제한하지 않아요. 각 항목에는 부호 없는 모델 패\
            턴을 입력해요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*, */*-pro). 공급자 *는 ~별칭\
            도 포함하며 특정 공급자를 허용할 때는 ~별칭을 별도로 적어야 해요. 정확한 모델명은 :batch 같은 변형도 포함해요. 목록\
            마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          type: "array"
        catalogFreshness:
          $ref: "#/components/schemas/CatalogFreshness"
          description: "목록의 신선도"
        catalogObservedAt:
          description: "모델 목록을 마지막으로 가져온 시각이며, 성공 기록이 없으면 null이에요."
          format: "date-time"
          type:
          - "string"
          - "null"
        deniedPatterns:
          description: "이 키의 모델 차단 목록이며, 비어 있으면 이 목록으로 차단하지 않아요. 허용 목록과 겹치면 차단을 적용\
            해요. 각 항목은 허용 목록과 같은 부호 없는 모델 패턴이에요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*,\
            \ */*-pro). 차단은 ~를 제거한 이름도 검사하며 별칭의 실제 대상 모델은 추적하지 않아요. 정확한 모델명은 :batch\
            \ 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          type: "array"
        models:
          description: "정책에 맞는 모델 후보"
          items:
            $ref: "#/components/schemas/PaidModel"
          type: "array"
        unmatchedAllowedPatterns:
          description: "허용 목록에 있지만 현재 모델 목록에서 찾지 못한 이름이에요. 목록에서 사라진 모델과 아직 없는 이름,\
            \ 제한된 키에서 호출할 수 없는 라우터도 포함해요."
          items:
            type: "string"
          type: "array"
        unmatchedDeniedPatterns:
          description: "차단 목록에 있지만 현재 모델 목록에서 찾지 못한 이름이에요. 현재 캐시의 모델명과 별칭 중 이 패턴으로\
            \ 차단하는 것이 없다는 뜻이며, 아직 나오지 않은 모델을 미리 차단한 경우에도 여기에 나와요."
          items:
            type: "string"
          type: "array"
      required:
      - "access"
      - "allowedPatterns"
      - "catalogFreshness"
      - "deniedPatterns"
      - "models"
      - "unmatchedAllowedPatterns"
      - "unmatchedDeniedPatterns"
      type: "object"
