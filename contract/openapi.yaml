---
components:
  schemas:
    AccessGranteeType:
      enum:
      - "USER"
      - "WORKSPACE"
      type: "string"
    ActivateMfaRequest:
      properties:
        code:
          minLength: 1
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "code"
      type: "object"
    ActivityEntryResponse:
      properties:
        action:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        detail: {}
        id:
          description: "활동 행의 공개 식별자. 목록 렌더링용 키이며 어떤 조회 파라미터도 아닙니다."
          format: "uuid"
          type: "string"
        ip:
          type:
          - "string"
          - "null"
        targetId:
          type:
          - "string"
          - "null"
        targetType:
          type:
          - "string"
          - "null"
      required:
      - "action"
      - "createdAt"
      - "id"
      type: "object"
    AddResourceAccessGrantRequest:
      properties:
        granteeType:
          $ref: "#/components/schemas/AccessGranteeType"
          description: "USER는 지정된 사용자 한 명, WORKSPACE은 소유 워크스페이스 전체"
        role:
          $ref: "#/components/schemas/ResourceRole"
          description: "부여할 등급. 워크스페이스 전체 항목에는 MEMBER 또는 VIEWER만 지정할 수 있습니다."
        userId:
          description: "대상 사용자 id. granteeType이 USER일 때만 보내며, 소유 워크스페이스의 구성원이어야 합니\
            다."
          format: "uuid"
          type:
          - "string"
          - "null"
      required:
      - "granteeType"
      - "role"
      type: "object"
    AddWorkspaceMemberRequest:
      properties:
        email:
          format: "email"
          minLength: 1
          type: "string"
        role:
          $ref: "#/components/schemas/WorkspaceMemberRole"
      required:
      - "email"
      - "role"
      type: "object"
    AdminCampusIpRequestView:
      properties:
        adminNote:
          type:
          - "string"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        grantedAddress:
          description: "연결된 교내 IP 주소 (10.0.0.0/8)"
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        orgId:
          format: "uuid"
          type:
          - "string"
          - "null"
        ports:
          description: "사용할 포트 번호 목록"
          items:
            format: "int32"
            type: "integer"
          type: "array"
        processedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        processedBy:
          format: "uuid"
          type:
          - "string"
          - "null"
        purpose:
          description: "신청 목적"
          type: "string"
        requestedBy:
          format: "uuid"
          type: "string"
        requesterEmail:
          description: "신청자 이메일"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/CampusIpRequestStatus"
          description: "신청 상태 (REQUESTED = 신청, APPROVED = 관리자 승인, GRANTED = 교내 IP\
            \ 연결 완료, REJECTED = 반려, REVOKED = 회수)"
        vmId:
          format: "uuid"
          type: "string"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "createdAt"
      - "id"
      - "ports"
      - "purpose"
      - "requestedBy"
      - "status"
      - "vmId"
      type: "object"
    AdminCertificateView:
      properties:
        daysUntilExpiry:
          format: "int32"
          type:
          - "integer"
          - "null"
        domainId:
          format: "uuid"
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/CertificateKind"
        lastError:
          type:
          - "string"
          - "null"
        notAfter:
          format: "date-time"
          type:
          - "string"
          - "null"
        scope:
          type: "string"
        status:
          $ref: "#/components/schemas/CertificateStatus"
      required:
      - "id"
      - "kind"
      - "scope"
      - "status"
      type: "object"
    AdminDomainView:
      properties:
        certificateStatus:
          anyOf:
          - $ref: "#/components/schemas/CertificateStatus"
          - type: "null"
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/DomainKind"
        orgId:
          format: "uuid"
          type: "string"
        orgName:
          type: "string"
        releasedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        reservedUntil:
          format: "date-time"
          type:
          - "string"
          - "null"
        rootDomain:
          type:
          - "string"
          - "null"
        routeStatus:
          anyOf:
          - $ref: "#/components/schemas/RouteStatus"
          - type: "null"
        status:
          $ref: "#/components/schemas/DomainStatus"
        updatedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        verifiedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "uuid"
          type: "string"
        vmName:
          type: "string"
        workspaceId:
          format: "uuid"
          type: "string"
        workspaceName:
          type: "string"
      required:
      - "createdAt"
      - "fqdn"
      - "id"
      - "kind"
      - "orgId"
      - "orgName"
      - "status"
      - "vmId"
      - "vmName"
      - "workspaceId"
      - "workspaceName"
      type: "object"
    AdminGlobalRole:
      enum:
      - "USER"
      - "SYS_VIEWER"
      - "SYS_MANAGER"
      - "SYS_ADMIN"
      type: "string"
    AdminLlmKeyDetailResponse:
      properties:
        concurrency:
          format: "int32"
          type:
          - "integer"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        creditAllowedModels:
          description: "상용(금액) 축에서 이 키가 쓸 수 있는 모델 목록. 빈 배열은 제한 없음"
          items:
            type: "string"
          type: "array"
        creditAxisConnected:
          description: "유료 모델이 발급되어 현재 연결되어 있는지"
          type: "boolean"
        creditLimit:
          type: "number"
        creditLimitRemaining:
          description: "OpenRouter가 보고한 key 잔여 한도. 미관측 또는 무한도면 null"
          type:
          - "number"
          - "null"
        creditLimitReset:
          anyOf:
          - $ref: "#/components/schemas/CreditLimitReset"
          - type: "null"
        creditUsage:
          description: "OpenRouter가 마지막으로 보고한 현재 limit window 사용액. 미관측이면 null"
          type:
          - "number"
          - "null"
        creditUsageAt:
          description: "Key 금액을 vendor에서 관측한 시각. 미관측이면 null"
          format: "date-time"
          type:
          - "string"
          - "null"
        dailyTokens:
          format: "int64"
          type:
          - "integer"
          - "null"
        expiresAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        lastUsedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        name:
          type: "string"
        openrouterAccountId:
          format: "uuid"
          type:
          - "string"
          - "null"
        openrouterAccountName:
          type:
          - "string"
          - "null"
        orgId:
          format: "uuid"
          type:
          - "string"
          - "null"
        orgName:
          type: "string"
        purpose:
          type:
          - "string"
          - "null"
        quotaExhausted:
          type: "boolean"
        requestId:
          format: "uuid"
          type:
          - "string"
          - "null"
        revokedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        rpm:
          format: "int32"
          type:
          - "integer"
          - "null"
        status:
          $ref: "#/components/schemas/LlmApiKeyStatus"
        tpm:
          format: "int32"
          type:
          - "integer"
          - "null"
        workspaceId:
          format: "uuid"
          type:
          - "string"
          - "null"
        workspaceName:
          type: "string"
      required:
      - "createdAt"
      - "creditAllowedModels"
      - "creditAxisConnected"
      - "creditLimit"
      - "id"
      - "name"
      - "orgName"
      - "quotaExhausted"
      - "status"
      - "workspaceName"
      type: "object"
    AdminLlmKeyLimitsRequest:
      properties:
        concurrency:
          description: "동시 요청 한도. null이면 서비스 기본값을 따릅니다."
          format: "int32"
          maximum: 100
          minimum: 1
          type:
          - "integer"
          - "null"
        creditAllowedModels:
          description: "유료 모델 허용 목록. 빈 배열이나 null이면 제한이 없습니다. 금액 한도와 달리 null이 0을 뜻하\
            지 않습니다. 자체 서빙 모델은 이 값에 영향을 받지 않습니다."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type:
          - "array"
          - "null"
        creditLimit:
          description: "금액 한도(USD 크레딧). 0이면 유료 모델을 닫습니다."
          minimum: 0
          type: "number"
        creditLimitReset:
          anyOf:
          - $ref: "#/components/schemas/CreditLimitReset"
          - type: "null"
          description: "금액 한도 리셋 창. null이면 리셋 없는 총액 상한입니다."
        dailyTokens:
          description: "일일 토큰 한도. null이면 무제한이고 0이면 토큰 축을 닫습니다."
          format: "int64"
          minimum: 0
          type:
          - "integer"
          - "null"
        openrouterAccountId:
          description: "유료 모델을 결제할 사업 계정. 생략하거나 null이면 기존 연결을 유지합니다."
          format: "uuid"
          type:
          - "string"
          - "null"
        rpm:
          description: "분당 요청 한도. null이면 서비스 기본값을 따릅니다."
          format: "int32"
          maximum: 10000
          minimum: 1
          type:
          - "integer"
          - "null"
        tpm:
          description: "분당 토큰 한도. null이면 서비스 기본값을 따릅니다."
          format: "int32"
          minimum: 1
          type:
          - "integer"
          - "null"
      required:
      - "concurrency"
      - "creditAllowedModels"
      - "creditLimit"
      - "creditLimitReset"
      - "dailyTokens"
      - "rpm"
      - "tpm"
      type: "object"
    AdminLlmKeySummaryResponse:
      properties:
        concurrency:
          format: "int32"
          type:
          - "integer"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        creditAxisConnected:
          description: "유료 모델이 발급되어 현재 연결되어 있는지"
          type: "boolean"
        creditLimit:
          type: "number"
        creditLimitRemaining:
          description: "OpenRouter가 보고한 key 잔여 한도. 미관측 또는 무한도면 null"
          type:
          - "number"
          - "null"
        creditLimitReset:
          anyOf:
          - $ref: "#/components/schemas/CreditLimitReset"
          - type: "null"
        creditUsage:
          description: "OpenRouter가 마지막으로 보고한 현재 limit window 사용액. 미관측이면 null"
          type:
          - "number"
          - "null"
        creditUsageAt:
          description: "Key 금액을 vendor에서 관측한 시각. 미관측이면 null"
          format: "date-time"
          type:
          - "string"
          - "null"
        dailyTokens:
          format: "int64"
          type:
          - "integer"
          - "null"
        expiresAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        lastUsedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        name:
          type: "string"
        openrouterAccountId:
          format: "uuid"
          type:
          - "string"
          - "null"
        openrouterAccountName:
          type:
          - "string"
          - "null"
        orgId:
          format: "uuid"
          type:
          - "string"
          - "null"
        orgName:
          type: "string"
        purpose:
          type:
          - "string"
          - "null"
        requestId:
          format: "uuid"
          type:
          - "string"
          - "null"
        rpm:
          format: "int32"
          type:
          - "integer"
          - "null"
        status:
          $ref: "#/components/schemas/LlmApiKeyStatus"
        tpm:
          format: "int32"
          type:
          - "integer"
          - "null"
        workspaceId:
          format: "uuid"
          type:
          - "string"
          - "null"
        workspaceName:
          type: "string"
      required:
      - "createdAt"
      - "creditAxisConnected"
      - "creditLimit"
      - "id"
      - "name"
      - "orgName"
      - "status"
      - "workspaceName"
      type: "object"
    AdminLlmUsageResponse:
      properties:
        consumers:
          $ref: "#/components/schemas/LlmUsageConsumersResponse"
        days:
          format: "int32"
          type: "integer"
        demand:
          $ref: "#/components/schemas/LlmUsageDemandResponse"
        from:
          format: "date"
          type: "string"
        generatedAt:
          format: "date-time"
          type: "string"
        limitReview:
          $ref: "#/components/schemas/LlmLimitReviewCollectionResponse"
        quality:
          $ref: "#/components/schemas/LlmUsageQualityResponse"
        timezone:
          description: "모든 일자 경계와 오늘 사용량에 적용한 시간대"
          type: "string"
        to:
          format: "date"
          type: "string"
      required:
      - "consumers"
      - "days"
      - "demand"
      - "from"
      - "generatedAt"
      - "limitReview"
      - "quality"
      - "timezone"
      - "to"
      type: "object"
    AdminNoticeView:
      properties:
        active:
          description: "지금 게시 창 안에 있는지. 예정·만료된 공지도 이 목록에는 함께 나옵니다."
          type: "boolean"
        body:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        createdByName:
          description: "공지를 등록한 사람의 이름. 계정이 지워졌으면 비어 있습니다."
          type:
          - "string"
          - "null"
        endsAt:
          description: "게시 종료 시각. 비어 있으면 만료되지 않습니다."
          format: "date-time"
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        images:
          items:
            $ref: "#/components/schemas/NoticeImageView"
          type: "array"
        pinned:
          description: "목록 상단 고정 여부"
          type: "boolean"
        popup:
          description: "콘솔이 모달로 띄울 공지인지. 이 공지가 로그인 없이도 보이는지도 같은 값이 정합니다."
          type: "boolean"
        startsAt:
          format: "date-time"
          type: "string"
        title:
          type: "string"
        updatedAt:
          format: "date-time"
          type: "string"
      required:
      - "active"
      - "body"
      - "createdAt"
      - "id"
      - "images"
      - "pinned"
      - "popup"
      - "startsAt"
      - "title"
      - "updatedAt"
      type: "object"
    AdminNotificationResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        body:
          type: "string"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        createdAt:
          format: "date-time"
          type: "string"
        event:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        importance:
