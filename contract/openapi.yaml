            어요(예: openai/*, */*-pro). 공급자 *는 ~별칭도 포함하며 특정 공급자를 허용할 때는 ~별칭을 별도로 적어야\
            \ 해요. 정확한 모델명은 :batch 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
