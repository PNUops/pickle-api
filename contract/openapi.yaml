          type: "string"
      - in: "query"
        name: "action"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetType"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetId"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "from"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "to"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAuditLogViewResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
