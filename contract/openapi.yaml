          - "integer"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        creditAllowedModels:
          description: "이 키의 유료 모델 허용 목록이에요. 빈 배열이면 이 목록으로 제한하지 않아요. 자체 서빙 모델에는 적용\
            하지 않아요. 각 항목에는 부호 없는 모델 패턴을 입력해요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*,\
            \ */*-pro). 공급자 *는 ~별칭도 포함하며 특정 공급자를 허용할 때는 ~별칭을 별도로 적어야 해요. 정확한 모델명은\
            \ :batch 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          type: "array"
        creditAxisConnected:
          description: "유료 모델 연결 상태예요. 금액 한도를 부여해도 아직 키 연결 전이면 false예요."
          type: "boolean"
        creditDeniedModels:
          description: "이 키의 유료 모델 차단 목록이에요. 빈 배열이면 이 목록으로 차단하지 않아요. 허용 목록과 겹치면 차단\
            을 적용해요. 각 항목은 허용 목록과 같은 부호 없는 모델 패턴이에요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예\
            : openai/*, */*-pro). 차단은 ~를 제거한 이름도 검사하며 별칭의 실제 대상 모델은 추적하지 않아요. 정확한\
            \ 모델명은 :batch 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          type: "array"
        creditLimit:
          description: "유료 모델의 금액 한도예요(USD 크레딧). 0이면 유료 모델을 쓸 수 없어요."
