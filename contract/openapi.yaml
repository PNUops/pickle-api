          description: "최신 probe 실패 분류. 실패가 아니면 null"
          type:
          - "string"
          - "null"
        intervalSeconds:
          description: "이 upstream의 probe 주기(초). 마지막 시도 freshness 판정의 기준"
          format: "int32"
          type:
          - "integer"
          - "null"
        lastAttemptAt:
          description: "마지막 probe 시도 시각. 아직 시도하지 않았으면 null"
          format: "date-time"
          type:
          - "string"
          - "null"
        lastFailureAt:
          description: "마지막 probe 실패 시각. 실패 이력이 없으면 null"
          format: "date-time"
          type:
          - "string"
          - "null"
        lastSuccessAt:
          description: "마지막 probe 성공 시각. 성공 이력이 없으면 null"
          format: "date-time"
          type:
          - "string"
          - "null"
        latencyMs:
          description: "최신 probe 응답 시간(ms). 측정값이 없으면 null"
          format: "int64"
          type:
          - "integer"
          - "null"
        modelCount:
          description: "성공한 /models 응답의 모델 수. 성공했고 빈 목록이면 0, 성공 이력이 없으면 null"
          format: "int32"
          type:
          - "integer"
          - "null"
        stale:
          description: "마지막 probe 시도가 intervalSeconds의 3배보다 오래됐는지 서버가 계산한 값. 미관측 UNKNOWN은\
            \ false"
          type: "boolean"
        status:
          $ref: "#/components/schemas/LlmActiveProbeStatus"
          description: "마지막으로 보고된 raw probe 결과. freshness가 만료돼도 값 자체는 OK로 남을 수 있어요\
            . 현재 상태는 lastAttemptAt과 intervalSeconds를 직접 재해석하지 않고 availability로 확인해\
            요. AUTH_UNVERIFIED는 도달했지만 인증 여부를 확인하지 못한 상태"
      required:
      - "stale"
      - "status"
      type: "object"
