  /llm-keys:
    get:
      description: "`workspaceId`를 지정하지 않으면 내가 접근 권한을 가진 키만 조회해요. 지정하면 해당 워크스페이스의\
        \ 키 목록을 조회하며 접근 권한이 없는 키는 이름과 상태, 소유자만 담긴 제한된 행으로 표시해요."
      operationId: "listLlmKeys"
      parameters:
      - in: "query"
        name: "workspaceId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseLlmKeySummaryResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "LLM API 키 목록"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}:
    get:
      description: "접근 권한이 있는 키의 상세를 조회해요. 상세 응답에는 키 평문과 해시를 담지 않아요."
      operationId: "getLlmKey"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmKeyDetailResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "LLM API 키 상세"
      tags:
      - "llm-keys"
    patch:
      description: "키 이름과 사용 목적, 본문 기록 여부를 바꿔요. 생략한 항목은 그대로 둬요."
      operationId: "updateLlmKey"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLlmKeyRequest"
        required: true
      responses:
        "204":
          description: "No Content"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "LLM API 키 수정"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}/access:
    get:
      description: "이 키의 접근 권한 전체와 대상 키를 구분하는 최소 정보예요. 키 소유자와 워크스페이스 소유자만 볼 수 있어요."
      operationId: "listLlmKeyAccessGrants"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceAccessListResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "접근 권한 목록"
      tags:
      - "llm-key-access"
    post:
      description: "지정한 사용자 또는 소유 워크스페이스 전체에 이 키의 접근 권한을 부여해요. 사용자는 이 키를 소유한 워크스페이\
        스의 구성원이어야 하고, 워크스페이스 전체에는 참여자나 열람자 권한까지만 부여할 수 있어요."
      operationId: "addLlmKeyAccessGrant"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddResourceAccessGrantRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceAccessGrantView"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "접근 권한 부여"
      tags:
      - "llm-key-access"
  /llm-keys/{keyId}/access/preview:
