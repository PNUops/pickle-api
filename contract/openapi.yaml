          type: "number"
        creditLimitReset:
          anyOf:
          - $ref: "#/components/schemas/CreditLimitReset"
          - type: "null"
          description: "금액 한도 리셋 창이에요. 생략하면 유지하고 null이면 리셋 없는 총액 상한이에요."
        dailyTokens:
          description: "일일 토큰 한도예요. 생략하면 유지하고 null이면 무제한이며 0이면 토큰 축을 닫아요."
          format: "int64"
          minimum: 0
          type:
          - "integer"
          - "null"
        openrouterAccountId:
          description: "유료 모델을 결제할 사업 계정이며 생략하거나 null이면 기존 연결을 유지해요."
          format: "uuid"
          type:
          - "string"
          - "null"
        passthroughEndpoints:
          description: "이 키에 부여할 기능 권한이에요. 생략하면 유지하고 빈 배열이나 null이면 chat을 포함한 모든 기능\
            을 닫아요. 기능은 이 목록에 추가해야 열려요. 현재 부여할 수 있는 값은 chat, web_search, pdf_ocr, images,\
            \ embeddings, rerank, speech, transcriptions, videos, batches예요. web_search나\
            \ pdf_ocr를 부여하려면 chat도 함께 있어야 하고, batches는 chat이나 embeddings와 함께 있어야 해\
            요. 모델 조회는 이 값의 영향을 받지 않아요."
          items:
            enum:
            - "chat"
            - "web_search"
            - "pdf_ocr"
            - "containers"
            - "images"
            - "embeddings"
            - "rerank"
            - "speech"
            - "transcriptions"
            - "videos"
            - "batches"
            - "files"
            type: "string"
          maxItems: 20
          minItems: 0
          type:
          - "array"
          - "null"
        rpm:
          description: "분당 요청 한도예요. 생략하면 유지하고 null이면 서비스 기본값을 따라요."
          format: "int32"
          maximum: 10000
          minimum: 1
          type:
          - "integer"
          - "null"
        tpm:
          description: "분당 토큰 한도예요. 생략하면 유지하고 null이면 서비스 기본값을 따라요."
