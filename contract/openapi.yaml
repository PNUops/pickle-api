  /admin/nodes/{nodeId}:
    patch:
      operationId: "updateAdminNode"
      parameters:
      - in: "path"
        name: "nodeId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNodeStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NodeSummaryResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
