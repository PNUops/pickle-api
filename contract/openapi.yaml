          type: "string"
        lastUsedAt:
          description: "마지막 사용 시각이에요. Gateway가 배치로 보고하므로 지연될 수 있어요."
          format: "date-time"
          type:
          - "string"
          - "null"
        myResourceRole:
          anyOf:
          - $ref: "#/components/schemas/ResourceRole"
          - type: "null"
          description: "요청자가 이 키의 접근 목록에서 받은 등급"
        name:
          description: "키 이름"
          type: "string"
        passthroughEndpoints:
          description: "이 키에 부여된 기능 권한이에요. 빈 배열이면 chat을 포함해 어떤 기능도 쓸 수 없어요. 모델 조회에\
            는 이 목록을 적용하지 않아요."
          items:
            enum:
            - "chat"
            - "web_search"
            - "pdf_ocr"
            - "containers"
            - "images"
            - "embeddings"
            - "rerank"
            - "speech"
            - "transcriptions"
            - "videos"
            - "batches"
            - "files"
            type: "string"
          type: "array"
        purpose:
          description: "용도"
          type:
          - "string"
          - "null"
        recordBodies:
          description: "프롬프트와 응답 본문 기록 설정"
          type: "boolean"
        revokedAt:
          description: "폐기한 시각이며, 폐기하지 않았으면 null이에요."
          format: "date-time"
          type:
          - "string"
          - "null"
        rpm:
          description: "분당 요청 한도이며, null이면 Gateway 기본값을 따라요."
          format: "int32"
          type:
          - "integer"
