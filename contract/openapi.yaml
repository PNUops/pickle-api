              $ref: "#/components/schemas/UpdateGpuStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GpuView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "GPU 운영 상태 변경"
      tags:
      - "admin-gpu-controller"
  /admin/ip-allocations:
    get:
      operationId: "listIpAllocations"
      parameters:
      - in: "query"
        name: "poolId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "status"
