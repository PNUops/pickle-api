---
components:
  schemas:
    AccessConfirmation:
      properties:
        confirmed:
          description: "미리보기의 권한 증가를 명시적으로 확인했을 때만 true"
          type: "boolean"
        fingerprint:
          description: "미리보기에서 받은 대상과 변경, 현재 권한의 정확한 지문"
          type: "string"
        purpose:
          description: "권한을 얻는 목적이며 권한 증가 내용과 함께 감사 로그에 기록해요."
          maxLength: 200
          minLength: 0
          type: "string"
      type: "object"
    AccessGranteeType:
      enum:
      - "USER"
      - "WORKSPACE"
      type: "string"
    AccessIncrease:
      properties:
        afterRole:
          type: "string"
        beforeRole:
          type:
          - "string"
          - "null"
        resourceType:
          anyOf:
          - $ref: "#/components/schemas/ResourceType"
          - type: "null"
        targetId:
          format: "uuid"
          type: "string"
        workspaceId:
          format: "uuid"
          type: "string"
      required:
      - "afterRole"
      - "targetId"
      - "workspaceId"
      type: "object"
    Action:
      enum:
      - "ACCEPT"
      - "DROP"
      type: "string"
    ActivateMfaRequest:
      properties:
        code:
          minLength: 1
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "code"
      type: "object"
    ActivityEntryResponse:
      properties:
        action:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        detail: {}
        id:
          description: "활동 행의 공개 ID이며, 조회 파라미터로 쓰지 않아요."
          format: "uuid"
          type: "string"
        ip:
          type:
          - "string"
          - "null"
        targetId:
          type:
          - "string"
          - "null"
        targetType:
          type:
          - "string"
          - "null"
      required:
      - "action"
      - "createdAt"
      - "id"
      type: "object"
    ActorAccessImpact:
      properties:
        fingerprint:
          type: "string"
        increases:
          items:
            $ref: "#/components/schemas/AccessIncrease"
          type: "array"
        pendingResourceOwners:
          items:
            $ref: "#/components/schemas/PendingResourceOwner"
          type: "array"
      required:
      - "fingerprint"
      - "increases"
      - "pendingResourceOwners"
      type: "object"
    AddResourceAccessGrantRequest:
      properties:
        confirmation:
          anyOf:
          - $ref: "#/components/schemas/AccessConfirmation"
          - type: "null"
        granteeType:
          $ref: "#/components/schemas/AccessGranteeType"
          description: "USER는 지정한 사용자 한 명, WORKSPACE는 소유 워크스페이스 전체예요."
        role:
          $ref: "#/components/schemas/ResourceRole"
          description: "부여할 등급이에요. 워크스페이스 전체 항목에는 MEMBER 또는 VIEWER만 지정할 수 있어요."
        userId:
          description: "대상 사용자 ID예요. granteeType이 USER일 때만 보내며, 소유 워크스페이스의 활성 구성원이\
            어야 해요."
          format: "uuid"
          type:
          - "string"
          - "null"
      required:
      - "granteeType"
      - "role"
      type: "object"
    AdminApprovalImageReference:
      properties:
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        selectableNow:
          description: "동일 revision의 호환 ACTIVE replica가 ACTIVE 노드에 있는지 나타내요. 개별 VM\
            \ 용량이나 실제 생성 완료를 보장하지 않아요."
          type: "boolean"
        version:
          format: "int32"
          type: "integer"
      required:
      - "id"
      - "name"
      - "selectableNow"
      - "version"
      type: "object"
    AdminBulkAccessAction:
      enum:
      - "GRANT"
      - "CHANGE"
      - "REVOKE"
      type: "string"
    AdminBulkAccessChange:
      properties:
        action:
          $ref: "#/components/schemas/AdminBulkAccessAction"
          description: "GRANT는 없는 권한을 만들고 CHANGE는 기존 권한의 등급을 바꿔요. 둘은 활성 구성원에게만 허용해\
            요. REVOKE는 기존 개인 권한을 삭제하며 계정이 비활성화됐거나 구성원에서 제외된 뒤에도 할 수 있어요. 회수할 개인 권한\
            이 없으면 NO_GRANT로 거절해요. 워크스페이스 전체 부여는 유지해요."
        role:
          anyOf:
          - $ref: "#/components/schemas/ResourceRole"
          - type: "null"
          description: "부여하거나 바꿀 등급이며 GRANT와 CHANGE에서 필수예요."
        userId:
          description: "접근 권한을 받거나 잃을 사용자"
          format: "uuid"
          type: "string"
      required:
      - "action"
      - "userId"
      type: "object"
    AdminBulkChangeApplyItem:
      properties:
        fields:
          description: "APPLIED면 바뀐 필드, 아니면 빈 배열"
          items:
            $ref: "#/components/schemas/AdminBulkChangeFieldDiff"
          type: "array"
        name:
          description: "대상 이름이며 범위 밖이면 제공하지 않아요."
          type:
          - "string"
          - "null"
        reason:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkChangeReason"
          - type: "null"
          description: "SKIPPED인 이유"
        result:
          $ref: "#/components/schemas/AdminBulkChangeResult"
        targetId:
          format: "uuid"
          type: "string"
      required:
      - "fields"
      - "result"
      - "targetId"
      type: "object"
    AdminBulkChangeApplyResponse:
      properties:
        batchId:
          description: "이 적용의 ID이며 대상별 감사 기록과 요약 기록에 같은 값을 담아요."
          format: "uuid"
          type: "string"
        items:
          items:
            $ref: "#/components/schemas/AdminBulkChangeApplyItem"
          type: "array"
      required:
      - "batchId"
      - "items"
      type: "object"
    AdminBulkChangeCurrentObservation:
      properties:
        observedAt:
          format: "date-time"
          type: "string"
        refusal:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkChangeReason"
          - type: "null"
        targetId:
          format: "uuid"
          type: "string"
        values:
          additionalProperties: {}
          description: "현재 DB에 기록된 대상 값이에요. 요청과 값이 같아도 이 적용의 외부 완료를 증명하지 않아요."
          type: "object"
      required:
      - "observedAt"
      - "targetId"
      - "values"
      type: "object"
    AdminBulkChangeEffect:
      properties:
        externalReference:
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          type: "string"
        observedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        outcome:
          type: "string"
        queueObservedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        queueState:
          description: "현재 JobRunr 상태를 관측한 값이에요. SUCCEEDED도 외부 리소스의 물리적 완료를 뜻하지 않아\
            요."
          type:
          - "string"
          - "null"
        registeredAt:
          format: "date-time"
          type: "string"
        targetId:
          format: "uuid"
          type:
          - "string"
          - "null"
      required:
      - "id"
      - "kind"
      - "outcome"
      - "registeredAt"
      type: "object"
    AdminBulkChangeFieldDiff:
      properties:
        field:
          description: "필드 이름"
          type: "string"
        newValue:
          description: "바뀔 값이며 문자열이나 숫자, boolean, 배열, null이에요."
        oldValue:
          description: "현재 값이며 문자열이나 숫자, boolean, 배열, null이에요."
      required:
      - "field"
      - "newValue"
      - "oldValue"
      type: "object"
    AdminBulkChangeKind:
      enum:
      - "LLM_KEY_LIMITS"
      - "LLM_KEY_STATUS"
      - "LLM_KEY_EXPIRY"
      - "VM_PERIOD"
      - "VM_POWER"
      - "VM_DELETION"
      - "DOMAIN_RENEWAL"
      - "DOMAIN_FORCE_RELEASE"
      - "DOMAIN_VERIFY"
      - "ACCESS"
      type: "string"
    AdminBulkChangeOperationResponse:
      properties:
        change:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkChangeSpec"
          - type: "null"
        committedAt:
          format: "date-time"
          type: "string"
        effects:
          items:
            $ref: "#/components/schemas/AdminBulkChangeEffect"
          type: "array"
        observations:
          items:
            $ref: "#/components/schemas/AdminBulkChangeCurrentObservation"
          type: "array"
        operationId:
          format: "uuid"
          type: "string"
        previewId:
          format: "uuid"
          type: "string"
        result:
          $ref: "#/components/schemas/AdminBulkChangeApplyResponse"
        status:
          description: "COMMITTED는 DB 변경과 결과를 커밋했다는 뜻이에요. 큐 접수나 외부 완료를 뜻하지 않아요."
          type: "string"
        targetType:
          $ref: "#/components/schemas/AdminBulkChangeTargetType"
      required:
      - "committedAt"
      - "effects"
      - "observations"
      - "operationId"
      - "previewId"
      - "result"
      - "status"
      - "targetType"
      type: "object"
    AdminBulkChangePreviewItem:
      properties:
        actorAccessImpact:
          anyOf:
          - $ref: "#/components/schemas/ActorAccessImpact"
          - type: "null"
        applicable:
          description: "true면 현재 조건에서 적용할 수 있어요. 이때 fields가 비어 있으면 이미 같은 값이므로 바뀌지\
            \ 않아요."
          type: "boolean"
        fields:
          description: "바뀔 필드만"
          items:
            $ref: "#/components/schemas/AdminBulkChangeFieldDiff"
          type: "array"
        fingerprint:
          description: "이 대상의 현재 값을 요약한 지문이며 적용 요청에 그대로 보내요."
          type: "string"
        name:
          description: "대상 이름이며 범위 밖이면 제공하지 않아요."
          type:
          - "string"
          - "null"
        reason:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkChangeReason"
          - type: "null"
          description: "applicable이 false인 이유"
        targetId:
          format: "uuid"
          type: "string"
      required:
      - "applicable"
      - "fields"
      - "fingerprint"
      - "targetId"
      type: "object"
    AdminBulkChangePreviewResponse:
      properties:
        accountImpact:
          anyOf:
          - $ref: "#/components/schemas/LlmAccountImpactProjection"
          - type: "null"
        change:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkChangeSpec"
          - type: "null"
        consumedOperationId:
          description: "이 미리보기로 이미 커밋된 본인 적용의 ID예요. 새 적용을 만들지 않고 기존 결과를 여는 데 사용해요."
          format: "uuid"
          type:
          - "string"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        expiresAt:
          format: "date-time"
          type: "string"
        items:
          items:
            $ref: "#/components/schemas/AdminBulkChangePreviewItem"
          type: "array"
        previewId:
          format: "uuid"
          type: "string"
        targetType:
          $ref: "#/components/schemas/AdminBulkChangeTargetType"
      required:
      - "createdAt"
      - "expiresAt"
      - "items"
      - "previewId"
      - "targetType"
      type: "object"
    AdminBulkChangeReason:
      description: "대상 하나가 변경되지 않은 이유. NOT_FOUND: 대상이 없거나 이 계정의 범위 밖이에요. FORBIDDEN:\
        \ 현재 권한으로 이 변경을 할 수 없어요. INVALID_STATE: 현재 상태에서는 할 수 없는 변경이에요. EXPIRED: 사용\
        \ 기간이 만료돼 먼저 기간을 연장해야 해요. PROTECTED: 삭제 보호가 켜져 있어요. INELIGIBLE: 대상이나 지정한 사\
        용자는 이 변경의 대상이 될 수 없어요. NOT_MEMBER: 지정한 사용자가 소유 워크스페이스의 구성원이 아니에요. NO_GRANT:\
        \ 지정한 사용자에게 바꾸거나 회수할 접근 권한이 없어요. ALREADY_GRANTED: 지정한 사용자가 이미 다른 등급의 접근 권한\
        을 갖고 있어요. VALIDATION: 합친 결과가 한도 규칙에 맞지 않아요."
      enum:
      - "NOT_FOUND"
      - "FORBIDDEN"
      - "INVALID_STATE"
      - "EXPIRED"
      - "PROTECTED"
      - "INELIGIBLE"
      - "NOT_MEMBER"
      - "NO_GRANT"
      - "ALREADY_GRANTED"
      - "VALIDATION"
      type: "string"
    AdminBulkChangeRequest:
      properties:
        accessConfirmations:
          additionalProperties:
            $ref: "#/components/schemas/AccessConfirmation"
          type:
          - "object"
          - "null"
        change:
          $ref: "#/components/schemas/AdminBulkChangeSpec"
        fingerprints:
          additionalProperties:
            type: "string"
          description: "적용 요청에서만 보내요. 미리보기에서 받은 대상별 fingerprint를 모두 담아요. 서버는 적용 시점\
            의 값을 다시 계산해 지문이 다른 대상은 STALE로 응답하고 변경하지 않아요."
          type:
          - "object"
          - "null"
        operationId:
          description: "적용할 때 필수이며 응답이 없어 다시 요청할 때도 유지하는 클라이언트 생성 ID예요. batchId와 같\
            아요."
          format: "uuid"
          type:
          - "string"
          - "null"
        previewId:
          description: "적용에서 필수인 저장 미리보기 ID"
          format: "uuid"
          type:
          - "string"
          - "null"
        targetIds:
          description: "대상의 공개 ID. 1개 이상 200개 이하, 중복 없이."
          items:
            format: "uuid"
            type: "string"
          maxItems: 200
          minItems: 1
          type: "array"
        targetType:
          $ref: "#/components/schemas/AdminBulkChangeTargetType"
          description: "대상 종류이며 변경 종류와 맞아야 해요."
      required:
      - "change"
      - "targetIds"
      - "targetType"
      type: "object"
    AdminBulkChangeResult:
      description: "APPLIED: 변경됨. UNCHANGED: 이미 그 값이라 쓰지 않음. SKIPPED: reason의 이유로\
        \ 건너뜀. STALE: 미리보기 뒤 대상이 바뀌어 쓰지 않음."
      enum:
      - "APPLIED"
      - "UNCHANGED"
      - "SKIPPED"
      - "STALE"
      type: "string"
    AdminBulkChangeSpec:
      properties:
        access:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkAccessChange"
          - type: "null"
          description: "kind가 ACCESS일 때"
        domainForceRelease:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkDomainForceReleaseChange"
          - type: "null"
          description: "kind가 DOMAIN_FORCE_RELEASE일 때"
        domainRenewal:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkDomainRenewalChange"
          - type: "null"
          description: "kind가 DOMAIN_RENEWAL일 때"
        domainVerify:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkDomainVerifyChange"
          - type: "null"
          description: "kind가 DOMAIN_VERIFY일 때"
        kind:
          $ref: "#/components/schemas/AdminBulkChangeKind"
          description: "변경 종류이며 해당 종류에 맞는 항목 하나만 채워요."
        llmKeyExpiry:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkLlmKeyExpiryChange"
          - type: "null"
          description: "kind가 LLM_KEY_EXPIRY일 때"
        llmKeyLimits:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkLlmKeyLimitsChange"
          - type: "null"
          description: "kind가 LLM_KEY_LIMITS일 때"
        llmKeyStatus:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkLlmKeyStatusChange"
          - type: "null"
          description: "kind가 LLM_KEY_STATUS일 때"
        vmDeletion:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkVmDeletionChange"
          - type: "null"
          description: "kind가 VM_DELETION일 때"
        vmPeriod:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkVmPeriodChange"
          - type: "null"
          description: "kind가 VM_PERIOD일 때"
        vmPower:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkVmPowerChange"
          - type: "null"
          description: "kind가 VM_POWER일 때"
      required:
      - "kind"
      type: "object"
    AdminBulkChangeTargetType:
      enum:
      - "LLM_KEY"
      - "VM"
      - "DOMAIN"
      - "GPU_ALLOCATION"
      type: "string"
    AdminBulkDomainForceReleaseChange:
      description: "빈 객체예요. 강제 해제는 되돌릴 수 없고 이름을 즉시 회수해요."
      type: "object"
    AdminBulkDomainRenewalChange:
      properties:
        reason:
          description: "기한을 바꾼 이유이며 대상마다 감사 기록에 남겨요."
          type:
          - "string"
          - "null"
        renewDueAt:
          description: "새 사용 기한이며 미래 시각으로 지정해요. 기한이 지나도 연장하지 않은 이름은 해제 대상이 되고, 해제할\
            \ 때 레코드를 삭제해요."
          format: "date-time"
          type: "string"
      required:
      - "renewDueAt"
      type: "object"
    AdminBulkDomainVerifyChange:
      description: "빈 객체예요. 커스텀 도메인마다 소유권 재검증 요청을 접수해요."
      type: "object"
    AdminBulkListChange:
      properties:
        op:
          $ref: "#/components/schemas/AdminBulkListOp"
          description: "REPLACE는 목록을 통째로 바꾸고 ADD는 없는 값을 더하며 REMOVE는 있는 값을 빼요. 목록을\
            \ 비우려면 REPLACE에 빈 배열을 보내요."
        values:
          description: "적용할 값이며 각 키의 현재 목록과 합친 결과를 단일 변경과 같은 규칙으로 검사해요."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type: "array"
      required:
      - "op"
      - "values"
      type: "object"
    AdminBulkListOp:
      enum:
      - "REPLACE"
      - "ADD"
      - "REMOVE"
      type: "string"
    AdminBulkLlmKeyExpiryChange:
      properties:
        endDate:
          description: "새 종료일이에요(KST, 해당 날짜까지 포함). 키는 다음 날 0시에 만료되며 오늘 이후여야 해요."
          format: "date"
          type: "string"
      required:
      - "endDate"
      type: "object"
    AdminBulkLlmKeyLimitsChange:
      properties:
        concurrency:
          description: "동시 요청 한도예요. 생략하면 유지하고 null이면 서비스 기본값을 따라요."
          format: "int32"
          maximum: 100
          minimum: 1
          type:
          - "integer"
          - "null"
        creditAllowedModels:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkListChange"
          - type: "null"
          description: "유료 모델 허용 목록에 적용할 변경이며 생략하면 유지해요."
        creditDeniedModels:
          anyOf:
          - $ref: "#/components/schemas/AdminBulkListChange"
          - type: "null"
          description: "유료 모델 차단 목록에 적용할 변경이며 생략하면 유지해요."
        creditLimit:
          description: "금액 한도예요(USD 크레딧). 생략하면 유지해요. null은 허용하지 않으며 유료 모델을 닫으려면 0을\
