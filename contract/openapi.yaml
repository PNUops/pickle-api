          description: "오류: 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-ip-allocation-controller"
  /admin/llm/accounts:
    get:
      description: "관리 범위의 OpenRouter 사업 계정과 관리용 키 상태를 조회해요. 인증 정보와 vendor 내부 식별자는\
        \ 반환하지 않아요."
      operationId: "listAdminLlmAccounts"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/OpenRouterAccountResponse"
                type: "array"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 목록"
      tags:
      - "admin"
    post:
      description: "이름을 확인해 기관의 사업 계정 정보를 등록해요. 관리용 키는 별도 등록 경로에서 검증하며 교체는 대기 등록으로\
        \ 진행해요."
      operationId: "createAdminLlmAccount"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenRouterAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 등록"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}:
    get:
      description: "관리 범위의 사업 계정 정보와 유료 모델 연결 가능 여부, 연결된 키 수, 관리용 키 상태를 조회해요. 키 값은\
        \ 반환하지 않아요."
      operationId: "getAdminLlmAccount"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 상세"
      tags:
      - "admin"
    patch:
      description: "이름과 사업, 담당자, 상태, 기본 유료 모델 허용 목록과 차단 목록 중 보낸 항목만 바꿔요. 만료 시각이 없거\
        나 현재보다 뒤인 연결 키 중 PENDING, ACTIVE, SUSPENDED 상태가 있으면 계정을 보관할 수 없어요. 기본 목록 변\
        경은 새 승인이나 발급 때 참고하며 기존 키에는 자동 적용하지 않아요."
      operationId: "updateAdminLlmAccount"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOpenRouterAccountRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 정보 수정"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials:
    post:
      description: "credential이 없는 ACTIVE 사업 계정에 관리용 키를 등록해요. 계정 이름을 확인한 뒤 credits와\
        \ 키 목록 조회, 실제 검증용 키 생성과 비활성화 및 삭제로 management 전용 권한과 vendor workspace를 검증해\
        요. billing identity marker가 없으면 만들고 같은 요청에서 ACTIVE 상태로 저장해요. 이미 credential이\
        \ 있으면 거절하며 교체는 대기 등록으로 진행해요."
      operationId: "registerAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOpenRouterCredentialRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 관리 credential 최초 등록"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/active/delete:
    post:
      description: "연결된 키와 진행 중인 교체가 없어야 해요. 이름과 운영자의 OpenRouter 관리용 키 폐기 확인을 받고,\
        \ 해당 키의 원격 credits 조회가 인증 또는 권한 오류로 거절되는지 확인한 뒤 ACTIVE 암호문을 삭제해요. API가 관리용\
        \ 키 자체를 폐기하지는 않아요."
      operationId: "deleteActiveAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeOpenRouterCredentialRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "사용하지 않는 OpenRouter credential 삭제"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/retiring/finalize:
    post:
      description: "새 ACTIVE credential의 활성화 이후 key reconciliation이 성공하고 운영자가 이전 관\
        리용 키의 폐기를 확인해야 해요. 이전 키의 원격 credits 조회가 인증 또는 권한 오류로 거절되는지 확인한 뒤 RETIRING\
        \ 암호문을 삭제해요."
      operationId: "finalizeAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeOpenRouterCredentialRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "이전 OpenRouter credential 정리"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/retiring/rollback:
    post:
      description: "이름을 확인하고 이전 RETIRING credential을 재검증한 뒤 현재 ACTIVE를 STAGED로, 이전\
        \ RETIRING을 ACTIVE로 원자적으로 되돌려요. vendor credential 자체는 API가 폐기하지 않아요."
      operationId: "rollbackAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOpenRouterAccountRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter credential 교체 되돌리기"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/staged:
    post:
      description: "쓰고 있는 ACTIVE credential을 교체할 후보를 등록해요. 계정 이름을 확인한 뒤 credits와 키\
        \ 목록 조회, 실제 검증용 키 생성과 비활성화 및 삭제로 management 전용 권한과 vendor workspace를 검증하고\
        \ STAGED 상태로 저장해요. ACTIVE credential이 없으면 거절하며 최초 등록은 별도 경로를 써요. 평문과 credential\
        \ 조각은 응답하지 않아요."
      operationId: "stageAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageOpenRouterCredentialRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 관리 credential 교체 대기 등록"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/staged/activate:
    post:
      description: "이름을 확인한 뒤 STAGED credential을 다시 검증해요. 교체할 때는 기존 ACTIVE가 만든 검증용\
        \ 키를 새 credential로 조회하고 수정한 뒤 삭제해요. 이후 두 상태를 원자적으로 ACTIVE와 RETIRING으로 바꿔요."
      operationId: "activateAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOpenRouterAccountRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "대기 중 OpenRouter credential 활성화"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/staged/cancel:
    post:
      description: "이름을 확인한 뒤 아직 활성화하지 않은 STAGED credential 암호문을 삭제해요. ACTIVE credential에\
        는 영향을 주지 않아요."
      operationId: "cancelAdminLlmAccountCredential"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOpenRouterAccountRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "대기 중 OpenRouter credential 취소"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/usage:
    get:
      description: "현재 이 계정에 연결된 키를 기준으로 플랫폼에 기록된 사용량과 금액을 집계해요. **공급자의 지출액이나 잔액과는\
        \ 다른 값이에요.** 공급자 값은 계정 상세의 credits에서 확인하며 집계 기간도 달라요. 키를 확인하지 못한 요청은 어느 계정\
        에도 귀속하지 않아요. 공급자가 금액을 알려 주지 않은 요청은 0으로 보지 않고 금액 미확인으로 합계에서 제외해요. 금액마다 가격이\
        \ 확인된 요청 수도 함께 반환해요."
      operationId: "getAdminLlmAccountUsage"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "오늘을 포함해 거슬러 올라갈 일수"
        in: "query"
        name: "days"
        required: false
        schema:
          default: 30
          format: "int32"
          maximum: 90
          minimum: 1
          type: "integer"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      - in: "query"
        name: "sort"
        required: false
        schema:
          $ref: "#/components/schemas/LlmConsumerSort"
          default: "REPORTED_COST_DESC"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLlmAccountUsageResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 사용량"
      tags:
      - "admin"
  /admin/llm/capacity:
    get:
      description: "같은 절대 기간의 보존된 raw event에서 수요와 거절 사유, 소비처를 조회해요. 기관과 워크스페이스, 관측\
        \ 업무 범위를 수요 집계 전에 적용해요. 기존 SYS 전역 읽기에서는 설정된 고정 원천의 같은 기간 장비 표본과 품질을 독립적으로\
        \ 제공해요. 설치 완료와 완전 수집, 개인별 장비 귀속을 보장하지 않으며 외부 호출이나 변경을 실행하지 않아요."
      operationId: "getAdminLlmCapacity"
      parameters:
      - description: "포함하는 시작 시각(UTC Instant)"
        in: "query"
        name: "from"
        required: true
        schema:
          format: "date-time"
          type: "string"
      - description: "제외하는 종료 시각(UTC Instant). 미래 불가, 최대 기간 90일"
        in: "query"
        name: "to"
        required: true
        schema:
          format: "date-time"
          type: "string"
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "workspaceId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - description: "현재 범위에서 보이는 등록 공급원의 공개 ID예요. 최종 처리 경로를 필터해요."
        in: "query"
        name: "upstreamId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - description: "요청 당시 공개 모델 이름의 정확한 값"
        in: "query"
        name: "publicModelName"
        required: false
        schema:
          type: "string"
      - description: "정상 응답을 제외하고 기록된 errorType의 정확한 값"
        in: "query"
        name: "errorType"
        required: false
        schema:
          type: "string"
      - description: "정상 응답을 제외하고 errorType이 기록되지 않은 요청만 조회해요. errorType과 함께 지정할 수\
          \ 없어요."
        in: "query"
        name: "errorTypeMissing"
        required: false
        schema:
          default: false
          type: "boolean"
      - description: "거절과 오류 분류예요. 오류 유형 또는 미기록 필터와 함께 같은 사유 행의 소비처를 조회해요."
        in: "query"
        name: "reasonCategory"
        required: false
        schema:
          $ref: "#/components/schemas/CapacityReasonCategory"
      - in: "query"
        name: "group"
        required: false
        schema:
          $ref: "#/components/schemas/CapacityGroup"
          default: "WORKSPACE"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      - description: "버킷의 초 단위 길이예요. 생략하면 기간에 맞추며 최대 1440개 버킷을 반환해요."
        in: "query"
        name: "bucketSeconds"
        required: false
        schema:
          format: "int32"
          type: "integer"
      - description: "SYS 전역 장비 표본의 고정 원천 공개 ID예요. 기관과 공간, 원인, 공개 모델 수요 필터와 독립적이며\
          \ 현재 설정된 단일 원천만 지원해요."
        in: "query"
        name: "telemetrySourceId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - description: "현재 보이는 키의 사업 계정 결합으로 보존 원문을 좁히는 공개 ID예요. 실제 지불 주체나 과거 계정 이력을\
          \ 보여 주는 증거는 아니에요."
        in: "query"
        name: "openrouterAccountId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "sort"
        required: false
        schema:
          $ref: "#/components/schemas/LlmConsumerSort"
          default: "REQUESTS_DESC"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLlmCapacityResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM 수요와 한도 판단 자료"
      tags:
      - "admin"
  /admin/llm/keys:
    get:
      description: "각 업무가 허가한 키의 metadata와 관측, 금융, 명령 참조를 조회해요. 기관과 워크스페이스, 발급 신청\
        , 상태, 검색어는 필터예요. 키 평문과 해시, 평문 앞부분은 반환하지 않아요."
      operationId: "listAdminLlmKeys"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "workspaceId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - description: "키를 발급한 신청 공개 ID"
        in: "query"
        name: "requestId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - description: "연결된 사업 계정의 공개 ID"
        in: "query"
        name: "openrouterAccountId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/LlmApiKeyStatus"
      - in: "query"
        name: "query"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      - description: "현재 키 행의 모집단이에요. 승인 후 키 생성 전 계획은 포함하지 않아요."
        in: "query"
        name: "cohort"
        required: false
        schema:
          $ref: "#/components/schemas/LlmKeyCohort"
          default: "ALL"
      - description: "안정된 서버 정렬이에요. 관측값이나 금액을 기준으로 정렬하려면 조회 대상 전체에 대해 그 정렬 기준의 관측\
          \ 또는 금융 정보를 읽을 수 있어야 해요."
        in: "query"
        name: "sort"
        required: false
        schema:
          $ref: "#/components/schemas/LlmKeySort"
          default: "NEWEST"
      - description: "저장 정책과 기능 권한이 허용하는 공개 모델명이에요. 예산과 발급, 라우팅, 실제 처리 성공을 보장하지 않아\
          요."
        in: "query"
        name: "policyModel"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "policyFeature"
        required: false
        schema:
          default: "chat"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminLlmKeySummaryResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 목록"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}:
    get:
      description: "실제 키에 대한 업무별로 운영 상태와 현재 허용값을 보여 주고 금융 필드는 별도로 판정해요. 인증 비밀이나 기록\
        된 본문은 반환하지 않아요."
      operationId: "getAdminLlmKey"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "true이면 현재 허용된 금액 제안의 읽기 projection을 포함해요. false이면 제안 파라미터를 함\
          께 보낼 수 없어요. 저장과 계정 결합, 외부 호출은 하지 않아요."
        in: "query"
        name: "projectLimits"
        required: false
        schema:
          default: false
          type: "boolean"
      - description: "제안 금액(USD)이에요. 생략하면 현재 값을 유지하고 빈 값과 null은 허용하지 않아요. 0 이상, 정수\
          \ 10자리와 소수 2자리까지이며 0은 유료 모델을 닫는 제안이에요."
        in: "query"
        name: "proposedCreditLimit"
        required: false
        schema:
          minimum: 0.0
          type: "number"
      - description: "false는 리셋 제안 없음이고, true이면서 proposedCreditLimitReset을 생략하면 명시\
          한 총액 한도예요."
        in: "query"
        name: "proposedCreditLimitResetSet"
        required: false
        schema:
          default: false
          type: "boolean"
      - description: "resetSet=true일 때 제안하는 DAILY/WEEKLY/MONTHLY 창이에요. resetSet=true이\
          면서 이 값을 생략하면 명시한 총액 한도(null), resetSet=false는 리셋 변경 없음이에요."
        in: "query"
        name: "proposedCreditLimitReset"
        required: false
        schema:
          $ref: "#/components/schemas/CreditLimitReset"
      - description: "기존 최초 계정 연결 규칙으로 평가할 공개 ID예요. 계정 전환이나 재결합은 아니에요."
        in: "query"
        name: "proposedOpenrouterAccountId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLlmKeyDetailResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 상세"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}/expiry:
    patch:
      description: "키의 종료일을 바꿔요. 종료일은 KST 기준 그날을 포함하며 승인할 때와 같이 계산해요. 미래 종료일로 만료 조\
        건을 해소할 수 있어요. 정지 상태와 최초 발급 조건은 그대로 적용돼요. 폐기된 키는 바꿀 수 없고, OpenRouter 키가 발급돼\
        \ 있고 현재 만료일이 정해져 있으면 그보다 뒤로 미룰 수 없어요."
      operationId: "updateAdminLlmKeyExpiry"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLlmKeyExpiryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLlmKeyDetailResponse"
          description: "변경된 LLM API 키 상세"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 만료일 변경"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}/limits:
    put:
      description: "보낸 한도만 현재 업무 권한으로 바꾸고 생략한 값은 유지해요. 시스템 운영자는 금액과 리셋 창, 유료 모델 및\
        \ 유료 기능 정책을 바꿀 수 없어요."
      operationId: "replaceAdminLlmKeyLimits"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLlmKeyLimitsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLlmKeyDetailResponse"
          description: "변경된 LLM API 키 상세"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 한도 교체"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}/models:
    get:
      description: "실제 키를 위한 모델 후보예요. 유료 정책 참조는 금융 읽기나 해당 키의 예산 명령 권한이 있을 때만 반환해요\
        . 허용 목록을 정할 때 실제로 어떤 모델이 남는지 확인해요. 최종 판정은 호출 시점에 이뤄지므로 여기 있는 모델이 항상 응답한다고\
        \ 보장하지 않아요."
      operationId: "listAdminLlmKeyModels"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InstitutionAdminLlmModelsResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키로 호출할 수 있는 모델"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}/resume:
    post:
      description: "정지된 키를 다시 활성화해요."
      operationId: "resumeAdminLlmKey"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLlmKeyDetailResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 재개"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}/suspend:
    post:
      description: "활성 키를 정지해요. 사유는 감사 기록에 남고 평문 요청 본문은 감사 기록에 남기지 않아요."
      operationId: "suspendAdminLlmKey"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendAdminLlmKeyRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLlmKeyDetailResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 정지"
      tags:
      - "admin"
  /admin/llm/keys/{keyId}/usage:
    get:
      description: "실제 키의 관측 읽기와 금융 읽기 권한을 각각 판정하는 사용량 응답이에요. 허용하지 않은 조회 항목은 null로\
        \ 반환하며 0이나 빈 목록과 구분해요. 권한으로 볼 수 있는 일별 사용량은 소유자 조회와 같은 값과 계산을 써요. 일별 금액과 경로\
        별 사용량, 공급자가 요청과 다른 모델로 응답한 사례를 나눠 보여 줘요. 하루는 한국 시간 기준이며 호출이 없던 날도 0으로 채워요\
        . 오늘 값은 게이트웨이의 배치 보고에 따라 달라질 수 있어요."
      operationId: "getAdminLlmKeyUsage"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "오늘을 포함해 거슬러 올라갈 일수"
        in: "query"
        name: "days"
        required: false
        schema:
          default: 30
          format: "int32"
          maximum: 90
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLlmKeyUsageResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM API 키 사용량"
      tags:
      - "admin"
  /admin/llm/metrics:
    get:
      description: "raw usage event에서 마지막 처리 upstream별 최종 결과와 지연, token, attempt coverage를\
        \ 집계해요. 중간 retry 경로나 uptime을 뜻하지 않아요."
      operationId: "getAdminLlmMetrics"
      parameters:
      - description: "조회할 기관이에요. 기관 계층에서는 맡은 기관만 지정할 수 있어요."
        in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - description: "진단 기간(일), 최대 31일"
        in: "query"
        name: "days"
        required: false
        schema:
          default: 7
          format: "int32"
          maximum: 31
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmMetricsResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 LLM upstream 지표"
      tags:
      - "admin"
  /admin/llm/openrouter-models:
    get:
      description: "승인 화면에서 고를 수 있는 유료 모델 후보와 가격을 조회해요. 캐시만 읽으므로 이 호출이 벤더를 부르지 않으며\
        , 목록이 비어 있거나 오래됐어도 모델 이름을 직접 입력해 승인할 수 있어요. 성공 기록이 없으면 시도하지 않았든 실패했든 UNKNOWN으\
        로 표시돼요. lastError와 consecutiveFailures를 함께 확인해 주세요."
      operationId: "listAdminOpenRouterModels"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterCatalogueResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "유료 모델 카탈로그"
      tags:
      - "admin"
  /admin/llm/roster-account-references:
    get:
      description: "실제 기관과 살아 있는 워크스페이스에 대한 명단 발급과 키 예산 업무를 같은 권한 원천에서 확인해요. 기존 신청\
        이나 리소스, 개인 구성원 자격은 필요하지 않아요. 계정 ID와 이름, 선택 가능 상태, 적용 가능한 기본 정책만 반환해요."
      operationId: "listAdminLlmRosterAccountReferences"
      parameters:
      - in: "query"
        name: "orgId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "workspaceId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/InstitutionLlmAccountReference"
                type: "array"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "새 LLM 명단 발급의 사업 계정 선택 참조"
      tags:
      - "admin"
  /admin/llm/status:
    get:
      description: "게이트웨이의 자기보고와 upstream별 passive, active, catalog 현재 상태를 조회해요. 현\
        재 범위에서 읽을 수 있는 공급원에 연결된 공개 TOKEN 모델의 주 경로와 대체 경로 구성 관계도 제공해요. 전체 모델 목록이나 실\
        제 처리 경로를 보여 주는 것은 아니에요. 조회 과정에서 gateway나 upstream을 직접 호출하지 않으며 변경 작업도 제공하지\
        \ 않아요."
