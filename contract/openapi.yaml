    LlmActiveObservationResponse:
      description: "gateway의 out-of-band /models probe 최신 결과. routing과 cooldown을 바\
        꾸지 않아요. 마지막 시도가 intervalSeconds의 3배보다 오래되면 availability에 UNKNOWN으로 반영해요."
      properties:
        consecutiveFailures:
          description: "연속 probe 실패 수. 보고되지 않았으면 null"
          format: "int32"
