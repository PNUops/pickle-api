        version:
          format: "int32"
          type: "integer"
      required:
      - "displayName"
      - "id"
      - "minDiskGb"
      - "name"
      - "nodeId"
      - "osFamily"
      - "osVersion"
      - "proxmoxVmid"
      - "sshUsername"
      - "status"
      - "version"
      type: "object"
    AdminPortMappingResponse:
      properties:
        applyState:
          $ref: "#/components/schemas/PortForwardApplyState"
        createdAt:
          format: "date-time"
          type: "string"
        createdBy:
          format: "uuid"
          type:
          - "string"
          - "null"
        createdByName:
          description: "매핑을 만든 관리자 이름"
          type:
          - "string"
          - "null"
        ctMax:
          description: "동시 연결 상한 오버라이드 (null = 에이전트 기본, 0 = 해제)"
          format: "int32"
          type:
          - "integer"
          - "null"
        id:
          format: "uuid"
          type: "string"
        newConnBurst:
          description: "신규 연결 버스트 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        newConnRate:
          description: "초당 신규 연결 상한 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        perSourceBurst:
          description: "출발지별 버스트 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        perSourceRate:
          description: "출발지별 초당 신규 연결 상한 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        proto:
          $ref: "#/components/schemas/PortMappingProto"
        publicPort:
          format: "int32"
          type: "integer"
        relayId:
          format: "uuid"
          type: "string"
        relayName:
          type: "string"
        status:
          $ref: "#/components/schemas/PortMappingStatus"
        suspendedBy:
          description: "정지한 관리자 id (자동 정지면 null)"
          format: "uuid"
          type:
          - "string"
          - "null"
        suspendedByName:
          description: "정지한 관리자 이름 (자동 정지면 null)"
          type:
          - "string"
          - "null"
        suspendedReason:
          description: "정지 사유 (SUSPENDED일 때)"
          type:
          - "string"
          - "null"
        targetPort:
          format: "int32"
          type: "integer"
        vmId:
          format: "uuid"
          type: "string"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "applyState"
      - "createdAt"
      - "id"
      - "proto"
      - "publicPort"
      - "relayId"
      - "relayName"
      - "status"
      - "targetPort"
      - "vmId"
      type: "object"
    AdminRelayView:
      properties:
        agentVersion:
          type:
          - "string"
          - "null"
        appliedGeneration:
          description: "에이전트가 적용을 확인한 마지막 세대"
          format: "int64"
          type: "integer"
        bandEnd:
          description: "공개 포트 대역 끝"
          format: "int32"
          type: "integer"
        bandStart:
          description: "공개 포트 대역 시작"
