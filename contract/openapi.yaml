        lastError:
          type:
          - "string"
          - "null"
        linkPath:
          type:
          - "string"
          - "null"
        readAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        sentAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/NotificationStatus"
        title:
          type: "string"
        userEmail:
          type: "string"
        userId:
          format: "uuid"
          type: "string"
      required:
      - "attempts"
      - "body"
      - "channel"
      - "createdAt"
      - "event"
      - "id"
      - "importance"
      - "status"
      - "title"
      - "userEmail"
      - "userId"
      type: "object"
    AdminOsImageResponse:
      properties:
        displayName:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        minDiskGb:
          format: "int32"
          type: "integer"
        name:
          type: "string"
        nodeId:
          format: "uuid"
          type: "string"
        notes:
          type:
          - "string"
          - "null"
        osFamily:
          type: "string"
        osVersion:
          type: "string"
        proxmoxVmid:
          format: "int32"
          type: "integer"
        sshUsername:
          type: "string"
        status:
