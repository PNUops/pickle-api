      - "llm-key-access"
  /llm-keys/{keyId}/access/{grantId}:
    delete:
      description: "접근 권한을 회수해도 발급할 때 이미 확인한 키 평문은 회수되지 않아요. 필요하면 키를 재발급해 주세요."
      operationId: "removeLlmKeyAccessGrant"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "path"
        name: "grantId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "204":
          description: "No Content"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "접근 권한 회수"
      tags:
      - "llm-key-access"
    patch:
      operationId: "updateLlmKeyAccessGrant"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "path"
        name: "grantId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceAccessGrantRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceAccessGrantView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "접근 권한 등급 변경"
      tags:
      - "llm-key-access"
  /llm-keys/{keyId}/bodies:
    get:
      description: "본문 기록을 켠 동안 이 키로 오간 프롬프트와 응답의 목록이에요. 각 행에는 앞부분만 담기며 전문은 개별 조회로\
        \ 확인해요. **이 키에 접근 권한이 있으면 누구나 읽을 수 있어요.** Gateway는 키만 인증해 보낸 사람을 구분하지 못하므로\
        \ 키 단위로 열람해요. 기록은 30일 동안 보관하고 지난 것부터 지워요. 본문 기록을 꺼도 이미 기록된 내용은 보관 기간까지 조회할\
        \ 수 있어요."
      operationId: "listLlmKeyBodies"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - description: "한 번에 가져올 개수. 한 건이 최대 320 KiB라 통상 목록보다 상한이 낮아요."
        in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 50
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseLlmKeyBodySummaryResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "기록된 본문 목록"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}/bodies/{bodyId}:
    get:
      description: "기록 한 건의 전문이에요. `request`는 보통 보낸 messages 배열 그대로이며 길이 제한에 걸리면 앞\
        부분을 담은 문자열이에요."
      operationId: "getLlmKeyBody"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "path"
        name: "bodyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmKeyBodyDetailResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "기록된 본문 상세"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}/models:
    get:
      description: "이 키에서 선택할 모델 후보예요. 자체 서빙 모델은 플랫폼 카탈로그에서, 유료 모델은 공급자 목록의 캐시에서 가\
        져와요. 키에 모델 허용 목록이 있으면 그 목록에 맞는 것만 담기고, 금액 한도가 아직 없어도 무엇을 신청할지 볼 수 있도록 목록을\
        \ 제공해요. 최종 판정은 호출 시점에 이루어지므로 여기 있는 모델이 항상 응답한다는 보장은 아니에요."
      operationId: "listLlmKeyModels"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmKeyModelsResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "LLM API 키로 호출할 수 있는 모델"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}/revoke:
    post:
      description: "이 키를 폐기해요. 변경이 Gateway에 반영되면 이 키로 새로 인증하는 요청은 '폐기된 키'로 거절돼요. 사\
        용 기록은 남아요."
      operationId: "revokeLlmKey"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "204":
          description: "No Content"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "LLM API 키 폐기"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}/token:
    post:
      description: "키 평문을 만들어 **한 번만** 반환해요. 서버에는 평문을 저장하지 않으므로 다시 조회할 수 없어요. 잃어버렸\
        다면 이 경로로 재발급해 주세요. 재발급한 값이 Gateway에 반영되면 이전 값으로 새 요청을 인증할 수 없어요."
      operationId: "issueLlmKeyToken"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IssuedLlmKeyResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "LLM API 키 발급"
      tags:
      - "llm-keys"
  /llm-keys/{keyId}/usage:
    get:
      description: "이 키의 일별 사용량을 조회해요. 하루는 한국 시간 기준이며 호출이 없던 날도 0으로 채워요. Gateway가\
        \ 배치로 보고하므로 오늘 값은 아직 집계 중이에요."
      operationId: "getLlmKeyUsage"
      parameters:
      - in: "path"
        name: "keyId"
        required: true
        schema:
