          description: "리셋 창이 없는 키의 한도 합계"
          type: "number"
        committedUsage:
          description: "살아 있는 키의 리셋을 반영한 누적 사용액 합계예요. 현재 창의 사용액이 아닌 사업 계정 기준점 이후의\
            \ 누계이며 폐기되거나 만료된 키의 몫은 빠져 있어 credits.managedUsageSinceBaseline과는 다른 값이\
            에요."
          type: "number"
        committedWeekly:
          description: "주간 리셋 키의 한도 합계이며 창마다 다시 채워져요."
          type: "number"
        remainingCommitment:
          description: "키마다 금액 한도에서 공급자 누적 사용액을 빼고 음수는 0으로 두어 합산한 캐시 추정치예요. 사용액 미보\
            고 키는 한도 전액을 포함하며 대사는 30분 주기로 시도해요. 현재 리셋 창의 실제 잔여 한도와는 달라요."
          type: "number"
