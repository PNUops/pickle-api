          description: "이 VM의 소유자 이름. 접근을 요청할 상대입니다."
          items:
            type: "string"
          type: "array"
        requestId:
          format: "uuid"
          type:
          - "string"
          - "null"
        sshGatewayBlocked:
          type:
          - "boolean"
          - "null"
        status:
          $ref: "#/components/schemas/VmStatus"
        statusDetail:
          type:
          - "string"
          - "null"
        vcpu:
          description: "vCPU. 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
        workspaceId:
          description: "소유 워크스페이스. 행이 사라진 경우에만 null입니다."
          format: "uuid"
          type:
          - "string"
          - "null"
        workspaceName:
          type: "string"
      required:
      - "accessLimited"
      - "accessManageAllowed"
      - "createdAt"
      - "id"
      - "name"
      - "ownerNames"
      - "status"
      - "workspaceName"
      type: "object"
    WithdrawRequest:
      properties:
        password:
          minLength: 1
          type: "string"
        recoveryCode:
          type: "string"
        totpCode:
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "password"
      type: "object"
    WorkspaceDetailResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        description:
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        members:
          items:
            $ref: "#/components/schemas/WorkspaceMemberResponse"
          type: "array"
        myRole:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        name:
          type: "string"
      required:
      - "createdAt"
      - "id"
      - "kind"
      - "members"
      - "myRole"
      - "name"
      type: "object"
    WorkspaceKind:
      enum:
      - "PERSONAL"
      - "TEAM"
      - "PROJECT"
      type: "string"
    WorkspaceMemberResponse:
      properties:
        email:
          type: "string"
        name:
          type: "string"
        role:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        userId:
          format: "uuid"
          type: "string"
      required:
      - "email"
      - "name"
      - "role"
      - "userId"
      type: "object"
    WorkspaceMemberRole:
      enum:
      - "OWNER"
      - "MEMBER"
      type: "string"
    WorkspacePanel:
      properties:
        activeVms:
          deprecated: true
          description: "호환용 VM 목록. 새 클라이언트는 vm.workspaceResources.activeVms를 사용합니다\
            ."
          items:
            $ref: "#/components/schemas/VmBriefResponse"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        members:
          items:
            $ref: "#/components/schemas/MemberBrief"
          type: "array"
        name:
          type: "string"
        totals:
          $ref: "#/components/schemas/ResourceTotalsResponse"
          deprecated: true
          description: "호환용 VM 합계. 새 클라이언트는 vm.workspaceResources.totals를 사용합니다."
      required:
      - "activeVms"
      - "id"
      - "kind"
      - "members"
      - "name"
      - "totals"
      type: "object"
    WorkspaceSummaryResponse:
      properties:
        description:
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        memberCount:
          format: "int64"
          type: "integer"
        myRole:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        name:
          type: "string"
      required:
      - "id"
      - "kind"
      - "memberCount"
      - "myRole"
      - "name"
      type: "object"
  securitySchemes:
    bearerAuth:
      bearerFormat: "JWT"
      description: "액세스 토큰 (JWT HS256, 15분 만료). 클레임: sub(계정 공개 식별자 UUID), role, token_version.\
        \ 비밀번호 변경·계정 비활성화 시 token_version이 올라가 기존 토큰이 즉시 무효화됩니다. 리프레시 토큰은 보안 스킴이 아\
        니라 __Host-pickle_refresh httpOnly 쿠키로만 오갑니다."
      scheme: "bearer"
      type: "http"
info:
  description: "부산대학교 클라우드 플랫폼 Pickle의 REST API. 인증은 JWT Bearer, 오류 응답은 RFC 9457 problem+json(Problem\
    \ 스키마)을 따릅니다."
  title: "Pickle API"
  version: "0.62.0"
openapi: "3.1.0"
paths:
  /admin/announcements:
    get:
      operationId: "listAnnouncements"
      parameters:
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAnnouncementView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
    post:
      operationId: "createAnnouncement"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnnouncementView"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
  /admin/audit:
    get:
      operationId: "listAuditLogs"
      parameters:
      - in: "query"
        name: "actorEmail"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "action"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetType"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetId"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "from"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "to"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAuditLogViewResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-audit-controller"
  /admin/campus-ip-requests:
    get:
      operationId: "listAdminCampusIpRequests"
      parameters:
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/CampusIpRequestStatus"
      - in: "query"
        name: "vmId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminCampusIpRequestView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-campus-ip-request-controller"
  /admin/campus-ip-requests/{requestId}/status:
    post:
      operationId: "updateAdminCampusIpRequestStatus"
      parameters:
      - in: "path"
        name: "requestId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampusIpRequestStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCampusIpRequestView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-campus-ip-request-controller"
  /admin/capacity-trend:
    get:
      operationId: "getAdminCapacityTrend"
      parameters:
      - in: "query"
        name: "days"
        required: false
        schema:
          default: 90
          format: "int32"
          maximum: 365
          minimum: 7
          type: "integer"
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CapacityTrendResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-summary-controller"
  /admin/certificates:
    get:
      operationId: "listAdminCertificates"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/CertificateStatus"
      - in: "query"
        name: "expiringInDays"
        required: false
        schema:
          format: "int32"
          minimum: 1
          type: "integer"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminCertificateView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/domains:
    get:
      operationId: "listAdminDomains"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "kind"
        required: false
        schema:
          $ref: "#/components/schemas/DomainKind"
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/DomainStatus"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminDomainView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/domains/{domainId}/force-release:
    post:
      operationId: "forceReleaseDomain"
      parameters:
      - in: "path"
        name: "domainId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/domains/{domainId}/verify:
    post:
      operationId: "verifyAdminDomain"
      parameters:
      - in: "path"
        name: "domainId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "202":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Accepted"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/drift-findings:
    get:
      operationId: "listDriftFindings"
      parameters:
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/DriftFindingStatus"
      - in: "query"
        name: "kind"
        required: false
        schema:
          $ref: "#/components/schemas/DriftFindingKind"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseDriftFindingResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-drift-controller"
  /admin/drift-findings/{findingId}/resolve:
    post:
      operationId: "resolveDriftFinding"
      parameters:
      - in: "path"
        name: "findingId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDriftFindingRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DriftFindingResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-drift-controller"
  /admin/ip-allocations:
    get:
      operationId: "listIpAllocations"
      parameters:
      - in: "query"
        name: "poolId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/AllocationStatus"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseIpAllocationResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-ip-allocation-controller"
  /admin/llm/accounts:
    get:
      description: "관리 범위의 사업별 OpenRouter account와 credential 상태를 조회합니다. 인증 정보와 vendor\
        \ 내부 식별자는 반환하지 않습니다."
      operationId: "listAdminLlmAccounts"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/OpenRouterAccountResponse"
                type: "array"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 목록"
      tags:
      - "admin"
    post:
      description: "기관에 사업별 account metadata를 등록합니다. 재인증과 이름 확인이 필요하며 management credential은\
        \ 별도 stage 작업으로 검증합니다."
      operationId: "createAdminLlmAccount"
      parameters:
      - description: "재인증(sudo-mode) 토큰 — POST /auth/reverify가 발급 (10분 유효, 다회용). 없\
          거나 만료·무효면 403 REAUTH_REQUIRED."
        in: "header"
        name: "X-Reauth-Token"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenRouterAccountRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "Created"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "재인증 필요 — 유효한 X-Reauth-Token 없음 (`REAUTH_REQUIRED`)"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 등록"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}:
    get:
      description: "관리 범위의 사업 계정 정보, 유료 모델 연결 가능 여부, 연결된 키 수와 관리용 키 상태를 조회합니다. 키 값\
        은 반환하지 않습니다."
      operationId: "getAdminLlmAccount"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 상세"
      tags:
      - "admin"
    patch:
      description: "이름·사업·담당자·상태 중 보낸 항목만 변경합니다. 활성 또는 미만료 key가 연결된 account는 보관할 수\
        \ 없습니다."
      operationId: "updateAdminLlmAccount"
      parameters:
      - in: "path"
        name: "accountId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOpenRouterAccountRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OpenRouterAccountResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      summary: "OpenRouter 사업 계정 정보 수정"
      tags:
      - "admin"
  /admin/llm/accounts/{accountId}/credentials/active/delete:
    post:
      description: "연결된 key와 rotation이 없고 운영자가 vendor console 폐기를 확인한 경우에만 ACTIVE\
        \ 암호문을 삭제합니다. API는 vendor management key 자체를 폐기하지 않습니다."
