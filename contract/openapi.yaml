---
components:
  schemas:
    AccessGranteeType:
      enum:
      - "USER"
      - "GROUP"
      type: "string"
    ActivateMfaRequest:
      properties:
        code:
          minLength: 1
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "code"
      type: "object"
    ActivityEntryResponse:
      properties:
        action:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        detail: {}
        id:
          format: "int64"
          type: "integer"
        ip:
          type:
          - "string"
          - "null"
        targetId:
          type:
          - "string"
          - "null"
        targetType:
          type:
          - "string"
          - "null"
      required:
      - "action"
      - "createdAt"
      - "id"
      type: "object"
    AddGroupMemberRequest:
      properties:
        email:
          format: "email"
          minLength: 1
          type: "string"
        role:
          $ref: "#/components/schemas/GroupMemberRole"
      required:
      - "email"
      - "role"
      type: "object"
    AddVmAccessGrantRequest:
      properties:
        granteeType:
          $ref: "#/components/schemas/AccessGranteeType"
          description: "USER는 지정된 사용자 한 명, GROUP은 소유 그룹 전체"
        role:
          $ref: "#/components/schemas/ResourceRole"
          description: "부여할 등급. 그룹 전체 항목에는 MEMBER 또는 VIEWER만 지정할 수 있습니다."
        userId:
          description: "대상 사용자 id. granteeType이 USER일 때만 보내며, 소유 그룹의 구성원이어야 합니다."
          format: "int64"
          type:
          - "integer"
          - "null"
      required:
      - "granteeType"
      - "role"
      type: "object"
    AdminCampusIpRequestView:
      properties:
        adminNote:
          type:
          - "string"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        grantedAddress:
          description: "연결된 교내 IP 주소 (10.0.0.0/8)"
          type:
          - "string"
          - "null"
        id:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type:
          - "integer"
          - "null"
        ports:
          description: "사용할 포트 번호 목록"
          items:
            format: "int32"
            type: "integer"
          type: "array"
        processedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        processedBy:
          format: "int64"
          type:
          - "integer"
          - "null"
        purpose:
          description: "신청 목적"
          type: "string"
        requestedBy:
          format: "int64"
          type: "integer"
        requesterEmail:
          description: "신청자 이메일"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/CampusIpRequestStatus"
          description: "신청 상태 (REQUESTED = 신청, APPROVED = 관리자 승인, GRANTED = 교내 IP\
            \ 연결 완료, REJECTED = 반려, REVOKED = 회수)"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "createdAt"
      - "id"
      - "ports"
      - "purpose"
      - "requestedBy"
      - "status"
      - "vmId"
      type: "object"
    AdminCertificateView:
      properties:
        daysUntilExpiry:
          format: "int32"
          type:
          - "integer"
          - "null"
        domainId:
          format: "int64"
          type:
          - "integer"
          - "null"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/CertificateKind"
        lastError:
          type:
          - "string"
          - "null"
        notAfter:
          format: "date-time"
          type:
          - "string"
          - "null"
        scope:
          type: "string"
        status:
          $ref: "#/components/schemas/CertificateStatus"
      required:
      - "id"
      - "kind"
      - "scope"
      - "status"
      type: "object"
    AdminDomainView:
      properties:
        certificateStatus:
          anyOf:
          - $ref: "#/components/schemas/CertificateStatus"
          - type: "null"
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/DomainKind"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        releasedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        reservedUntil:
          format: "date-time"
          type:
          - "string"
          - "null"
        rootDomain:
          type:
          - "string"
          - "null"
        routeStatus:
          anyOf:
          - $ref: "#/components/schemas/RouteStatus"
          - type: "null"
        status:
          $ref: "#/components/schemas/DomainStatus"
        updatedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        verifiedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      required:
      - "createdAt"
      - "fqdn"
      - "groupId"
      - "groupName"
      - "id"
      - "kind"
      - "orgId"
      - "orgName"
      - "status"
      - "vmId"
      - "vmName"
      type: "object"
    AdminGroupDetailResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        description:
          type:
          - "string"
          - "null"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/GroupKind"
        memberCount:
          format: "int64"
          type: "integer"
        members:
          items:
            $ref: "#/components/schemas/AdminGroupMemberResponse"
          type: "array"
        name:
          type: "string"
        slug:
          type: "string"
        vmCount:
          format: "int64"
          type: "integer"
      required:
      - "createdAt"
      - "id"
      - "kind"
      - "memberCount"
      - "members"
      - "name"
      - "slug"
      - "vmCount"
      type: "object"
    AdminGroupMemberResponse:
      properties:
        email:
          type: "string"
        groupRole:
          $ref: "#/components/schemas/GroupMemberRole"
        joinedAt:
          format: "date-time"
          type: "string"
        name:
          type: "string"
        userId:
          format: "int64"
          type: "integer"
        userStatus:
          $ref: "#/components/schemas/UserStatus"
      required:
      - "email"
      - "groupRole"
      - "joinedAt"
      - "name"
      - "userId"
      - "userStatus"
      type: "object"
    AdminGroupOptionResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/GroupKind"
        memberCount:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        slug:
          type: "string"
      required:
      - "createdAt"
      - "id"
      - "kind"
      - "memberCount"
      - "name"
      - "slug"
      type: "object"
    AdminNotificationResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        body:
          type: "string"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        createdAt:
          format: "date-time"
          type: "string"
        event:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        importance:
          $ref: "#/components/schemas/NotificationImportance"
        lastError:
          type:
          - "string"
          - "null"
        linkPath:
          type:
          - "string"
          - "null"
        readAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        sentAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/NotificationStatus"
        title:
          type: "string"
        userEmail:
          type: "string"
        userId:
          format: "int64"
          type: "integer"
      required:
      - "attempts"
      - "body"
      - "channel"
      - "createdAt"
      - "event"
      - "id"
      - "importance"
      - "status"
      - "title"
      - "userEmail"
      - "userId"
      type: "object"
    AdminOsImageResponse:
      properties:
        displayName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        minDiskGb:
          format: "int32"
          type: "integer"
        name:
          type: "string"
        nodeId:
          format: "int64"
          type: "integer"
        notes:
          type:
          - "string"
          - "null"
        osFamily:
          type: "string"
        osVersion:
          type: "string"
        proxmoxVmid:
          format: "int32"
          type: "integer"
        sshUsername:
          type: "string"
        status:
          $ref: "#/components/schemas/CatalogStatus"
        version:
          format: "int32"
          type: "integer"
      required:
      - "displayName"
      - "id"
      - "minDiskGb"
      - "name"
      - "nodeId"
      - "osFamily"
      - "osVersion"
      - "proxmoxVmid"
      - "sshUsername"
      - "status"
      - "version"
      type: "object"
    AdminPortMappingResponse:
      properties:
        applyState:
          $ref: "#/components/schemas/PortForwardApplyState"
        createdAt:
          format: "date-time"
          type: "string"
        createdBy:
          format: "int64"
          type: "integer"
        ctMax:
          description: "동시 연결 상한 오버라이드 (null = 에이전트 기본, 0 = 해제)"
          format: "int32"
          type:
          - "integer"
          - "null"
        id:
          format: "int64"
          type: "integer"
        newConnBurst:
          description: "신규 연결 버스트 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        newConnRate:
          description: "초당 신규 연결 상한 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        perSourceBurst:
          description: "출발지별 버스트 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        perSourceRate:
          description: "출발지별 초당 신규 연결 상한 오버라이드"
          format: "int32"
          type:
          - "integer"
          - "null"
        proto:
          $ref: "#/components/schemas/PortMappingProto"
        publicPort:
          format: "int32"
          type: "integer"
        relayId:
          format: "int64"
          type: "integer"
        relayName:
          type: "string"
        status:
          $ref: "#/components/schemas/PortMappingStatus"
        suspendedBy:
          description: "정지한 관리자 id (자동 정지면 null)"
          format: "int64"
          type:
          - "integer"
          - "null"
        suspendedReason:
          description: "정지 사유 (SUSPENDED일 때)"
          type:
          - "string"
          - "null"
        targetPort:
          format: "int32"
          type: "integer"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "applyState"
      - "createdAt"
      - "createdBy"
      - "id"
      - "proto"
      - "publicPort"
      - "relayId"
      - "relayName"
      - "status"
      - "targetPort"
      - "vmId"
      type: "object"
    AdminRelayView:
      properties:
        agentVersion:
          type:
          - "string"
          - "null"
        appliedGeneration:
          description: "에이전트가 적용을 확인한 마지막 세대"
          format: "int64"
          type: "integer"
        bandEnd:
          description: "공개 포트 대역 끝"
          format: "int32"
          type: "integer"
        bandStart:
          description: "공개 포트 대역 시작"
          format: "int32"
          type: "integer"
        bandUsagePercent:
          description: "공개 포트 대역 사용률(%)"
          format: "int32"
          type: "integer"
        contactLost:
          description: "접촉 두절 여부 (마지막 동기화가 폴링 주기 3배를 초과)"
          type: "boolean"
        enabled:
          type: "boolean"
        id:
          format: "int64"
          type: "integer"
        lastContactAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        lastError:
          description: "에이전트가 보고한 마지막 적용 오류(JSON, 정화됨). 없으면 null"
          type:
          - "string"
          - "null"
        mappingCount:
          description: "이 릴레이의 매핑 수"
          format: "int64"
          type: "integer"
        mappingGeneration:
          description: "현재 매핑 세대 (매핑 변경마다 증가)"
          format: "int64"
          type: "integer"
        name:
          type: "string"
        publicHost:
          description: "사용자 접속용 공개 호스트 (설정 전이면 null)"
          type:
          - "string"
          - "null"
        tokenIssued:
          description: "동기화 토큰 발급 여부 (미발급이면 에이전트 인증이 항상 실패)"
          type: "boolean"
      required:
      - "appliedGeneration"
      - "bandEnd"
      - "bandStart"
      - "bandUsagePercent"
      - "contactLost"
      - "enabled"
      - "id"
      - "mappingCount"
      - "mappingGeneration"
      - "name"
      - "tokenIssued"
      type: "object"
    AdminRouteView:
      properties:
        appliedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        appliedGeneration:
          format: "int64"
          type:
          - "integer"
          - "null"
        domainId:
          format: "int64"
          type: "integer"
        domainKind:
          $ref: "#/components/schemas/DomainKind"
        fqdn:
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        lastError:
          type:
          - "string"
          - "null"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        protocol:
          type: "string"
        status:
          $ref: "#/components/schemas/RouteStatus"
        targetPort:
          format: "int32"
          type: "integer"
        updatedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      required:
      - "domainId"
      - "domainKind"
      - "fqdn"
      - "groupId"
      - "groupName"
      - "id"
      - "orgId"
      - "orgName"
      - "protocol"
      - "status"
      - "targetPort"
      - "vmId"
      - "vmName"
      type: "object"
    AdminTaskResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        createdAt:
          format: "date-time"
          type: "string"
        currentStep:
          format: "int32"
          type: "integer"
        groupName:
          type:
          - "string"
          - "null"
        hostname:
          type:
          - "string"
          - "null"
        jobrunrJobId:
          type:
          - "string"
          - "null"
        kind:
          $ref: "#/components/schemas/ProvisioningTaskKind"
        lastError:
          type:
          - "string"
          - "null"
        orgId:
          format: "int64"
          type:
          - "integer"
          - "null"
        orgName:
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/ProvisioningTaskStatus"
        stepLabel:
          type: "string"
        taskId:
          format: "int64"
          type: "integer"
        totalSteps:
          format: "int32"
          type: "integer"
        updatedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "attempts"
      - "createdAt"
      - "currentStep"
      - "kind"
      - "status"
      - "stepLabel"
      - "taskId"
      - "totalSteps"
      - "updatedAt"
      - "vmId"
      type: "object"
    AllocationStatus:
      enum:
      - "ALLOCATED"
      - "RELEASED"
      type: "string"
    AnnouncementCreateRequest:
      properties:
        body:
          maxLength: 10000
          minLength: 0
          type: "string"
        groupId:
          format: "int64"
          type:
          - "integer"
          - "null"
        orgId:
          format: "int64"
          type:
          - "integer"
          - "null"
        scope:
          $ref: "#/components/schemas/AnnouncementScope"
        title:
          maxLength: 200
          minLength: 0
          type: "string"
      required:
      - "body"
      - "scope"
      - "title"
      type: "object"
    AnnouncementScope:
      enum:
      - "ALL"
      - "ORG"
      - "GROUP"
      type: "string"
    AnnouncementView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        groupId:
          format: "int64"
          type:
          - "integer"
          - "null"
        id:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type:
          - "integer"
          - "null"
        recipientCount:
          format: "int32"
          type: "integer"
        scope:
          $ref: "#/components/schemas/AnnouncementScope"
        title:
          type: "string"
      required:
      - "createdAt"
      - "id"
      - "recipientCount"
      - "scope"
      - "title"
      type: "object"
    Applicant:
      properties:
        approvedCount:
          format: "int64"
          type: "integer"
        email:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        rejectedCount:
          format: "int64"
          type: "integer"
        signupAt:
          format: "date-time"
          type: "string"
      required:
      - "approvedCount"
      - "email"
      - "id"
      - "name"
      - "rejectedCount"
      - "signupAt"
      type: "object"
    ApprovalContextResponse:
      properties:
        applicant:
          $ref: "#/components/schemas/Applicant"
        applicantResources:
          $ref: "#/components/schemas/Resources"
        group:
          $ref: "#/components/schemas/GroupPanel"
        guidance:
          type: "string"
        history:
          items:
            $ref: "#/components/schemas/HistoryEntry"
          type: "array"
        orgHeadroom:
          $ref: "#/components/schemas/OrgHeadroom"
      required:
      - "applicant"
      - "applicantResources"
      - "group"
      - "guidance"
      - "history"
      - "orgHeadroom"
      type: "object"
    ApproveVmRequestRequest:
      properties:
        comment:
          maxLength: 2000
          minLength: 0
          type:
          - "string"
          - "null"
        grantedDiskGb:
          format: "int32"
          minimum: 1
          type: "integer"
        grantedEndDate:
          format: "date"
          type:
          - "string"
          - "null"
        grantedImageId:
          format: "int64"
          type: "integer"
        grantedMemoryMb:
          format: "int32"
          minimum: 256
          type: "integer"
        grantedSlug:
          pattern: "^\\s*$|^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type:
          - "string"
          - "null"
        grantedStartDate:
          format: "date"
          type:
          - "string"
          - "null"
        grantedVcpu:
          format: "int32"
          minimum: 1
          type: "integer"
        nodeId:
          format: "int64"
          type:
          - "integer"
          - "null"
      required:
      - "grantedDiskGb"
      - "grantedImageId"
      - "grantedMemoryMb"
      - "grantedVcpu"
      type: "object"
    Attention:
      properties:
        expiredVmCount:
          format: "int64"
          type: "integer"
        failedTaskCount:
          format: "int64"
          type: "integer"
        needsAdminVmCount:
          format: "int64"
          type: "integer"
      required:
      - "expiredVmCount"
      - "failedTaskCount"
      - "needsAdminVmCount"
      type: "object"
    AuditLogViewResponse:
      properties:
        action:
          type: "string"
        actorEmail:
          type:
          - "string"
          - "null"
        actorId:
          format: "int64"
          type:
          - "integer"
          - "null"
        actorName:
          type:
          - "string"
          - "null"
        actorRole:
          type:
          - "string"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        detail: {}
        id:
          format: "int64"
          type: "integer"
        ip:
          type:
          - "string"
          - "null"
        orgName:
          type:
          - "string"
          - "null"
        targetId:
          type:
          - "string"
          - "null"
        targetType:
          type:
          - "string"
          - "null"
      required:
      - "action"
      - "createdAt"
      - "id"
      type: "object"
    AuthTokenResponse:
      properties:
        accessToken:
          type: "string"
        user:
          $ref: "#/components/schemas/UserSummaryResponse"
      required:
      - "accessToken"
      - "user"
      type: "object"
