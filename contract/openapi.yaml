      description: "신청 대상자로 지정할 학번 명단을 제출하기 전에 확인해요. 학번마다 이미 구성원인지, 활성 계정이 있지만 구성원\
        이 아닌지, 대기 중인 초대가 있는지, 계정도 초대도 없는지를 요청과 같은 순서로 반환해요. 구성원 추가나 초대는 실행하지 않으며 학\
        번 대상자로 신청을 제출할 때 처리해요. 워크스페이스 소유자나 orgId로 지정한 기관에서 해당 명단 발급 업무가 있는 담당자만 호출\
        할 수 있고 개인 워크스페이스에는 쓸 수 없어요. 한 번에 500건까지, 1분에 10번까지, 한 시간에 2000건까지예요."
