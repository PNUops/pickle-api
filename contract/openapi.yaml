          - "integer"
          - "null"
        unknownAxisRequests:
          format: "int64"
          type:
          - "integer"
          - "null"
        unknownFinalUpstreamRequests:
          description: "최종 upstream이 기록되지 않은 요청 수예요. 모델 판정 전 거절과 과거 미귀속도 포함하며 특정 장\
            비 수요로 보지 않아요."
          format: "int64"
          type:
          - "integer"
          - "null"
        unknownKeyRequests:
          format: "int64"
          type:
          - "integer"
          - "null"
        unknownModelRequests:
