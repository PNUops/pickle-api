            \ pdf_ocr, images, embeddings, rerank, speech, transcriptions, videos,\
            \ batches를 지정할 수 있어요. 결과 목록에 web_search나 pdf_ocr가 있으면 chat도, batches가\
            \ 있으면 chat이나 embeddings도 함께 있어야 해요."
        rpm:
          description: "분당 요청 한도예요. 생략하면 유지하고 null이면 서비스 기본값을 따라요."
