                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "GPU 회수 검토 결정"
      tags:
      - "admin-gpu-controller"
  /admin/gpus:
    get:
      operationId: "listAdminGpus"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/GpuView"
                type: "array"
          description: "OK"
        default:
