          description: "발급된 키. 아직 발급받지 않았으면 null"
      type: "object"
    VmSshKeyView:
      description: "VM에 발급된 SSH 키 정보 (개인키는 포함하지 않는다)"
      properties:
        createdAt:
          description: "발급 시각"
          format: "date-time"
          type: "string"
        fileName:
          description: "내려받을 개인키 파일 이름"
          example: "pickle-algo-judge.pem"
          type: "string"
        fingerprint:
          description: "SHA256 지문 (ssh-keygen -lf 출력과 같은 형식)"
          example: "SHA256:abcdefghijklmnopqrstuvwxyz0123456789ABCDEFG"
          type: "string"
        id:
          description: "키 식별자"
          format: "uuid"
          type: "string"
        lastUsedAt:
          description: "이 키로 마지막에 접속한 시각 (없으면 null)"
          format: "date-time"
          type:
          - "string"
          - "null"
      required:
      - "createdAt"
      - "fileName"
      - "fingerprint"
      - "id"
      type: "object"
    VmStatus:
      enum:
      - "CREATING"
      - "RUNNING"
      - "STOPPED"
      - "REBOOTING"
      - "DELETING"
      - "DELETED"
      - "ERROR"
      - "NEEDS_ADMIN"
      type: "string"
    VmSummaryResponse:
      properties:
        accessLimited:
          description: "true면 이 VM의 접근 권한이 없어 이름·상태·소유자만 표시됩니다."
          type: "boolean"
        accessManageAllowed:
          description: "접근 권한이 없어도 접근 권한 목록을 관리할 수 있는지. 워크스페이스 소유자가 참입니다."
          type: "boolean"
        createdAt:
          format: "date-time"
          type: "string"
        diskGb:
          description: "디스크(GiB). 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
        displayName:
          type:
          - "string"
          - "null"
        endDate:
          format: "date"
          type:
          - "string"
          - "null"
        expiryStoppedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        hostname:
          description: "SSH 슬러그. 접근 권한이 없으면 생략됩니다."
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        memoryMb:
          description: "메모리(MiB). 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
        name:
          description: "SSH 슬러그. 접근 권한이 없으면 대신 표시 이름이 들어갑니다."
          type: "string"
        orgName:
          type:
          - "string"
          - "null"
        ownerNames:
          description: "이 VM의 소유자 이름. 접근을 요청할 상대입니다."
          items:
            type: "string"
          type: "array"
        requestId:
          format: "uuid"
          type:
          - "string"
          - "null"
        sshGatewayBlocked:
          type:
          - "boolean"
          - "null"
        status:
          $ref: "#/components/schemas/VmStatus"
        statusDetail:
          type:
          - "string"
          - "null"
        vcpu:
          description: "vCPU. 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
        workspaceId:
          description: "소유 워크스페이스. 행이 사라진 경우에만 null입니다."
          format: "uuid"
          type:
          - "string"
          - "null"
        workspaceName:
          type: "string"
      required:
      - "accessLimited"
      - "accessManageAllowed"
      - "createdAt"
      - "id"
      - "name"
      - "ownerNames"
      - "status"
      - "workspaceName"
      type: "object"
    WithdrawRequest:
      properties:
        password:
          minLength: 1
          type: "string"
        recoveryCode:
          type: "string"
        totpCode:
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "password"
      type: "object"
    WorkspaceDetailResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        description:
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        members:
          items:
            $ref: "#/components/schemas/WorkspaceMemberResponse"
          type: "array"
        myRole:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        name:
          type: "string"
      required:
      - "createdAt"
      - "id"
      - "kind"
      - "members"
      - "myRole"
      - "name"
      type: "object"
    WorkspaceKind:
      enum:
      - "PERSONAL"
      - "TEAM"
      - "PROJECT"
      type: "string"
    WorkspaceMemberResponse:
      properties:
        email:
          type: "string"
        name:
          type: "string"
        role:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        userId:
          format: "uuid"
          type: "string"
      required:
      - "email"
      - "name"
      - "role"
      - "userId"
      type: "object"
    WorkspaceMemberRole:
      enum:
      - "OWNER"
      - "MEMBER"
      type: "string"
    WorkspacePanel:
      properties:
        activeVms:
          items:
            $ref: "#/components/schemas/VmBriefResponse"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        members:
          items:
            $ref: "#/components/schemas/MemberBrief"
          type: "array"
        name:
          type: "string"
        totals:
          $ref: "#/components/schemas/ResourceTotalsResponse"
      required:
      - "activeVms"
      - "id"
      - "kind"
      - "members"
      - "name"
      - "totals"
      type: "object"
    WorkspaceSummaryResponse:
      properties:
        description:
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        memberCount:
          format: "int64"
          type: "integer"
        myRole:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        name:
          type: "string"
      required:
      - "id"
      - "kind"
      - "memberCount"
      - "myRole"
      - "name"
      type: "object"
  securitySchemes:
    bearerAuth:
      bearerFormat: "JWT"
      description: "액세스 토큰 (JWT HS256, 15분 만료). 클레임: sub(계정 공개 식별자 UUID), role, token_version.\
        \ 비밀번호 변경·계정 비활성화 시 token_version이 올라가 기존 토큰이 즉시 무효화됩니다. 리프레시 토큰은 보안 스킴이 아\
        니라 __Host-pickle_refresh httpOnly 쿠키로만 오갑니다."
      scheme: "bearer"
      type: "http"
info:
  description: "부산대학교 클라우드 플랫폼 Pickle의 REST API. 인증은 JWT Bearer, 오류 응답은 RFC 9457 problem+json(Problem\
    \ 스키마)을 따릅니다."
  title: "Pickle API"
  version: "0.48.0"
openapi: "3.1.0"
paths:
  /admin/announcements:
    get:
      operationId: "listAnnouncements"
      parameters:
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAnnouncementView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
    post:
      operationId: "createAnnouncement"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnnouncementView"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
