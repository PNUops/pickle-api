      - "fallback"
      - "primary"
      - "publicName"
      type: "object"
    LlmModelRouteState:
      description: "VISIBLE은 현재 응답에서 확인할 수 있는 등록 공급원이에요. NOT_CONFIGURED는 SYS 응답에서\
        \ 구성이 없다는 뜻이에요. NOT_PROVIDED는 참조를 제공하지 않는 상태이며 ORG에서는 미설정과 범위 밖, 미등록을 구분하지\
        \ 않아요."
      enum:
      - "VISIBLE"
      - "NOT_CONFIGURED"
      - "NOT_PROVIDED"
      type: "string"
    LlmNavigationCount:
      description: "현재 허용된 키 집합의 정확한 탐색 수예요. 미제공은 null이며 실제 0과 구분해요."
      properties:
        state:
          $ref: "#/components/schemas/LlmNavigationState"
        totalElements:
          format: "int64"
          type:
          - "integer"
          - "null"
      required:
      - "state"
      type: "object"
    LlmNavigationState:
      enum:
      - "AVAILABLE"
      - "NOT_PROVIDED"
      type: "string"
    LlmPassiveObservationResponse:
      description: "실제 사용자 요청에서 얻은 passive 관측. lastAttemptAt은 표시용이며, 가용성은 최근 15분 안\
        의 lastSuccessAt과 lastFailureAt으로 판정해요."
      properties:
        consecutiveFailures:
          description: "연속 health-impacting 실패 수. 보고되지 않았으면 null"
          format: "int32"
          type:
          - "integer"
          - "null"
        cooldownUntil:
          description: "실제 요청 실패로 생긴 routing cooldown 종료 시각. cooldown이 없으면 null"
          format: "date-time"
          type:
          - "string"
          - "null"
        lastAttemptAt:
          description: "마지막 실제 요청 시각. key-local 거절이나 취소도 포함하므로 상태 판정에는 사용하지 않음"
          format: "date-time"
          type:
          - "string"
          - "null"
        lastFailureAt:
          description: "마지막 health-impacting upstream 실패 시각. 15분이 지나면 현재 health 근거\
            로 사용하지 않음"
          format: "date-time"
          type:
          - "string"
          - "null"
        lastFailureType:
          description: "마지막 health-impacting 실패 분류. 실패 이력이 없으면 null"
          type:
          - "string"
          - "null"
        lastSuccessAt:
          description: "마지막 upstream 성공 시각. 15분이 지나면 현재 health 근거로 사용하지 않음"
