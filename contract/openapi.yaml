        status:
          $ref: "#/components/schemas/LlmApiKeyStatus"
        tokenPrefix:
          description: "두 키를 구별하는 평문 앞부분이에요. 아직 발급 전이면 null이에요."
          type:
          - "string"
          - "null"
        tpm:
          description: "분당 토큰 한도이며, null이면 Gateway 기본값을 따라요."
          format: "int32"
          type:
          - "integer"
          - "null"
        workspaceId:
          description: "소유 워크스페이스이며, 해당 행이 사라진 경우에만 null이에요."
          format: "uuid"
          type:
          - "string"
          - "null"
        workspaceName:
          type: "string"
