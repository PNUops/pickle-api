      description: "이메일이나 학번으로 한 번에 1명에서 200명까지 초대해요. 활성 계정이 있으면 바로 구성원(MEMBER)이 되\
        고, 없으면 초대가 대기하다가 그 사람이 가입하거나 학번을 등록하면 자동으로 구성원이 돼요. 초대는 만료되지 않으며 소유자가 취소할\
        \ 수 있어요. 결과는 항목마다 요청과 같은 순서로 반환해요. 소유자(OWNER)만 호출할 수 있고 개인 워크스페이스에는 초대할 수\
        \ 없어요."
