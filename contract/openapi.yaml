        schema:
          $ref: "#/components/schemas/AllocationStatus"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseIpAllocationResponse"
          description: "OK"
        default:
