---
components:
  schemas:
    ActivateMfaRequest:
      properties:
        code:
          minLength: 1
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "code"
      type: "object"
    ActivityEntryResponse:
      properties:
        action:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        detail:
          type:
          - "object"
          - "null"
        id:
          format: "int64"
          type: "integer"
        ip:
          type:
          - "string"
          - "null"
        targetId:
          type:
          - "string"
          - "null"
        targetType:
          type:
          - "string"
          - "null"
      required:
      - "action"
      - "createdAt"
      - "id"
      type: "object"
    AddGroupMemberRequest:
      properties:
        email:
          format: "email"
          minLength: 1
          type: "string"
        role:
          $ref: "#/components/schemas/GroupMemberRole"
      required:
      - "email"
      - "role"
      type: "object"
    AdminCertificateView:
      properties:
        daysUntilExpiry:
          format: "int32"
          type:
          - "integer"
          - "null"
        domainId:
          format: "int64"
          type:
          - "integer"
          - "null"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/CertificateKind"
        lastError:
          type:
          - "string"
          - "null"
        notAfter:
          format: "date-time"
          type:
          - "string"
          - "null"
        scope:
          type: "string"
        status:
          $ref: "#/components/schemas/CertificateStatus"
      required:
      - "id"
      - "kind"
      - "scope"
      - "status"
      type: "object"
    AdminDomainView:
      properties:
        certificateStatus:
          anyOf:
          - $ref: "#/components/schemas/CertificateStatus"
          - type: "null"
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/DomainKind"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        rootDomain:
          type:
          - "string"
          - "null"
        routeStatus:
          anyOf:
          - $ref: "#/components/schemas/RouteStatus"
          - type: "null"
        status:
          $ref: "#/components/schemas/DomainStatus"
        updatedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        verifiedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      required:
      - "createdAt"
      - "fqdn"
      - "groupId"
      - "groupName"
      - "id"
      - "kind"
      - "orgId"
      - "orgName"
      - "status"
      - "vmId"
      - "vmName"
      type: "object"
    AdminGroupOptionResponse:
      properties:
        id:
          format: "int64"
          type: "integer"
        memberCount:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        slug:
          type: "string"
      required:
      - "id"
      - "memberCount"
      - "name"
      - "slug"
      type: "object"
    AdminNotificationResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        body:
          type: "string"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        createdAt:
          format: "date-time"
          type: "string"
        event:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        importance:
          $ref: "#/components/schemas/NotificationImportance"
        lastError:
          type:
          - "string"
          - "null"
        linkPath:
          type:
          - "string"
          - "null"
        readAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        sentAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/NotificationStatus"
        title:
          type: "string"
        userEmail:
          type: "string"
        userId:
          format: "int64"
          type: "integer"
      required:
      - "attempts"
      - "body"
      - "channel"
      - "createdAt"
      - "event"
      - "id"
      - "importance"
      - "status"
      - "title"
      - "userEmail"
      - "userId"
      type: "object"
    AdminRouteView:
      properties:
        appliedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        appliedGeneration:
          format: "int64"
          type:
          - "integer"
          - "null"
        domainKind:
          $ref: "#/components/schemas/DomainKind"
        fqdn:
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        lastError:
          type:
          - "string"
          - "null"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        protocol:
          type: "string"
        status:
          $ref: "#/components/schemas/RouteStatus"
        targetPort:
          format: "int32"
          type: "integer"
        updatedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      required:
      - "domainKind"
      - "fqdn"
      - "groupId"
      - "groupName"
      - "id"
      - "orgId"
      - "orgName"
      - "protocol"
      - "status"
      - "targetPort"
      - "vmId"
      - "vmName"
      type: "object"
    AdminTaskResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        createdAt:
          format: "date-time"
          type: "string"
        currentStep:
          format: "int32"
          type: "integer"
        groupName:
          type:
          - "string"
          - "null"
        hostname:
          type:
          - "string"
          - "null"
        jobrunrJobId:
          type:
          - "string"
          - "null"
        kind:
          $ref: "#/components/schemas/ProvisioningTaskKind"
        lastError:
          type:
          - "string"
          - "null"
        orgId:
          format: "int64"
          type:
          - "integer"
          - "null"
        orgName:
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/ProvisioningTaskStatus"
        stepLabel:
          type: "string"
        taskId:
          format: "int64"
          type: "integer"
        totalSteps:
          format: "int32"
          type: "integer"
        updatedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "attempts"
      - "createdAt"
      - "currentStep"
      - "kind"
      - "status"
      - "stepLabel"
      - "taskId"
      - "totalSteps"
      - "updatedAt"
      - "vmId"
      type: "object"
    AllocationStatus:
      enum:
      - "ALLOCATED"
      - "RELEASED"
      type: "string"
    AnnouncementCreateRequest:
      properties:
        body:
          maxLength: 10000
          minLength: 0
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type: "integer"
        scope:
          $ref: "#/components/schemas/AnnouncementScope"
        title:
          maxLength: 200
          minLength: 0
          type: "string"
      required:
      - "body"
      - "scope"
      - "title"
      type: "object"
    AnnouncementScope:
      enum:
      - "ALL"
      - "ORG"
      - "GROUP"
      type: "string"
    AnnouncementView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        groupId:
          format: "int64"
          type:
          - "integer"
          - "null"
        id:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type:
          - "integer"
          - "null"
        recipientCount:
          format: "int32"
          type: "integer"
        scope:
          $ref: "#/components/schemas/AnnouncementScope"
        title:
          type: "string"
      required:
      - "createdAt"
      - "id"
      - "recipientCount"
      - "scope"
      - "title"
      type: "object"
    Applicant:
      properties:
        approvedCount:
          format: "int64"
          type: "integer"
        email:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        rejectedCount:
          format: "int64"
          type: "integer"
        signupAt:
          format: "date-time"
          type: "string"
      required:
      - "approvedCount"
      - "email"
      - "id"
      - "name"
      - "rejectedCount"
      - "signupAt"
      type: "object"
    ApprovalContextResponse:
      properties:
        applicant:
          $ref: "#/components/schemas/Applicant"
        applicantResources:
          $ref: "#/components/schemas/Resources"
        group:
          $ref: "#/components/schemas/GroupPanel"
        guidance:
          type: "string"
        history:
          items:
            $ref: "#/components/schemas/HistoryEntry"
          type: "array"
        orgHeadroom:
          $ref: "#/components/schemas/OrgHeadroom"
      required:
      - "applicant"
      - "applicantResources"
      - "group"
      - "guidance"
      - "history"
      - "orgHeadroom"
      type: "object"
    ApproveVmRequestRequest:
      properties:
        comment:
          maxLength: 2000
          minLength: 0
          type: "string"
        grantHttp:
          type: "boolean"
        grantPublic:
          type: "boolean"
        grantSsh:
          type: "boolean"
        grantedDiskGb:
          format: "int32"
          minimum: 1
          type: "integer"
        grantedEndDate:
          format: "date"
          type: "string"
        grantedMemoryMb:
          format: "int32"
          minimum: 256
          type: "integer"
        grantedRootDomain:
          type: "string"
        grantedSlug:
          pattern: "^\\s*$|^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type: "string"
        grantedStartDate:
          format: "date"
          type: "string"
        grantedSubdomain:
          type: "string"
        grantedTemplateId:
          format: "int64"
          type: "integer"
        grantedVcpu:
          format: "int32"
          minimum: 1
          type: "integer"
        nodeId:
          format: "int64"
          type: "integer"
      required:
      - "grantHttp"
      - "grantPublic"
      - "grantSsh"
      - "grantedDiskGb"
      - "grantedMemoryMb"
      - "grantedTemplateId"
      - "grantedVcpu"
      type: "object"
    Attention:
      properties:
        expiredVmCount:
          format: "int64"
          type: "integer"
        failedTaskCount:
          format: "int64"
          type: "integer"
        needsAdminVmCount:
          format: "int64"
          type: "integer"
      required:
      - "expiredVmCount"
      - "failedTaskCount"
      - "needsAdminVmCount"
      type: "object"
    AuditLogViewResponse:
      properties:
        action:
          type: "string"
        actorEmail:
          type:
          - "string"
          - "null"
        actorId:
          format: "int64"
          type:
          - "integer"
          - "null"
        actorName:
          type:
          - "string"
          - "null"
        actorRole:
          type:
          - "string"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        detail:
          type:
          - "object"
          - "null"
        id:
          format: "int64"
          type: "integer"
        ip:
          type:
          - "string"
          - "null"
        orgName:
          type:
          - "string"
          - "null"
        targetId:
          type:
          - "string"
          - "null"
        targetType:
          type:
          - "string"
          - "null"
      required:
      - "action"
      - "createdAt"
      - "id"
      type: "object"
    AuthTokenResponse:
      properties:
        accessToken:
          type: "string"
        user:
          $ref: "#/components/schemas/UserSummaryResponse"
      required:
      - "accessToken"
      - "user"
      type: "object"
    BeginMfaRequest:
      properties:
        password:
          minLength: 1
          type: "string"
      required:
      - "password"
      type: "object"
    Capacity:
      properties:
        cpuThreads:
          format: "int64"
          type: "integer"
        memoryMb:
          format: "int64"
          type: "integer"
      required:
      - "cpuThreads"
      - "memoryMb"
      type: "object"
    CertificateKind:
      enum:
      - "ORIGIN_CA_WILDCARD"
      - "LETS_ENCRYPT"
      type: "string"
    CertificateStatus:
      enum:
      - "ACTIVE"
      - "RENEWING"
      - "FAILED"
      - "REVOKED"
      type: "string"
    CertificateView:
      properties:
        kind:
          $ref: "#/components/schemas/CertificateKind"
        lastError:
          type:
          - "string"
          - "null"
        notAfter:
          format: "date-time"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/CertificateStatus"
      required:
      - "kind"
      - "status"
      type: "object"
    ChangePasswordRequest:
      properties:
        currentPassword:
          minLength: 1
          type: "string"
        newPassword:
          maxLength: 72
          minLength: 10
          type: "string"
      required:
      - "currentPassword"
      - "newPassword"
      type: "object"
    ConsentInput:
      properties:
        docType:
          $ref: "#/components/schemas/TermsDocType"
        version:
          format: "int32"
          type: "integer"
      required:
      - "docType"
      type: "object"
    ConsentUpdateRequest:
      properties:
        consents:
          items:
            $ref: "#/components/schemas/ConsentInput"
          minItems: 1
          type: "array"
      required:
      - "consents"
      type: "object"
    ConsentView:
      properties:
        consentedAt:
          format: "date-time"
          type: "string"
        docType:
          $ref: "#/components/schemas/TermsDocType"
        version:
          format: "int32"
          type: "integer"
      required:
      - "consentedAt"
      - "docType"
      - "version"
      type: "object"
    CreateGroupRequest:
      properties:
        description:
          maxLength: 500
          minLength: 0
          type: "string"
        kind:
          $ref: "#/components/schemas/GroupKind"
        name:
          maxLength: 100
          minLength: 0
          type: "string"
        slug:
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          type: "string"
      required:
      - "kind"
      - "name"
      - "slug"
      type: "object"
    CreateOrgRequest:
      properties:
        description:
          maxLength: 500
          minLength: 0
          type: "string"
        name:
          maxLength: 100
          minLength: 0
          type: "string"
        slug:
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          type: "string"
      required:
      - "name"
      - "slug"
      type: "object"
    CreateVmRequestRequest:
      properties:
        courseOrProject:
          maxLength: 200
          minLength: 0
          type: "string"
        customDomain:
          pattern: "^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
          type: "string"
        desiredSlug:
          pattern: "^\\s*$|^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type: "string"
        desiredSubdomain:
          pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type: "string"
        extraNote:
          maxLength: 2000
          minLength: 0
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        needHttp:
          type: "boolean"
        needPublic:
          type: "boolean"
        needSsh:
          type: "boolean"
        orgId:
          format: "int64"
          type: "integer"
        purpose:
          maxLength: 2000
          minLength: 0
          type: "string"
        reqDiskGb:
          format: "int32"
          minimum: 1
          type: "integer"
        reqEndDate:
          format: "date"
          type: "string"
        reqMemoryMb:
          format: "int32"
          minimum: 256
          type: "integer"
        reqStartDate:
          format: "date"
          type: "string"
        reqVcpu:
          format: "int32"
          minimum: 1
          type: "integer"
        rootDomain:
          maxLength: 253
          minLength: 0
          type: "string"
        specReason:
          maxLength: 2000
          minLength: 0
          type: "string"
        templateId:
          format: "int64"
          type: "integer"
      required:
      - "groupId"
      - "needHttp"
      - "needPublic"
      - "needSsh"
      - "orgId"
      - "purpose"
      - "reqDiskGb"
      - "reqMemoryMb"
      - "reqVcpu"
      - "templateId"
      type: "object"
    DisableMfaRequest:
      properties:
        code:
          pattern: "^[0-9]{6}$"
          type: "string"
        password:
          minLength: 1
          type: "string"
        recoveryCode:
          type: "string"
      required:
      - "password"
      type: "object"
    DisableUserRequest:
      properties:
        reason:
          maxLength: 500
          minLength: 1
          type: "string"
      required:
      - "reason"
      type: "object"
    DomainDetailView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/DomainKind"
        rootDomain:
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/DomainStatus"
        verification:
          anyOf:
          - $ref: "#/components/schemas/DomainVerificationView"
          - type: "null"
        verifiedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "int64"
          type: "integer"
      required:
      - "createdAt"
      - "fqdn"
      - "id"
      - "kind"
      - "status"
      - "vmId"
      type: "object"
    DomainKind:
      enum:
      - "AUTO"
      - "REQUESTED"
      - "CUSTOM"
      type: "string"
    DomainStatus:
      enum:
      - "PENDING"
      - "VERIFYING"
      - "ACTIVE"
      - "FAILED"
      - "REMOVED"
      type: "string"
    DomainSummaryView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/DomainKind"
        rootDomain:
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/DomainStatus"
        verifiedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        vmId:
          format: "int64"
          type: "integer"
      required:
      - "createdAt"
      - "fqdn"
      - "id"
      - "kind"
      - "status"
      - "vmId"
      type: "object"
    DomainVerificationView:
      properties:
        aVerified:
          type: "boolean"
        lastCheckedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        lastError:
          type:
          - "string"
          - "null"
        requiredRecords:
          items:
            $ref: "#/components/schemas/RequiredRecord"
          type: "array"
        token:
          type: "string"
        txtVerified:
          type: "boolean"
      required:
      - "aVerified"
      - "requiredRecords"
      - "token"
      - "txtVerified"
      type: "object"
    DriftFindingKind:
      enum:
      - "MISSING_IN_PROXMOX"
      - "UNMANAGED_GUEST"
      - "SPEC_MISMATCH"
      type: "string"
    DriftFindingResponse:
      properties:
        detail:
          type:
          - "object"
          - "null"
        firstSeenAt:
          format: "date-time"
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          $ref: "#/components/schemas/DriftFindingKind"
        lastSeenAt:
          format: "date-time"
          type: "string"
        nodeName:
          type:
          - "string"
          - "null"
        proxmoxVmid:
          format: "int32"
          type:
          - "integer"
          - "null"
        resolutionNote:
          type:
          - "string"
          - "null"
        resolvedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        resolvedByEmail:
          type:
          - "string"
          - "null"
        resolvedById:
          format: "int64"
          type:
          - "integer"
          - "null"
        status:
          $ref: "#/components/schemas/DriftFindingStatus"
        summary:
          type: "string"
        vmId:
          format: "int64"
          type:
          - "integer"
          - "null"
        vmName:
          type:
          - "string"
          - "null"
      required:
      - "firstSeenAt"
      - "id"
      - "kind"
      - "lastSeenAt"
      - "status"
      - "summary"
      type: "object"
    DriftFindingStatus:
      enum:
      - "OPEN"
      - "RESOLVED"
      type: "string"
    FieldValidationError:
      description: "검증 실패 필드 한 건 (422 응답의 errors[] 원소)"
      properties:
        field:
          description: "실패한 요청 필드 이름"
          type: "string"
        message:
          description: "한국어 오류 메시지"
          type: "string"
      required:
      - "field"
      - "message"
      type: "object"
    ForceDeleteVmRequest:
      properties:
        confirmName:
          minLength: 1
          type: "string"
        overrideProtection:
          type: "boolean"
      required:
      - "confirmName"
      type: "object"
    GroupDetailResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        description:
          type:
          - "string"
          - "null"
        id:
          format: "int64"
