      enum:
      - "VALID"
      - "PARTIAL"
      - "BASELINE"
      - "UNAVAILABLE"
      type: "string"
    InferenceObservationMetric:
      description: "gauge mean은 실제 측정 시각의 표본 평균이에요. 명시 sampleAt이 요청 기간이나 보존 범위 밖이면\
        \ UNKNOWN/null이며 현재 시각으로 옮기지 않아요. rate mean은 누적 차분 합/실제 시간 합, histogram mean은\
        \ sum 차분 합/count 차분 합이에요. 양끝이 요청 기간과 보존 범위 안인 완전 구간만 종료 시각의 버킷에 귀속하며, 부분 구\
        간을 나눠 추정하지 않아요. min/max는 gauge 표본값 또는 완전 구간 평균의 범위이며 분위수는 아니에요. intervalSeconds는\
        \ 해당 버킷에서 끝나는 완전 관측 구간의 실제 초 합으로 버킷 길이를 넘을 수 있고, gauge는 0이에요. 버킷 안의 정확한 요청\
        \ 시각 분포나 연속 센싱, 시간 점유율을 뜻하지 않아요. null과 실제 0은 달라요."
      properties:
        intervalSeconds:
          format: "double"
          type: "number"
        max:
          format: "double"
          type:
          - "number"
          - "null"
        mean:
          format: "double"
          type:
          - "number"
          - "null"
        min:
          format: "double"
          type:
          - "number"
          - "null"
        observedSamples:
          format: "int64"
          type: "integer"
        state:
          $ref: "#/components/schemas/InferenceObservationValueState"
      required:
      - "intervalSeconds"
      - "observedSamples"
      - "state"
      type: "object"
    InferenceObservationPoint:
      description: "요청한 시작 시각을 포함하고 종료 시각을 제외한 버킷이에요. samples는 원천 observedAt에 따른 snapshot\
        \ 행 수이며, gauge의 명시 측정 시각이나 완전 구간의 종료 시각과 다를 수 있어요. samples가 0이어도 개별 metric의\
        \ 실제 측정값은 유효할 수 있어요. 보존 범위 밖 수치와 계산할 수 없는 비율은 null이며, 장비 측정값 0으로 채우지 않아요."
      properties:
        engines:
          items:
            $ref: "#/components/schemas/InferenceObservationEngine"
          type: "array"
        failedSamples:
          format: "int64"
          type:
          - "integer"
          - "null"
        from:
          format: "date-time"
          type: "string"
        host:
          additionalProperties:
            $ref: "#/components/schemas/InferenceObservationMetric"
          type: "object"
        retentionState:
          $ref: "#/components/schemas/InferenceObservationRetentionState"
        samples:
          format: "int64"
          type:
          - "integer"
          - "null"
        to:
          format: "date-time"
          type: "string"
      required:
      - "engines"
      - "from"
      - "host"
      - "retentionState"
      - "to"
      type: "object"
    InferenceObservationRetentionState:
      enum:
      - "WITHIN"
      - "PARTIAL"
      - "OUTSIDE"
      type: "string"
    InferenceObservationValueState:
      enum:
      - "OBSERVED"
      - "UNKNOWN"
      - "NOT_REPORTED"
      - "UNSUPPORTED"
      - "SOURCE_FAILED"
      type: "string"
    InferenceObservationView:
      description: "고정된 보고 원천의 장비 전체 표본이에요. 기관과 워크스페이스, 원인, 공개 모델 수요 필터에 따른 개인별 장비\
        \ 점유율은 제공하지 않아요."
      properties:
        bucketSeconds:
          format: "int32"
          type: "integer"
        evidence:
          $ref: "#/components/schemas/InferenceObservationEvidence"
        from:
          format: "date-time"
          type: "string"
        retentionDays:
          format: "int32"
          type: "integer"
        sampleIntervalSeconds:
          format: "int32"
          type: "integer"
        series:
          items:
            $ref: "#/components/schemas/InferenceObservationPoint"
          type: "array"
        sourceId:
          format: "uuid"
          type: "string"
        to:
          format: "date-time"
          type: "string"
        upstreamId:
          format: "uuid"
          type: "string"
        upstreamName:
          type:
          - "string"
          - "null"
      required:
      - "bucketSeconds"
      - "evidence"
      - "from"
      - "retentionDays"
      - "sampleIntervalSeconds"
      - "series"
      - "sourceId"
      - "to"
      - "upstreamId"
      type: "object"
    InstitutionAdminLlmBudgetResponse:
