          format: "date-time"
          type:
          - "string"
          - "null"
        keyMetersError:
          type:
          - "string"
          - "null"
        keyMetersFreshness:
          $ref: "#/components/schemas/OpenRouterCreditsFreshness"
        keyMetersLastAttemptAt:
