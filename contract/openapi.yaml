          format: "int64"
          type: "integer"
        orgName:
          type:
          - "string"
          - "null"
        passwordAvailable:
          type: "boolean"
        passwordRevealAllowed:
          type: "boolean"
        powerControlAllowed:
          description: "전원을 제어할 수 있는지"
          type: "boolean"
        provisioning:
          anyOf:
          - $ref: "#/components/schemas/ProvisioningTaskResponse"
          - type: "null"
        publications:
          items:
            $ref: "#/components/schemas/PublicationView"
          type: "array"
        requestId:
          format: "int64"
          type: "integer"
        settingsEditAllowed:
          description: "VM 설정을 볼·바꿀 수 있는지"
          type: "boolean"
        sshGatewayBlocked:
          type: "boolean"
        sshHost:
          type: "string"
        sshUsername:
          type: "string"
        startDate:
          format: "date"
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/VmStatus"
        statusDetail:
          type:
          - "string"
          - "null"
        updatedAt:
          format: "date-time"
          type: "string"
        vcpu:
          format: "int32"
          type: "integer"
      required:
      - "accessAllowed"
      - "accessManageAllowed"
      - "createdAt"
      - "deleteAllowed"
      - "diskGb"
      - "groupId"
      - "groupName"
      - "hostname"
      - "id"
      - "imageId"
      - "memoryMb"
      - "name"
      - "orgId"
      - "passwordAvailable"
      - "passwordRevealAllowed"
      - "powerControlAllowed"
      - "publications"
      - "requestId"
      - "settingsEditAllowed"
      - "sshGatewayBlocked"
      - "sshHost"
      - "sshUsername"
      - "status"
      - "updatedAt"
      - "vcpu"
      type: "object"
    VmEventResponse:
      properties:
        actorId:
          format: "int64"
          type:
          - "integer"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        detail:
          type:
          - "string"
          - "null"
        id:
          format: "int64"
          type: "integer"
        type:
          $ref: "#/components/schemas/VmEventType"
      required:
      - "createdAt"
      - "id"
      - "type"
      type: "object"
    VmEventType:
      enum:
      - "CREATE"
      - "START"
      - "STOP"
      - "REBOOT"
      - "FORCE_STOP"
      - "DELETE"
      - "SELF_DELETE"
      - "FORCE_DELETE"
      - "REINSTALL"
      - "SCHEDULE_DELETE"
      - "CANCEL_SCHEDULED_DELETE"
      - "PUBLISH"
      - "UNPUBLISH"
      - "EXPIRE_STOP"
      - "PERIOD_UPDATE"
      - "GATEWAY_BLOCK"
      - "GATEWAY_UNBLOCK"
      - "PORT_FORWARD_CREATE"
      - "PORT_FORWARD_DELETE"
      type: "string"
    VmFlavorResponse:
      properties:
        diskGb:
          format: "int32"
          type: "integer"
        displayName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        memoryMb:
          format: "int32"
          type: "integer"
        name:
          type: "string"
        notes:
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/CatalogStatus"
        vcpu:
          format: "int32"
          type: "integer"
      required:
      - "diskGb"
      - "displayName"
      - "id"
      - "memoryMb"
      - "name"
      - "status"
      - "vcpu"
      type: "object"
    VmGatewayBlockUpdateRequest:
      properties:
        blocked:
          description: "true = SSH 게이트웨이·웹 터미널 차단, false = 차단 해제"
          type: "boolean"
        reason:
          description: "차단·해제 사유 (VM 이벤트·감사 기록에 포함, 선택)"
          maxLength: 200
          minLength: 0
          type:
          - "string"
          - "null"
      required:
      - "blocked"
      type: "object"
    VmPasswordResponse:
      properties:
        password:
          type: "string"
        sshHost:
          type: "string"
        sshPort:
          format: "int32"
          type: "integer"
        sshUsername:
          type: "string"
      required:
      - "password"
      - "sshHost"
      - "sshPort"
      - "sshUsername"
      type: "object"
    VmPeriodUpdateRequest:
      properties:
        endDate:
          format: "date"
          type: "string"
        startDate:
          format: "date"
          type: "string"
      required:
      - "endDate"
      type: "object"
    VmRequestDetailResponse:
      properties:
        courseOrProject:
          type:
          - "string"
          - "null"
        createdAt:
          format: "date-time"
          type: "string"
        desiredSlug:
          type:
          - "string"
          - "null"
        desiredSubdomain:
          type:
          - "string"
          - "null"
        displayName:
          type:
          - "string"
          - "null"
        extraNote:
          type:
          - "string"
          - "null"
        flavorId:
          format: "int64"
          type:
          - "integer"
          - "null"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        imageId:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        purpose:
          type: "string"
        reqDiskGb:
          format: "int32"
          type: "integer"
        reqEndDate:
          format: "date"
          type:
          - "string"
          - "null"
        reqMemoryMb:
          format: "int32"
          type: "integer"
        reqStartDate:
          format: "date"
          type:
          - "string"
          - "null"
        reqVcpu:
          format: "int32"
          type: "integer"
        requesterId:
          format: "int64"
          type: "integer"
        requesterName:
          type: "string"
        review:
          anyOf:
          - $ref: "#/components/schemas/VmRequestReviewResponse"
          - type: "null"
        rootDomain:
          type:
          - "string"
          - "null"
        specReason:
          type:
          - "string"
          - "null"
        status:
          $ref: "#/components/schemas/VmRequestStatus"
        updatedAt:
          format: "date-time"
          type: "string"
      required:
      - "createdAt"
      - "groupId"
      - "groupName"
      - "id"
      - "imageId"
      - "orgId"
      - "orgName"
      - "purpose"
      - "reqDiskGb"
      - "reqMemoryMb"
      - "reqVcpu"
      - "requesterId"
      - "requesterName"
      - "status"
      - "updatedAt"
      type: "object"
    VmRequestReviewResponse:
      properties:
        comment:
          type:
          - "string"
          - "null"
        decidedAt:
          format: "date-time"
          type: "string"
        decision:
          $ref: "#/components/schemas/ReviewDecision"
        grantedDiskGb:
          format: "int32"
          type:
          - "integer"
          - "null"
        grantedEndDate:
          format: "date"
          type:
          - "string"
          - "null"
        grantedImageId:
          format: "int64"
          type:
          - "integer"
          - "null"
        grantedMemoryMb:
          format: "int32"
          type:
          - "integer"
          - "null"
        grantedStartDate:
          format: "date"
          type:
          - "string"
          - "null"
        grantedVcpu:
          format: "int32"
          type:
          - "integer"
          - "null"
        nodeId:
          format: "int64"
          type:
          - "integer"
          - "null"
        reviewerId:
          format: "int64"
          type: "integer"
        reviewerName:
          type: "string"
      required:
      - "decidedAt"
      - "decision"
      - "reviewerId"
      - "reviewerName"
      type: "object"
    VmRequestStatus:
      enum:
      - "SUBMITTED"
      - "APPROVED"
      - "REJECTED"
      - "CANCELED"
      type: "string"
    VmSettingValueType:
      enum:
      - "BOOLEAN"
      - "ENUM"
      - "INTEGER"
      - "STRING"
      type: "string"
    VmSettingView:
      properties:
        allowedValues:
          items:
            type: "string"
          type:
          - "array"
          - "null"
        defaultValue: {}
        description:
          type: "string"
        editable:
          type: "boolean"
        key:
          type: "string"
        label:
          type: "string"
        requiredRole:
          $ref: "#/components/schemas/ResourceRole"
        updatedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        updatedByName:
          type:
          - "string"
          - "null"
        value: {}
        valueType:
          $ref: "#/components/schemas/VmSettingValueType"
      required:
      - "defaultValue"
      - "description"
      - "editable"
      - "key"
      - "label"
      - "requiredRole"
      - "value"
      - "valueType"
      type: "object"
    VmSettingsUpdateRequest:
      properties:
        settings:
          additionalProperties: {}
          type: "object"
      required:
      - "settings"
      type: "object"
    VmStatus:
      enum:
      - "CREATING"
      - "RUNNING"
      - "STOPPED"
      - "REBOOTING"
      - "DELETING"
      - "DELETED"
      - "ERROR"
      - "NEEDS_ADMIN"
      type: "string"
    VmSummaryResponse:
      properties:
        accessLimited:
          description: "true면 이 VM의 접근 권한이 없어 이름·상태·소유자만 표시됩니다."
          type: "boolean"
        accessManageAllowed:
          description: "접근 권한이 없어도 접근 권한 목록을 관리할 수 있는지. 그룹 소유자가 참입니다."
          type: "boolean"
        createdAt:
          format: "date-time"
          type: "string"
        diskGb:
          description: "디스크(GiB). 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
        displayName:
          type:
          - "string"
          - "null"
        endDate:
          format: "date"
          type:
          - "string"
          - "null"
        expiryStoppedAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        hostname:
          description: "SSH 슬러그. 접근 권한이 없으면 생략됩니다."
          type:
          - "string"
          - "null"
        id:
          format: "int64"
          type: "integer"
        memoryMb:
          description: "메모리(MiB). 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
        name:
          type: "string"
        orgName:
          type:
          - "string"
          - "null"
        ownerNames:
          description: "이 VM의 소유자 이름. 접근을 요청할 상대입니다."
          items:
            type: "string"
          type: "array"
        requestId:
          format: "int64"
          type:
          - "integer"
          - "null"
        sshGatewayBlocked:
          type:
          - "boolean"
          - "null"
        status:
          $ref: "#/components/schemas/VmStatus"
        statusDetail:
          type:
          - "string"
          - "null"
        vcpu:
          description: "vCPU. 접근 권한이 없으면 생략됩니다."
          format: "int32"
          type:
          - "integer"
          - "null"
      required:
      - "accessLimited"
      - "accessManageAllowed"
      - "createdAt"
      - "groupId"
      - "groupName"
      - "id"
      - "name"
      - "ownerNames"
      - "status"
      type: "object"
    WithdrawRequest:
      properties:
        password:
          minLength: 1
          type: "string"
        recoveryCode:
          type: "string"
        totpCode:
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "password"
      type: "object"
  securitySchemes:
    bearerAuth:
      bearerFormat: "JWT"
      description: "액세스 토큰 (JWT HS256, 15분 만료). 클레임: sub, role, org_id, token_version.\
        \ 비밀번호 변경·계정 비활성화 시 token_version이 올라가 기존 토큰이 즉시 무효화됩니다. 리프레시 토큰은 보안 스킴이 아\
        니라 __Host-pickle_refresh httpOnly 쿠키로만 오갑니다."
      scheme: "bearer"
      type: "http"
info:
  description: "부산대학교 클라우드 플랫폼 Pickle의 REST API. 인증은 JWT Bearer, 오류 응답은 RFC 9457 problem+json(Problem\
    \ 스키마)을 따릅니다."
  title: "Pickle API"
  version: "0.33.0"
openapi: "3.1.0"
paths:
  /admin/announcements:
    get:
      operationId: "listAnnouncements"
      parameters:
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAnnouncementView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
    post:
      operationId: "createAnnouncement"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnnouncementView"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
  /admin/audit:
    get:
      operationId: "listAuditLogs"
      parameters:
      - in: "query"
        name: "actorEmail"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "action"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetType"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetId"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "from"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "to"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "int64"
          type: "integer"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAuditLogViewResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-audit-controller"
  /admin/campus-ip-requests:
    get:
      operationId: "listAdminCampusIpRequests"
      parameters:
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/CampusIpRequestStatus"
      - in: "query"
        name: "vmId"
        required: false
        schema:
          format: "int64"
          type: "integer"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminCampusIpRequestView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-campus-ip-request-controller"
  /admin/campus-ip-requests/{requestId}/status:
    post:
      operationId: "updateAdminCampusIpRequestStatus"
      parameters:
      - in: "path"
        name: "requestId"
        required: true
        schema:
          format: "int64"
          type: "integer"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampusIpRequestStatusRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminCampusIpRequestView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-campus-ip-request-controller"
  /admin/certificates:
    get:
      operationId: "listAdminCertificates"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "int64"
          type: "integer"
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/CertificateStatus"
      - in: "query"
        name: "expiringInDays"
        required: false
        schema:
          format: "int32"
          minimum: 1
          type: "integer"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminCertificateView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/domains:
    get:
      operationId: "listAdminDomains"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "int64"
          type: "integer"
      - in: "query"
        name: "kind"
        required: false
        schema:
          $ref: "#/components/schemas/DomainKind"
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/DomainStatus"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminDomainView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/domains/{domainId}/force-release:
    post:
      operationId: "forceReleaseDomain"
      parameters:
      - in: "path"
        name: "domainId"
        required: true
        schema:
          format: "int64"
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/domains/{domainId}/verify:
    post:
      operationId: "verifyAdminDomain"
      parameters:
      - in: "path"
        name: "domainId"
        required: true
        schema:
          format: "int64"
          type: "integer"
      responses:
        "202":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: "Accepted"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류 — 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-publishing-controller"
  /admin/drift-findings:
    get:
      operationId: "listDriftFindings"
      parameters:
      - in: "query"
        name: "status"
        required: false
        schema:
          $ref: "#/components/schemas/DriftFindingStatus"
      - in: "query"
        name: "kind"
        required: false
        schema:
          $ref: "#/components/schemas/DriftFindingKind"
      - in: "query"
        name: "page"
        required: false
