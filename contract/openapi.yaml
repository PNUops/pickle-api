    CreateLlmKeyRequestSpec:
      properties:
        reqCreditLimit:
          description: "희망 금액 한도예요(USD). 유료 모델 사용을 신청할 때만 입력해요."
          example: 20.0
          maximum: 100000.0
          minimum: 0.01
          type:
          - "number"
          - "null"
        reqDailyTokens:
          description: "희망 일일 토큰 수이며, 생략하면 서비스 기본값을 요청해요."
          format: "int64"
          minimum: 1
          type:
          - "integer"
          - "null"
        reqPassthroughEndpoints:
          description: "신청자가 요청한 기능 권한이며 필수값이지만 빈 배열도 보낼 수 있어요. 승인 화면의 초깃값이며, 부여할\
            \ 목록은 승인자가 정해요. 현재 부여할 수 있는 값은 chat, web_search, pdf_ocr, images, embeddings,\
            \ rerank, speech, transcriptions, videos, batches이며, 나머지는 422로 거절해요. web_search나\
            \ pdf_ocr를 선택하면 chat도 함께 선택해야 하고, batches는 chat이나 embeddings와 함께 선택해야\
            \ 해요."
          items:
            enum:
            - "chat"
            - "web_search"
            - "pdf_ocr"
            - "containers"
            - "images"
            - "embeddings"
            - "rerank"
            - "speech"
            - "transcriptions"
            - "videos"
            - "batches"
            - "files"
            type: "string"
          maxItems: 20
          minItems: 0
          type: "array"
        reqRpm:
          description: "희망 분당 요청 수이며, 생략하면 서비스 기본값을 요청해요."
          format: "int32"
          maximum: 10000
          minimum: 1
          type:
          - "integer"
          - "null"
        reqTpm:
          description: "희망 분당 토큰 수이며, 생략하면 서비스 기본값을 요청해요."
          format: "int32"
          minimum: 1
          type:
          - "integer"
          - "null"
        useCampusModels:
          description: "자체 서빙 모델 사용 여부예요. 생략하거나 null이면 사용하는 것으로 봐요."
          type:
          - "boolean"
          - "null"
        useCommercialModels:
          description: "유료 모델 사용 여부예요. 생략하거나 null이면 사용하지 않는 것으로 봐요."
          type:
          - "boolean"
          - "null"
      required:
      - "reqPassthroughEndpoints"
      type: "object"
    CreateOpenRouterAccountRequest:
      properties:
        confirmName:
          description: "오입력 방지를 위해 name과 정확히 같아야 하는 확인값"
          maxLength: 120
          minLength: 0
          type: "string"
        contact:
          description: "이 사업 계정의 담당자. 없으면 null"
          maxLength: 500
          minLength: 0
          type:
          - "string"
          - "null"
        defaultCreditAllowedModels:
          description: "승인 화면에 처음 채울 유료 모델 허용 목록의 기본값이에요. 비우면 제한 없는 목록을 기본값으로 써요.\
            \ 각 항목에는 부호 없는 모델 패턴을 입력해요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*, */*-pro).\
            \ 공급자 *는 ~별칭도 포함하며 특정 공급자를 허용할 때는 ~별칭을 별도로 적어야 해요. 정확한 모델명은 :batch 같은\
            \ 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type:
          - "array"
          - "null"
        defaultCreditDeniedModels:
          description: "승인 화면에 처음 채울 유료 모델 차단 목록의 기본값이에요. 비우면 차단 없는 목록을 기본값으로 써요.\
            \ 각 항목은 허용 목록과 같은 부호 없는 모델 패턴이에요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*,\
            \ */*-pro). 차단은 ~를 제거한 이름도 검사하며 별칭의 실제 대상 모델은 추적하지 않아요. 정확한 모델명은 :batch\
            \ 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type:
          - "array"
          - "null"
        name:
          description: "기관 관리자가 구분하는 사업 계정 이름"
          maxLength: 120
          minLength: 0
          type: "string"
        orgId:
          description: "사업 계정을 소유할 기관의 공개 ID"
          format: "uuid"
          type: "string"
        program:
          description: "이 사업 계정의 비용을 청구하는 사업. 없으면 null"
          maxLength: 500
          minLength: 0
          type:
          - "string"
          - "null"
