  /admin/resource-deadlines:
    get:
      description: "전역 지원 메타데이터에서 자원마다 주 기한 하나를 조회해요. 기관과 워크스페이스는 선택 필터이며 없는 식별자는\
        \ 빈 목록을 반환해요. VM은 사용 종료일, LLM 키는 만료 시각, 외부 도메인은 갱신 기한 또는 해제 뒤 예약 종료 시각, GPU는\
        \ 대기 중 승인 종료일 또는 할당이나 반납 중 실제 임대 종료 시각이에요. 종료 상태와 주 기한이 없는 자원은 제외해요. expiringInDays는\
        \ 1~365의 KST 달력 창이며 오늘부터 오늘+N일까지예요. VM과 대기 GPU는 종료일 양끝을 포함해요. LLM 키는 관측 시각\
        보다 미래이면서 오늘+N 다음 날 0시(KST) 이하인 만료 시각을 포함해요. 도메인과 GPU 임대의 정확한 기한은 관측 시각보다 미\
        래이면서 같은 다음 날 0시 미만이에요. expired=true는 종료일이 오늘보다 이르거나 정확한 기한이 관측 시각 이하인 자원을\
        \ 뜻해요. expired=true와 expiringInDays를 함께 지정하면 교집합이므로 빈 목록이에요. 관측 시각과 count,\
        \ 페이지는 같은 DB snapshot을 기준으로 하며 기한 경과를 외부 완료로 해석하지 않아요. 실제 변경 권한은 기존 단건 경로의\
        \ 기관 범위를 따라요."
      operationId: "listAdminResourceDeadlines"
      parameters:
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "workspaceId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "type"
        required: false
        schema:
          $ref: "#/components/schemas/ResourceType"
      - in: "query"
        name: "deadlineKind"
        required: false
        schema:
          $ref: "#/components/schemas/AdminResourceDeadlineKind"
      - in: "query"
        name: "expiringInDays"
        required: false
        schema:
          format: "int32"
          maximum: 365
          minimum: 1
          type: "integer"
      - in: "query"
        name: "expired"
        required: false
        schema:
          type: "boolean"
      - in: "query"
        name: "sort"
        required: false
        schema:
          enum:
          - "deadlineAt"
          - "-deadlineAt"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAdminResourceDeadlineResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 통합 자원 기한 목록"
      tags:
      - "admin-resource-deadline-controller"
