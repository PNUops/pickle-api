      - "admin-node-controller"
  /admin/nodes/{nodeId}/metrics:
    get:
      operationId: "getAdminNodeMetrics"
      parameters:
      - in: "path"
        name: "nodeId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "조회 구간 — HOUR/DAY/WEEK/MONTH/YEAR (해상도는 구간에 따라 거칠어짐)"
        in: "query"
        name: "timeframe"
        required: false
        schema:
          $ref: "#/components/schemas/RrdTimeframe"
          default: "HOUR"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NodeMetricsResponse"
