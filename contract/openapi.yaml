          description: "금액 한도가 0보다 큰 살아 있는 키 수예요. 한도 0인 키는 약속량이 없으므로 세지 않아요."
          format: "int64"
          type: "integer"
        committedMonthly:
          description: "월간 리셋 키의 한도 합계이며 창마다 다시 채워져요."
          type: "number"
