          type: "integer"
        pricedInputTokens:
          description: "금액이 보고된 요청의 입력 토큰 수예요. 금액이 보고되지 않은 요청의 입력 토큰 수는 inputTokens에\
            서 이 값을 빼서 구해요."
          format: "int64"
