          minimum: 1
          type:
          - "integer"
          - "null"
        tpm:
          description: "분당 토큰 한도예요. 생략하면 유지하고 null이면 서비스 기본값을 따라요."
          format: "int32"
          minimum: 1
          type:
          - "integer"
          - "null"
