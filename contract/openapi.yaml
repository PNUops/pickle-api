    CapacityCounts:
      description: "보존된 raw event에서 관측한 수치예요. 요청 기간 전체가 삭제 경계 밖이면 null이에요. 일부 기간이\
        \ 삭제됐다면 quality를 함께 확인해요."
      properties:
        canceled:
          format: "int64"
          type:
          - "integer"
          - "null"
        costUsd:
          description: "공급자가 보고한 요청 금액의 합이에요. TOKEN/CREDIT 축과 독립된 값이며 사용자나 플랫폼의 부담\
            액, 원가를 확정하지 않아요. 권한이나 가격 표본이 없으면 null이에요."
          type:
          - "number"
          - "null"
        creditAxisRequests:
          format: "int64"
          type:
          - "integer"
          - "null"
        estimatedRequests:
          format: "int64"
          type:
          - "integer"
          - "null"
        failed:
          format: "int64"
          type:
          - "integer"
          - "null"
        financeVisible:
