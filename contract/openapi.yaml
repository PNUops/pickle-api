          type:
          - "string"
          - "null"
        keyMetersLastSuccessAt:
          format: "date-time"
          type:
          - "string"
          - "null"
        observedAt:
          format: "date-time"
          type: "string"
        periodBasisMismatch:
          type: "boolean"
        source:
          type: "string"
        vendorWindowAlignmentUnconfirmed:
          type: "boolean"
        windowedCommitmentsPresent:
          type: "boolean"
