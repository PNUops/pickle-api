            용할 수 있어요(예: openai/*, */*-pro). 차단은 ~를 제거한 이름도 검사하며 별칭의 실제 대상 모델은 추적하지\
            \ 않아요. 정확한 모델명은 :batch 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
