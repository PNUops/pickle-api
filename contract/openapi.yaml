    CreateRequestRecipient:
      description: "리소스를 받을 대상자 한 명이에요. userId, invitationId, studentNo 중 정확히 하나를\
        \ 보내요."
      properties:
        invitationId:
          description: "워크스페이스의 대기 중인 초대예요. 수락 뒤 리소스 생성은 신청 승인과 이용 기간, 활성 구성원 여부 등\
            \ 현재 조건을 확인해 별도 작업으로 처리해요."
          format: "uuid"
          type:
          - "string"
          - "null"
        studentNo:
          description: "대상자의 학번이에요. 해당 학번의 활성 계정이 구성원이면 그 사람이 대상자가 되고, 구성원이 아니면 제출\
            할 때 구성원으로 추가해요. 계정이 없으면 대기 중인 초대를 쓰거나 제출할 때 새로 초대해요. 리소스 생성은 신청 승인 뒤 이\
            용 기간과 활성 구성원 여부 등 현재 조건을 확인하는 별도 작업으로 처리해요. 추가와 초대는 신청이 나중에 반려되거나 취소되어\
            도 남고, 신청자의 시간당 초대 인원 한도에 포함돼요. 개인 워크스페이스에는 쓸 수 없어요."
          example: "209900001"
          maxLength: 64
          minLength: 0
          type:
          - "string"
          - "null"
        userId:
          description: "워크스페이스의 활성 구성원."
          format: "uuid"
          type:
          - "string"
          - "null"
      type: "object"
    CreateRequestRequest:
      properties:
        approval:
          anyOf:
          - $ref: "#/components/schemas/ApproveRequestRequest"
