          type:
          - "integer"
          - "null"
        rateLimited:
          format: "int64"
          type:
          - "integer"
          - "null"
        requests:
          format: "int64"
          type:
          - "integer"
          - "null"
        succeeded:
          format: "int64"
          type:
          - "integer"
          - "null"
        tokenAxisRequests:
