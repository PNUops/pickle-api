      properties:
        email:
          description: "정규화한 요청 이메일이며, 학번 항목이면 null이에요."
          type:
          - "string"
          - "null"
        invitationId:
          description: "대기 중인 초대 ID예요. INVITED나 ALREADY_INVITED일 때만 있어요."
          format: "uuid"
          type:
          - "string"
          - "null"
        outcome:
          $ref: "#/components/schemas/WorkspaceInvitationOutcome"
          description: "처리 결과."
        studentNo:
          description: "앞뒤 공백을 지운 요청 학번이며, 이메일 항목이면 null이에요."
          type:
          - "string"
          - "null"
        userId:
          description: "구성원 계정의 공개 ID예요. ADDED나 ALREADY_MEMBER일 때만 있어요."
          format: "uuid"
          type:
          - "string"
          - "null"
      required:
      - "outcome"
      type: "object"
    WorkspaceInvitationStatus:
      enum:
      - "PENDING"
      - "ACCEPTED"
      - "CANCELED"
      type: "string"
    WorkspaceKind:
      enum:
      - "PERSONAL"
      - "TEAM"
      - "PROJECT"
      - "COURSE"
      - "PROGRAM"
      - "LAB"
      - "CLUB"
      - "COMPETITION"
      - "STUDY"
      type: "string"
    WorkspaceMemberResponse:
      properties:
        email:
          type: "string"
        name:
          type: "string"
        role:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        userId:
          format: "uuid"
          type: "string"
      required:
      - "email"
      - "name"
      - "role"
      - "userId"
      type: "object"
    WorkspaceMemberRole:
      enum:
      - "OWNER"
      - "MEMBER"
      type: "string"
    WorkspacePanel:
      properties:
        activeVms:
          deprecated: true
          description: "호환용 VM 목록이에요. 새 클라이언트는 vm.workspaceResources.activeVms를 사용\
            해요."
          items:
            $ref: "#/components/schemas/VmBriefResponse"
          type:
          - "array"
          - "null"
        canReadDetail:
          type: "boolean"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        members:
          items:
            $ref: "#/components/schemas/MemberBrief"
          type: "array"
        name:
          type: "string"
        totals:
          anyOf:
          - $ref: "#/components/schemas/ResourceTotalsResponse"
          - type: "null"
          description: "호환용 VM 합계예요. 새 클라이언트는 vm.workspaceResources.totals를 사용해요."
      required:
      - "canReadDetail"
      - "id"
      - "kind"
      - "members"
      - "name"
      type: "object"
    WorkspaceSummaryResponse:
      properties:
        description:
          type:
          - "string"
          - "null"
        id:
          format: "uuid"
          type: "string"
        kind:
          $ref: "#/components/schemas/WorkspaceKind"
        memberCount:
          format: "int64"
          type: "integer"
        myRole:
          $ref: "#/components/schemas/WorkspaceMemberRole"
        name:
          type: "string"
      required:
      - "id"
      - "kind"
      - "memberCount"
      - "myRole"
      - "name"
      type: "object"
    WorkspaceTerminationAction:
      enum:
      - "DELETE_WORKSPACE"
      - "CANCEL_INVITATION"
      type: "string"
    WorkspaceTerminationImpactResponse:
      properties:
        action:
          $ref: "#/components/schemas/WorkspaceTerminationAction"
        blockedReason:
          description: "현재 종료를 막는 조건이에요. PERSONAL 또는 REMAINING_RESOURCES이며, 차단 조건이\
            \ 없으면 null이에요."
          type:
          - "string"
          - "null"
        blockingResources:
          $ref: "#/components/schemas/PageResponseWorkspaceTerminationResourceResponse"
        executable:
          type: "boolean"
        fingerprint:
          description: "수행자와 현재 권한, 전체 영향 대상, 리소스 조건을 나타내는 식별값이에요. 페이지와 조회 시각은 포함하\
            지 않아요."
          type: "string"
        invitationId:
          format: "uuid"
          type:
          - "string"
          - "null"
        observedAt:
          description: "조회한 시각이며, 실제 종료나 리소스 생성 결과를 뜻하지 않아요."
          format: "date-time"
          type: "string"
        recipientCounts:
          items:
            $ref: "#/components/schemas/WorkspaceTerminationRecipientCount"
          type: "array"
        resourceBlockers:
          items:
            $ref: "#/components/schemas/WorkspaceTerminationResourceBlocker"
          type: "array"
        summary:
          $ref: "#/components/schemas/WorkspaceTerminationSummary"
        targets:
          $ref: "#/components/schemas/PageResponseWorkspaceTerminationTargetResponse"
        workspaceId:
          format: "uuid"
          type: "string"
        workspaceName:
          type: "string"
      required:
      - "action"
      - "blockingResources"
      - "executable"
      - "fingerprint"
      - "observedAt"
      - "recipientCounts"
      - "resourceBlockers"
      - "summary"
      - "targets"
      - "workspaceId"
      - "workspaceName"
      type: "object"
    WorkspaceTerminationRecipientCount:
      properties:
        count:
          format: "int64"
          type: "integer"
        recipientStatus:
          $ref: "#/components/schemas/RequestRecipientStatus"
        requestStatus:
          $ref: "#/components/schemas/RequestStatus"
        willClose:
          type: "boolean"
      required:
      - "count"
      - "recipientStatus"
      - "requestStatus"
      - "willClose"
      type: "object"
    WorkspaceTerminationResourceBlocker:
      properties:
        count:
          format: "int64"
          type: "integer"
        type:
          $ref: "#/components/schemas/ResourceType"
      required:
      - "count"
      - "type"
      type: "object"
    WorkspaceTerminationResourceResponse:
      properties:
        id:
          format: "uuid"
          type: "string"
        name:
          description: "현재 조회 권한에 맞춘 이름이에요. VM 접근 권한이 없으면 SSH 슬러그 대신 표시 이름이나 공개 ID를\
            \ 반환해요."
          type: "string"
        orgId:
          description: "현재 조회 권한으로 볼 수 있는 실제 기관이에요. 제한된 행이거나 연결된 기관이 없으면 null이에요."
          format: "uuid"
          type:
          - "string"
          - "null"
        orgName:
          type:
          - "string"
          - "null"
        resourceReadable:
          description: "현재 호출 경로에서 해당 종류의 상세를 읽을 수 있는지 나타내요. 워크스페이스 OWNER라는 이유만으로\
            \ 리소스 상세 권한을 얻지는 않아요."
          type: "boolean"
        status:
          type: "string"
        type:
          $ref: "#/components/schemas/ResourceType"
      required:
      - "id"
      - "name"
      - "resourceReadable"
      - "status"
      - "type"
      type: "object"
    WorkspaceTerminationSummary:
      properties:
        approvedRecipients:
          format: "int64"
          type: "integer"
        closingRecipients:
          format: "int64"
          type: "integer"
        failedRecipients:
          description: "자동으로 종료하지 않고 현재 실패 이력으로 남기는 대상자 수"
          format: "int64"
          type: "integer"
        pendingJoinRecipients:
          format: "int64"
          type: "integer"
        queuedRecipients:
          format: "int64"
          type: "integer"
        submittedRequests:
          format: "int64"
          type: "integer"
        undecidedRecipients:
          format: "int64"
          type: "integer"
      required:
      - "approvedRecipients"
      - "closingRecipients"
      - "failedRecipients"
      - "pendingJoinRecipients"
      - "queuedRecipients"
      - "submittedRequests"
      - "undecidedRecipients"
      type: "object"
    WorkspaceTerminationTargetKind:
      enum:
      - "REQUEST"
      - "RECIPIENT"
      type: "string"
    WorkspaceTerminationTargetResponse:
      properties:
        invitationId:
          format: "uuid"
          type:
          - "string"
          - "null"
        invitee:
          description: "초대 대상의 이메일이나 학번이며, 현재 OWNER 또는 지원 쓰기 권한 범위에서만 제공해요."
          type:
          - "string"
          - "null"
        kind:
          $ref: "#/components/schemas/WorkspaceTerminationTargetKind"
        name:
          type:
          - "string"
          - "null"
        orgId:
          format: "uuid"
          type: "string"
        orgName:
          type: "string"
        reason:
          type:
          - "string"
          - "null"
        recipientId:
          format: "uuid"
          type:
          - "string"
          - "null"
        recipientStatus:
          anyOf:
          - $ref: "#/components/schemas/RequestRecipientStatus"
          - type: "null"
        requestId:
          format: "uuid"
          type: "string"
        requestName:
          type: "string"
        requestReadable:
          type: "boolean"
        requestStatus:
          $ref: "#/components/schemas/RequestStatus"
        resourceId:
          format: "uuid"
          type:
          - "string"
          - "null"
        type:
          $ref: "#/components/schemas/ResourceType"
        userId:
          format: "uuid"
          type:
          - "string"
          - "null"
        userReadable:
          type: "boolean"
        willClose:
          description: "현재 종료 경로의 취소 대상 여부예요. FAILED 이력은 false예요."
          type: "boolean"
      required:
      - "kind"
      - "orgId"
      - "orgName"
      - "requestId"
      - "requestName"
      - "requestReadable"
      - "requestStatus"
      - "type"
      - "userReadable"
      - "willClose"
      type: "object"
  securitySchemes:
    bearerAuth:
      bearerFormat: "JWT"
      description: "액세스 토큰 (JWT HS256, 15분 만료). 클레임: sub(계정 공개 식별자 UUID), role, token_version.\
        \ 비밀번호를 바꾸거나 계정을 비활성화하면 token_version을 올려요. 새 인증에서는 기존 토큰을 쓸 수 없어요. 리프레시 토\
        큰은 보안 스킴이 아니라 __Host-pickle_refresh httpOnly 쿠키로만 주고받아요."
      scheme: "bearer"
      type: "http"
info:
  description: "부산대학교 클라우드 플랫폼 Pickle의 REST API예요. JWT Bearer로 인증해요. 오류 응답은 RFC 9457\
    \ problem+json(Problem 스키마)을 따라요."
  title: "Pickle API"
  version: "0.116.0"
openapi: "3.1.0"
paths:
  /admin/announcements:
    get:
      operationId: "listAnnouncements"
      parameters:
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAnnouncementView"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
    post:
      operationId: "createAnnouncement"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnnouncementView"
          description: "Created"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      tags:
      - "announcement-controller"
  /admin/announcements/preview:
    post:
      description: "현재 활성 대상자의 예상 인원과 최대 20명 예시를 조회해요. 실제 발송 대상은 생성 요청 때 다시 선정하며 이\
        \ 응답으로 발송을 예약하지 않아요."
      operationId: "previewAnnouncement"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreateRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnnouncementPreviewResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "알림 발송 대상 미리보기"
      tags:
      - "announcement-controller"
  /admin/announcements/{announcementId}:
    get:
      description: "저장된 내용과 대상, 접수 당시 선정 인원을 조회해요. 기관 계층은 허용된 기관 업무와 작성자의 현재 기관 행\
        \ 및 전체 발송건을 기준으로 조회해요."
      operationId: "getAnnouncement"
      parameters:
      - in: "path"
        name: "announcementId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnnouncementDetailResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "알림 발송건 상세 조회"
      tags:
      - "announcement-controller"
  /admin/audit:
    get:
      operationId: "listAuditLogs"
      parameters:
      - in: "query"
        name: "actorEmail"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "action"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetType"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "targetId"
        required: false
        schema:
          type: "string"
      - in: "query"
        name: "from"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "to"
        required: false
        schema:
          format: "date"
          type: "string"
      - in: "query"
        name: "orgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "targetOrgId"
        required: false
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "page"
        required: false
        schema:
          default: 0
          format: "int32"
          minimum: 0
          type: "integer"
      - in: "query"
        name: "size"
        required: false
        schema:
          default: 20
          format: "int32"
          maximum: 100
          minimum: 1
          type: "integer"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseAuditLogViewResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      tags:
      - "admin-audit-controller"
  /admin/bulk-changes:
    post:
      description: "저장된 미리보기와 같은 변경과 대상, fingerprint에 previewId와 클라이언트가 한 번 생성한 operationId를\
        \ 더해 적용해요. operationId는 결과의 batchId와 같아요. 새 적용은 미리보기 저장 후 24시간까지만 허용해요. 같은\
        \ 수행자가 같은 식별자와 본문으로 다시 요청하면 현재 접근 범위로 가린 저장 결과만 반환하며 변경이나 후속 작업을 다시 실행하지 않\
        아요. 이 재요청은 미리보기 만료 뒤에도 가능해요. 같은 수행자의 식별자에 다른 본문을 결합하면 409, 타인의 기록은 404로 거절\
        해요. 새 적용은 대상마다 다시 판정하고 바뀐 확인값은 STALE, 업무상 거절은 SKIPPED로 저장해요. 예기치 않은 트랜잭션 오\
        류는 전체 변경과 결과를 롤백해요. 커밋 후 callback 오류는 이미 커밋된 결과를 되돌리지 않으며 effects에서 확인해요.\
        \ APPLIED는 DB 커밋을 뜻하고 외부 완료를 보장하지 않아요. 대상별 감사 기록은 단일 변경과 같은 이름으로 남고 같은 batchId를\
        \ 담아요."
      operationId: "applyAdminBulkChange"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBulkChangeRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminBulkChangeApplyResponse"
          description: "대상별 결과와 이 적용의 batchId"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "관리자 일괄 변경 적용"
      tags:
      - "admin"
  /admin/bulk-changes/operations:
    get:
      description: "본인의 최근 커밋 결과 최대 20개를 현재 접근 범위로 가려서 조회해요. 대상과 후속 작업은 바꾸지 않아요."
      operationId: "listAdminBulkChangeOperations"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/AdminBulkChangeOperationResponse"
                type: "array"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "본인의 최근 일괄 변경 결과 조회"
      tags:
      - "admin"
  /admin/bulk-changes/operations/{operationId}:
    get:
      description: "본인의 커밋된 적용 결과와 callback 접수 관측을 조회해요. 재실행하지 않으며 DB 커밋과 queue 접수\
        , 외부 완료는 별개예요."
      operationId: "getAdminBulkChangeOperation"
      parameters:
      - in: "path"
        name: "operationId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminBulkChangeOperationResponse"
          description: "OK"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "오류: 상태 코드와 무관하게 Problem 형태"
      summary: "저장된 일괄 변경 결과 조회"
      tags:
      - "admin"
  /admin/bulk-changes/preview:
    post:
      description: "여러 대상에 한 가지 변경을 적용하면 어떻게 되는지 대상마다 응답해요. 미리보기 기록만 저장하며 대상은 바꾸지\
        \ 않아요. 범위 밖이거나 역할이 허용하지 않는 대상, 현재 상태에서 할 수 없는 대상은 이유와 함께 applicable=false로\
        , 이미 그 값인 대상은 바뀔 필드 없이 applicable=true로 응답해요. 대상마다 fingerprint를 주며 적용 요청에\
        \ 그대로 보내요. 대상은 최대 200개예요."
      operationId: "previewAdminBulkChange"
      requestBody:
        content:
          application/json:
