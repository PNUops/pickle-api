    LlmAccountImpactProjection:
      description: "전체 제안의 계정별 스냅샷이에요. 계정 금융 조회 권한이 필요하며 각 대상 키의 관측과 금융도 같은 출처에서 함\
        께 허용돼야 제공해요. 미제공을 이유로 기존에 허용된 명령을 막지 않으며 새 금융 CAS나 잔액 예약을 뜻하지 않아요."
