          description: "일일 토큰 한도이며, null이면 일일 한도가 없고 0이면 자체 서빙 모델을 쓸 수 없어요."
          format: "int64"
          type:
          - "integer"
          - "null"
        expiresAt:
          description: "만료 시각이며, null이면 만료가 없어요."
          format: "date-time"
          type:
          - "string"
          - "null"
        id:
