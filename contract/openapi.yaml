          - "string"
          - "null"
        upstreamName:
          description: "현재 응답에서 읽을 수 있는 등록 공급원 표시 이름"
          type:
          - "string"
          - "null"
      required:
      - "state"
      type: "object"
    LlmModelRouteResponse:
      description: "공개 상태의 활성 TOKEN 모델에서 주 공급원과 대체 공급원으로 이어지는 구성 관계예요. 현재 응답에서 읽을\
        \ 수 있는 공급원 연결이 하나 이상인 모델만 포함해요. 전체 모델 목록이나 실제 처리 경로를 뜻하지 않아요."
      properties:
        fallback:
          $ref: "#/components/schemas/LlmModelRouteReference"
          description: "대체 공급원 구성의 공개 참조"
        primary:
          $ref: "#/components/schemas/LlmModelRouteReference"
          description: "주 공급원 구성의 공개 참조"
        publicName:
          description: "요청의 model 필드에 사용하는 공개 모델명"
          type: "string"
