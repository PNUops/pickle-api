---
components:
  schemas:
    ActivateMfaRequest:
      properties:
        code:
          minLength: 1
          pattern: "^[0-9]{6}$"
          type: "string"
      required:
      - "code"
      type: "object"
    ActivityEntryResponse:
      properties:
        action:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        detail:
          $ref: "#/components/schemas/JsonNode"
        id:
          format: "int64"
          type: "integer"
        ip:
          type: "string"
        targetId:
          type: "string"
        targetType:
          type: "string"
      type: "object"
    AddGroupMemberRequest:
      properties:
        email:
          format: "email"
          minLength: 1
          type: "string"
        role:
          enum:
          - "OWNER"
          - "EDITOR"
          - "MEMBER"
          - "VIEWER"
          type: "string"
      required:
      - "email"
      - "role"
      type: "object"
    AdminCertificateView:
      properties:
        daysUntilExpiry:
          format: "int32"
          type: "integer"
        domainId:
          format: "int64"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "ORIGIN_CA_WILDCARD"
          - "LETS_ENCRYPT"
          type: "string"
        lastError:
          type: "string"
        notAfter:
          format: "date-time"
          type: "string"
        scope:
          type: "string"
        status:
          enum:
          - "ACTIVE"
          - "RENEWING"
          - "FAILED"
          - "REVOKED"
          type: "string"
      type: "object"
    AdminDomainView:
      properties:
        certificateStatus:
          enum:
          - "ACTIVE"
          - "RENEWING"
          - "FAILED"
          - "REVOKED"
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "AUTO"
          - "REQUESTED"
          - "CUSTOM"
          type: "string"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        rootDomain:
          type: "string"
        routeStatus:
          enum:
          - "PENDING"
          - "APPLIED"
          - "FAILED"
          - "REMOVED"
          type: "string"
        status:
          enum:
          - "PENDING"
          - "VERIFYING"
          - "ACTIVE"
          - "FAILED"
          - "REMOVED"
          type: "string"
        updatedAt:
          format: "date-time"
          type: "string"
        verifiedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      type: "object"
    AdminGroupOptionResponse:
      properties:
        id:
          format: "int64"
          type: "integer"
        memberCount:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        slug:
          type: "string"
      type: "object"
    AdminNotificationResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        body:
          type: "string"
        channel:
          enum:
          - "EMAIL"
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        event:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        importance:
          enum:
          - "NORMAL"
          - "HIGH"
          type: "string"
        lastError:
          type: "string"
        linkPath:
          type: "string"
        readAt:
          format: "date-time"
          type: "string"
        sentAt:
          format: "date-time"
          type: "string"
        status:
          enum:
          - "PENDING"
          - "SENT"
          - "FAILED"
          - "SKIPPED"
          type: "string"
        title:
          type: "string"
        userEmail:
          type: "string"
        userId:
          format: "int64"
          type: "integer"
      type: "object"
    AdminRouteView:
      properties:
        appliedAt:
          format: "date-time"
          type: "string"
        appliedGeneration:
          format: "int64"
          type: "integer"
        domainKind:
          enum:
          - "AUTO"
          - "REQUESTED"
          - "CUSTOM"
          type: "string"
        fqdn:
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        groupName:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        lastError:
          type: "string"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        protocol:
          type: "string"
        status:
          enum:
          - "PENDING"
          - "APPLIED"
          - "FAILED"
          - "REMOVED"
          type: "string"
        targetPort:
          format: "int32"
          type: "integer"
        updatedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      type: "object"
    AdminTaskResponse:
      properties:
        attempts:
          format: "int32"
          type: "integer"
        createdAt:
          format: "date-time"
          type: "string"
        currentStep:
          format: "int32"
          type: "integer"
        groupName:
          type: "string"
        hostname:
          type: "string"
        jobrunrJobId:
          type: "string"
        kind:
          enum:
          - "PROVISION"
          - "DELETE"
          - "REINSTALL"
          type: "string"
        lastError:
          type: "string"
        orgId:
          format: "int64"
          type: "integer"
        orgName:
          type: "string"
        status:
          enum:
          - "PENDING"
          - "RUNNING"
          - "DONE"
          - "FAILED"
          - "RETRYING"
          - "NEEDS_ADMIN"
          type: "string"
        stepLabel:
          type: "string"
        taskId:
          format: "int64"
          type: "integer"
        totalSteps:
          format: "int32"
          type: "integer"
        updatedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      type: "object"
    AnnouncementCreateRequest:
      properties:
        body:
          maxLength: 10000
          minLength: 0
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type: "integer"
        scope:
          enum:
          - "ALL"
          - "ORG"
          - "GROUP"
          type: "string"
        title:
          maxLength: 200
          minLength: 0
          type: "string"
      required:
      - "body"
      - "scope"
      - "title"
      type: "object"
    AnnouncementView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
        orgId:
          format: "int64"
          type: "integer"
        recipientCount:
          format: "int32"
          type: "integer"
        scope:
          enum:
          - "ALL"
          - "ORG"
          - "GROUP"
          type: "string"
        title:
          type: "string"
      type: "object"
    Applicant:
      properties:
        approvedCount:
          format: "int64"
          type: "integer"
        email:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        rejectedCount:
          format: "int64"
          type: "integer"
        signupAt:
          format: "date-time"
          type: "string"
      type: "object"
    ApprovalContextResponse:
      properties:
        applicant:
          $ref: "#/components/schemas/Applicant"
        applicantResources:
          $ref: "#/components/schemas/Resources"
        group:
          $ref: "#/components/schemas/GroupPanel"
        guidance:
          type: "string"
        history:
          items:
            $ref: "#/components/schemas/HistoryEntry"
          type: "array"
        orgHeadroom:
          $ref: "#/components/schemas/OrgHeadroom"
      type: "object"
    ApproveVmRequestRequest:
      properties:
        comment:
          maxLength: 2000
          minLength: 0
          type: "string"
        grantHttp:
          type: "boolean"
        grantPublic:
          type: "boolean"
        grantSsh:
          type: "boolean"
        grantedDiskGb:
          format: "int32"
          minimum: 1
          type: "integer"
        grantedEndDate:
          format: "date"
          type: "string"
        grantedMemoryMb:
          format: "int32"
          minimum: 256
          type: "integer"
        grantedRootDomain:
          type: "string"
        grantedSlug:
          pattern: "^\\s*$|^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type: "string"
        grantedStartDate:
          format: "date"
          type: "string"
        grantedSubdomain:
          type: "string"
        grantedTemplateId:
          format: "int64"
          type: "integer"
        grantedVcpu:
          format: "int32"
          minimum: 1
          type: "integer"
        nodeId:
          format: "int64"
          type: "integer"
      required:
      - "grantHttp"
      - "grantPublic"
      - "grantSsh"
      - "grantedDiskGb"
      - "grantedMemoryMb"
      - "grantedTemplateId"
      - "grantedVcpu"
      type: "object"
    Attention:
      properties:
        expiredVmCount:
          format: "int64"
          type: "integer"
        failedTaskCount:
          format: "int64"
          type: "integer"
        needsAdminVmCount:
          format: "int64"
          type: "integer"
      type: "object"
    AuditLogViewResponse:
      properties:
        action:
          type: "string"
        actorEmail:
          type: "string"
        actorId:
          format: "int64"
          type: "integer"
        actorName:
          type: "string"
        actorRole:
          type: "string"
        createdAt:
          format: "date-time"
          type: "string"
        detail:
          $ref: "#/components/schemas/JsonNode"
        id:
          format: "int64"
          type: "integer"
        ip:
          type: "string"
        orgName:
          type: "string"
        targetId:
          type: "string"
        targetType:
          type: "string"
      type: "object"
    AuthTokenResponse:
      properties:
        accessToken:
          type: "string"
        user:
          $ref: "#/components/schemas/UserSummaryResponse"
      type: "object"
    BeginMfaRequest:
      properties:
        password:
          minLength: 1
          type: "string"
      required:
      - "password"
      type: "object"
    Capacity:
      properties:
        cpuThreads:
          format: "int64"
          type: "integer"
        memoryMb:
          format: "int64"
          type: "integer"
      type: "object"
    CertificateView:
      properties:
        kind:
          enum:
          - "ORIGIN_CA_WILDCARD"
          - "LETS_ENCRYPT"
          type: "string"
        lastError:
          type: "string"
        notAfter:
          format: "date-time"
          type: "string"
        status:
          enum:
          - "ACTIVE"
          - "RENEWING"
          - "FAILED"
          - "REVOKED"
          type: "string"
      type: "object"
    ChangePasswordRequest:
      properties:
        currentPassword:
          minLength: 1
          type: "string"
        newPassword:
          maxLength: 72
          minLength: 10
          type: "string"
      required:
      - "currentPassword"
      - "newPassword"
      type: "object"
    ConsentInput:
      properties:
        docType:
          enum:
          - "TERMS_OF_SERVICE"
          - "PRIVACY_POLICY"
          type: "string"
        version:
          format: "int32"
          type: "integer"
      required:
      - "docType"
      type: "object"
    ConsentUpdateRequest:
      properties:
        consents:
          items:
            $ref: "#/components/schemas/ConsentInput"
          minItems: 1
          type: "array"
      required:
      - "consents"
      type: "object"
    ConsentView:
      properties:
        consentedAt:
          format: "date-time"
          type: "string"
        docType:
          enum:
          - "TERMS_OF_SERVICE"
          - "PRIVACY_POLICY"
          type: "string"
        version:
          format: "int32"
          type: "integer"
      type: "object"
    CreateGroupRequest:
      properties:
        description:
          maxLength: 500
          minLength: 0
          type: "string"
        kind:
          enum:
          - "PERSONAL"
          - "TEAM"
          - "PROJECT"
          type: "string"
        name:
          maxLength: 100
          minLength: 0
          type: "string"
        slug:
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          type: "string"
      required:
      - "kind"
      - "name"
      - "slug"
      type: "object"
    CreateOrgRequest:
      properties:
        description:
          maxLength: 500
          minLength: 0
          type: "string"
        name:
          maxLength: 100
          minLength: 0
          type: "string"
        slug:
          minLength: 1
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          type: "string"
      required:
      - "name"
      - "slug"
      type: "object"
    CreateVmRequestRequest:
      properties:
        courseOrProject:
          maxLength: 200
          minLength: 0
          type: "string"
        customDomain:
          pattern: "^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
          type: "string"
        desiredSlug:
          pattern: "^\\s*$|^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type: "string"
        desiredSubdomain:
          pattern: "^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
          type: "string"
        extraNote:
          maxLength: 2000
          minLength: 0
          type: "string"
        groupId:
          format: "int64"
          type: "integer"
        needHttp:
          type: "boolean"
        needPublic:
          type: "boolean"
        needSsh:
          type: "boolean"
        orgId:
          format: "int64"
          type: "integer"
        purpose:
          maxLength: 2000
          minLength: 0
          type: "string"
        reqDiskGb:
          format: "int32"
          minimum: 1
          type: "integer"
        reqEndDate:
          format: "date"
          type: "string"
        reqMemoryMb:
          format: "int32"
          minimum: 256
          type: "integer"
        reqStartDate:
          format: "date"
          type: "string"
        reqVcpu:
          format: "int32"
          minimum: 1
          type: "integer"
        rootDomain:
          maxLength: 253
          minLength: 0
          type: "string"
        specReason:
          maxLength: 2000
          minLength: 0
          type: "string"
        templateId:
          format: "int64"
          type: "integer"
      required:
      - "groupId"
      - "needHttp"
      - "needPublic"
      - "needSsh"
      - "orgId"
      - "purpose"
      - "reqDiskGb"
      - "reqMemoryMb"
      - "reqVcpu"
      - "templateId"
      type: "object"
    DisableMfaRequest:
      properties:
        code:
          pattern: "^[0-9]{6}$"
          type: "string"
        password:
          minLength: 1
          type: "string"
        recoveryCode:
          type: "string"
      required:
      - "password"
      type: "object"
    DisableUserRequest:
      properties:
        reason:
          maxLength: 500
          minLength: 1
          type: "string"
      required:
      - "reason"
      type: "object"
    DomainDetailView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "AUTO"
          - "REQUESTED"
          - "CUSTOM"
          type: "string"
        rootDomain:
          type: "string"
        status:
          enum:
          - "PENDING"
          - "VERIFYING"
          - "ACTIVE"
          - "FAILED"
          - "REMOVED"
          type: "string"
        verification:
          $ref: "#/components/schemas/DomainVerificationView"
        verifiedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
      type: "object"
    DomainSummaryView:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        fqdn:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "AUTO"
          - "REQUESTED"
          - "CUSTOM"
          type: "string"
        rootDomain:
          type: "string"
        status:
          enum:
          - "PENDING"
          - "VERIFYING"
          - "ACTIVE"
          - "FAILED"
          - "REMOVED"
          type: "string"
        verifiedAt:
          format: "date-time"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
      type: "object"
    DomainVerificationView:
      properties:
        aVerified:
          type: "boolean"
        lastCheckedAt:
          format: "date-time"
          type: "string"
        lastError:
          type: "string"
        requiredRecords:
          items:
            $ref: "#/components/schemas/RequiredRecord"
          type: "array"
        token:
          type: "string"
        txtVerified:
          type: "boolean"
      type: "object"
    DriftFindingResponse:
      properties:
        detail:
          $ref: "#/components/schemas/JsonNode"
        firstSeenAt:
          format: "date-time"
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "MISSING_IN_PROXMOX"
          - "UNMANAGED_GUEST"
          - "SPEC_MISMATCH"
          type: "string"
        lastSeenAt:
          format: "date-time"
          type: "string"
        nodeName:
          type: "string"
        proxmoxVmid:
          format: "int32"
          type: "integer"
        resolutionNote:
          type: "string"
        resolvedAt:
          format: "date-time"
          type: "string"
        resolvedByEmail:
          type: "string"
        resolvedById:
          format: "int64"
          type: "integer"
        status:
          enum:
          - "OPEN"
          - "RESOLVED"
          type: "string"
        summary:
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      type: "object"
    ForceDeleteVmRequest:
      properties:
        confirmName:
          minLength: 1
          type: "string"
        overrideProtection:
          type: "boolean"
      required:
      - "confirmName"
      type: "object"
    GroupDetailResponse:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        description:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "PERSONAL"
          - "TEAM"
          - "PROJECT"
          type: "string"
        members:
          items:
            $ref: "#/components/schemas/GroupMemberResponse"
          type: "array"
        myRole:
          enum:
          - "OWNER"
          - "EDITOR"
          - "MEMBER"
          - "VIEWER"
          type: "string"
        name:
          type: "string"
        slug:
          type: "string"
      type: "object"
    GroupMemberResponse:
      properties:
        email:
          type: "string"
        name:
          type: "string"
        role:
          enum:
          - "OWNER"
          - "EDITOR"
          - "MEMBER"
          - "VIEWER"
          type: "string"
        userId:
          format: "int64"
          type: "integer"
      type: "object"
    GroupPanel:
      properties:
        activeVms:
          items:
            $ref: "#/components/schemas/VmBriefResponse"
          type: "array"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "PERSONAL"
          - "TEAM"
          - "PROJECT"
          type: "string"
        members:
          items:
            $ref: "#/components/schemas/MemberBrief"
          type: "array"
        name:
          type: "string"
        totals:
          $ref: "#/components/schemas/ResourceTotalsResponse"
      type: "object"
    GroupSummaryResponse:
      properties:
        description:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        kind:
          enum:
          - "PERSONAL"
          - "TEAM"
          - "PROJECT"
          type: "string"
        memberCount:
          format: "int64"
          type: "integer"
        myRole:
          enum:
          - "OWNER"
          - "EDITOR"
          - "MEMBER"
          - "VIEWER"
          type: "string"
        name:
          type: "string"
        slug:
          type: "string"
      type: "object"
    HistoryEntry:
      properties:
        comment:
          type: "string"
        decision:
          enum:
          - "APPROVE"
          - "REJECT"
          type: "string"
        requestId:
          format: "int64"
          type: "integer"
        reviewerName:
          type: "string"
        status:
          enum:
          - "SUBMITTED"
          - "APPROVED"
          - "REJECTED"
          - "CANCELED"
          type: "string"
        submittedAt:
          format: "date-time"
          type: "string"
      type: "object"
    IpAllocationResponse:
      properties:
        allocatedAt:
          format: "date-time"
          type: "string"
        hostname:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        ip:
          type: "string"
        poolId:
          format: "int64"
          type: "integer"
        poolName:
          type: "string"
        releasedAt:
          format: "date-time"
          type: "string"
        status:
          enum:
          - "ALLOCATED"
          - "RELEASED"
          type: "string"
        vmId:
          format: "int64"
          type: "integer"
        vmName:
          type: "string"
      type: "object"
    IpPoolSummaryResponse:
      properties:
        allocatedCount:
          format: "int64"
          type: "integer"
        cidr:
          type: "string"
        freeCount:
          format: "int64"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
      type: "object"
    IpPoolUsage:
      properties:
        allocatedCount:
          format: "int64"
          type: "integer"
        cidr:
          type: "string"
        freeCount:
          format: "int64"
          type: "integer"
        id:
          format: "int64"
          type: "integer"
        name:
          type: "string"
      type: "object"
    JsonNode:
      properties:
        array:
          type: "boolean"
        bigDecimal:
          type: "boolean"
        bigInteger:
          type: "boolean"
        binary:
          type: "boolean"
        boolean:
