          - $ref: "#/components/schemas/CreateGpuRequestSpec"
          - type: "null"
        llmKey:
          anyOf:
          - $ref: "#/components/schemas/CreateLlmKeyRequestSpec"
          - type: "null"
        orgId:
          description: "신청할 기관이에요. 리소스 종류가 기관을 스스로 정하지 않을 때만 필수예요. 외부 도메인은 선택한 루트\
            \ 도메인으로 기관을 정하므로 보내지 않아요."
          format: "uuid"
          type:
          - "string"
          - "null"
        periodPresetId:
          format: "uuid"
          type:
          - "string"
          - "null"
        purpose:
          maxLength: 2000
          minLength: 0
          type: "string"
        recipients:
          description: "리소스를 받을 대상자예요. 비우면 신청자 본인이 받는 일반 신청이에요. VM과 LLM API 키에만 사용\
            할 수 있고, 워크스페이스 소유자나 해당 명단 발급 업무가 있는 담당자가 지정할 수 있어요. 대상자마다 리소스 하나를 만들며\
            , 실제 생성은 신청 승인 뒤 이용 기간과 활성 구성원 여부 등 현재 조건에 따라 별도 작업으로 진행해요."
          items:
            $ref: "#/components/schemas/CreateRequestRecipient"
          maxItems: 200
          minItems: 0
          type:
          - "array"
          - "null"
        reqEndDate:
          format: "date"
          type:
          - "string"
          - "null"
        reqIndefinite:
          description: "true면 종료일 없이 신청해요. reqEndDate나 periodPresetId와 함께 지정할 수 없어\
            요."
          type:
          - "boolean"
          - "null"
        type:
          $ref: "#/components/schemas/ResourceType"
        vm:
          anyOf:
          - $ref: "#/components/schemas/CreateVmRequestSpec"
          - type: "null"
        workspaceId:
          format: "uuid"
          type: "string"
