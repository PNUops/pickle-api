          type: "boolean"
        concurrency:
          description: "동시 요청 한도예요. 생략하면 유지하고 null이면 서비스 기본값을 따라요."
          format: "int32"
          maximum: 100
          minimum: 1
          type:
          - "integer"
          - "null"
        creditAllowedModels:
          description: "유료 모델 허용 패턴이에요. 생략하면 유지하고 빈 배열이나 null이면 이 목록의 제한을 비워요. 금액\
            \ 한도와 달리 null은 0을 뜻하지 않아요. 자체 서빙 모델은 이 값의 영향을 받지 않아요. 각 항목에는 부호 없는 모델\
            \ 패턴을 입력해요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*, */*-pro). 공급자 *는\
            \ ~별칭도 포함하며 특정 공급자를 허용할 때는 ~별칭을 별도로 적어야 해요. 정확한 모델명은 :batch 같은 변형도 포함해\
            요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type:
          - "array"
          - "null"
        creditDeniedModels:
          description: "유료 모델 차단 패턴이에요. 생략하면 유지하고 빈 배열이나 null이면 차단 패턴을 비워요. 허용 패턴과\
            \ 겹치면 차단을 우선해요. 허용 목록과 달리 금액 한도가 0이어도 유지해요. 자체 서빙 모델은 이 값의 영향을 받지 않아요\
            . 각 항목은 허용 목록과 같은 부호 없는 모델 패턴이에요. 공급자는 정확한 이름 또는 *만 사용할 수 있어요(예: openai/*,\
            \ */*-pro). 차단은 ~를 제거한 이름도 검사하며 별칭의 실제 대상 모델은 추적하지 않아요. 정확한 모델명은 :batch\
            \ 같은 변형도 포함해요. 목록마다 최대 50개, 항목마다 200바이트까지 입력해요."
          items:
            type: "string"
          maxItems: 50
          minItems: 0
          type:
          - "array"
          - "null"
        creditLimit:
          description: "금액 한도예요(USD 크레딧). 생략하면 유지하고 null은 허용하지 않아요. 0이면 유료 모델을 닫아요\
            ."
