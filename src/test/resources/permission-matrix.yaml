# Operator-confirmed permission matrix (contract v0.34.0, 144 ops × 5 roles),
# enforced 1:1 by PermissionMatrixTest. One entry per operationId. This file is
# POLICY; PermissionMatrixTest asserts the live @PreAuthorize gates match it 1:1
# and that the runtime op set equals this file exactly.
#
# Tokens (legend):
#   public                       — no authentication (security: []); no role gate
#   allow                        — allowed, authentication only (no org scoping)
#   allow_org_scoped             — allowed; service layer forces caller's own org
#                                  (cross-org target -> 404 existence mask)
#   allow_workspace_scoped:<ROLE> — allowed to the named WORKSPACE rung or above
#                                  (OWNER/MEMBER), enforced in the service layer
#                                  (no @PreAuthorize)
#   allow_resource_scoped:<ROLE> — allowed to the named RESOURCE rung or above on
#                                  the resource in the path, read from its access
#                                  list (OWNER/EDITOR/MEMBER/VIEWER); a workspace
#                                  owner additionally holds a standing VIEWER
#                                  read plus deletion and access management.
#                                  Service layer, no @PreAuthorize
#   deny                         — denied (403 via method security / not offered)
#
# How the test reads tokens: a row with >=1 `deny` is role-gated, and its
# @PreAuthorize must name exactly the roles marked allow / allow_org_scoped. A
# row with no `deny` (self / catalog / workspace-scoped / notifications / deleteVm)
# is authentication-only and must carry NO @PreAuthorize (service layer decides).
# `public` rows carry no gate and must not require authentication.
#
# Roles in privilege order: USER, ORG_MANAGER, ORG_ADMIN, SYS_MANAGER, SYS_ADMIN.

operations:

  # ── 3.1 Auth & public meta (no authentication) ────────────────────────────
  - { id: signup,               method: POST,   path: "/auth/signup",                        roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: verifyEmail,          method: POST,   path: "/auth/verify-email",                  roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: resendVerification,   method: POST,   path: "/auth/resend-verification",           roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: login,                method: POST,   path: "/auth/login",                         roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: refresh,              method: POST,   path: "/auth/refresh",                       roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: logout,               method: POST,   path: "/auth/logout",                        roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: reverify,            method: POST,   path: "/auth/reverify",               roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: requestPasswordReset, method: POST,   path: "/auth/password-reset",                roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: confirmPasswordReset, method: POST,   path: "/auth/password-reset/confirm",        roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: completeMfaLogin,     method: POST,   path: "/auth/mfa",                           roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: getSystemStatus,      method: GET,    path: "/meta/status",                        roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: listTermsVersions,    method: GET,    path: "/meta/terms",                         roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: getTermsDocument,     method: GET,    path: "/meta/terms/{docType}",               roles: { USER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_MANAGER: public, SYS_ADMIN: public } }

  # ── 3.2 Me / self (any authenticated) ─────────────────────────────────────
  - { id: getMe,                       method: GET,    path: "/me",                          roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listMyActivity,              method: GET,    path: "/me/activity",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listMySshKeys,               method: GET,    path: "/me/ssh-keys",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: registerMySshKey,            method: POST,   path: "/me/ssh-keys",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: generateMySshKey,            method: POST,   path: "/me/ssh-keys/generate",        roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: deleteMySshKey,              method: DELETE, path: "/me/ssh-keys/{keyId}",         roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: downloadMySshKeyPrivateKey,  method: GET,    path: "/me/ssh-keys/{keyId}/private-key", roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: changeMyPassword,            method: PUT,    path: "/me/password",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: withdrawMyAccount,           method: POST,   path: "/me/withdraw",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: beginMfaTotpSetup,           method: POST,   path: "/me/mfa/totp",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: activateMfaTotp,             method: POST,   path: "/me/mfa/totp/activate",        roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: disableMyMfa,                method: POST,   path: "/me/mfa/disable",              roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: regenerateMfaRecoveryCodes,  method: POST,   path: "/me/mfa/recovery-codes",       roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listMyConsents,              method: GET,    path: "/me/consents",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: acceptConsents,              method: POST,   path: "/me/consents",                 roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }

  # ── 3.3 Catalog / lookup (any authenticated) ──────────────────────────────
  - { id: listOrgs,             method: GET,    path: "/orgs",                        roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listOsImages,        method: GET,    path: "/os-images",                   roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listVmFlavors,        method: GET,    path: "/vm-flavors",                  roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: getRequestOptions,    method: GET,    path: "/meta/request-options",        roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }

  # ── 3.4 Workspaces (workspace-role-scoped, service level) ─────────────────────────
  - { id: listWorkspaces,           method: GET,    path: "/workspaces",                          roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: createWorkspace,          method: POST,   path: "/workspaces",                          roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: getWorkspace,             method: GET,    path: "/workspaces/{workspaceId}",                roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: updateWorkspace,          method: PATCH,  path: "/workspaces/{workspaceId}",                roles: { USER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: deleteWorkspace,          method: DELETE, path: "/workspaces/{workspaceId}",                roles: { USER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: addWorkspaceMember,       method: POST,   path: "/workspaces/{workspaceId}/members",        roles: { USER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: updateWorkspaceMember,    method: PATCH,  path: "/workspaces/{workspaceId}/members/{userId}", roles: { USER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: removeWorkspaceMember,    method: DELETE, path: "/workspaces/{workspaceId}/members/{userId}", roles: { USER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }

  # ── 3.5 VM requests (workspace-role-scoped) ───────────────────────────────────
  - { id: createRequest,      method: POST,   path: "/requests",                     roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: listRequests,       method: GET,    path: "/requests",                     roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: getRequest,         method: GET,    path: "/requests/{requestId}",         roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: cancelRequest,      method: POST,   path: "/requests/{requestId}/cancel",  roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }

  # ── 3.6 VMs (access-list scoped; deleteVm has service-layer admin override) ─
  - { id: listVms,              method: GET,    path: "/vms",                             roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: getVm,                method: GET,    path: "/vms/{vmId}",                      roles: { USER: allow_resource_scoped:VIEWER, ORG_MANAGER: allow_resource_scoped:VIEWER, ORG_ADMIN: allow_resource_scoped:VIEWER, SYS_MANAGER: allow_resource_scoped:VIEWER, SYS_ADMIN: allow_resource_scoped:VIEWER } }
  # deleteVm: workspace OWNER for everyone, plus ORG_ADMIN (own org) / SYS_ADMIN admin
  # override in VmDeletionService. ORG_MANAGER/SYS_MANAGER keep ONLY the workspace-OWNER
  # path. No role is denied -> no @PreAuthorize.
  - { id: deleteVm,             method: DELETE, path: "/vms/{vmId}",                      roles: { USER: allow_resource_scoped:OWNER, ORG_MANAGER: allow_resource_scoped:OWNER, ORG_ADMIN: allow_org_scoped, SYS_MANAGER: allow_resource_scoped:OWNER, SYS_ADMIN: allow } }
  - { id: startVm,              method: POST,   path: "/vms/{vmId}/start",                roles: { USER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: shutdownVm,           method: POST,   path: "/vms/{vmId}/shutdown",             roles: { USER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: rebootVm,             method: POST,   path: "/vms/{vmId}/reboot",               roles: { USER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: forceStopVm,          method: POST,   path: "/vms/{vmId}/force-stop",           roles: { USER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: revealVmPassword,     method: GET,    path: "/vms/{vmId}/password",             roles: { USER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: regenerateVmPassword, method: POST,   path: "/vms/{vmId}/password/regenerate",  roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: getVmSettings,        method: GET,    path: "/vms/{vmId}/settings",             roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: updateVmSettings,     method: PATCH,  path: "/vms/{vmId}/settings",             roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: listVmEvents,         method: GET,    path: "/vms/{vmId}/events",               roles: { USER: allow_resource_scoped:VIEWER, ORG_MANAGER: allow_resource_scoped:VIEWER, ORG_ADMIN: allow_resource_scoped:VIEWER, SYS_MANAGER: allow_resource_scoped:VIEWER, SYS_ADMIN: allow_resource_scoped:VIEWER } }
  - { id: createVmDomain,       method: POST,   path: "/vms/{vmId}/domains",              roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  # createTerminalSession: workspace MEMBER+ mints a web-terminal ticket; non-members/VIEWER/missing → 404 mask (service-layer, no @PreAuthorize).
  - { id: createTerminalSession, method: POST, path: "/vms/{vmId}/terminal-sessions", roles: { USER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }

  # ── 3.6a VM access list (resource OWNER; a workspace owner manages it too) ─────
  # The three writes are re-authentication (sudo-mode) operations, same as the
  # workspace-membership writes: both decide who reaches something.
  - { id: listVmAccessGrants, method: GET, path: "/vms/{vmId}/access", roles: { USER: allow_resource_scoped:OWNER, ORG_MANAGER: allow_resource_scoped:OWNER, ORG_ADMIN: allow_resource_scoped:OWNER, SYS_MANAGER: allow_resource_scoped:OWNER, SYS_ADMIN: allow_resource_scoped:OWNER } }
  - { id: addVmAccessGrant, method: POST, path: "/vms/{vmId}/access", roles: { USER: allow_resource_scoped:OWNER, ORG_MANAGER: allow_resource_scoped:OWNER, ORG_ADMIN: allow_resource_scoped:OWNER, SYS_MANAGER: allow_resource_scoped:OWNER, SYS_ADMIN: allow_resource_scoped:OWNER } }
  - { id: updateVmAccessGrant, method: PATCH, path: "/vms/{vmId}/access/{grantId}", roles: { USER: allow_resource_scoped:OWNER, ORG_MANAGER: allow_resource_scoped:OWNER, ORG_ADMIN: allow_resource_scoped:OWNER, SYS_MANAGER: allow_resource_scoped:OWNER, SYS_ADMIN: allow_resource_scoped:OWNER } }
  - { id: removeVmAccessGrant, method: DELETE, path: "/vms/{vmId}/access/{grantId}", roles: { USER: allow_resource_scoped:OWNER, ORG_MANAGER: allow_resource_scoped:OWNER, ORG_ADMIN: allow_resource_scoped:OWNER, SYS_MANAGER: allow_resource_scoped:OWNER, SYS_ADMIN: allow_resource_scoped:OWNER } }

  # ── 3.7 Domains (access-list scoped via the owning VM) ────────────────────
  - { id: listDomains,          method: GET,    path: "/domains",                         roles: { USER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: getDomain,            method: GET,    path: "/domains/{domainId}",              roles: { USER: allow_resource_scoped:VIEWER, ORG_MANAGER: allow_resource_scoped:VIEWER, ORG_ADMIN: allow_resource_scoped:VIEWER, SYS_MANAGER: allow_resource_scoped:VIEWER, SYS_ADMIN: allow_resource_scoped:VIEWER } }
  - { id: updateDomain,         method: PATCH,  path: "/domains/{domainId}",              roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: deleteDomain,         method: DELETE, path: "/domains/{domainId}",              roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: verifyDomain,         method: POST,   path: "/domains/{domainId}/verify",       roles: { USER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }

  # ── 3.8 Notifications (self-scoped) ───────────────────────────────────────
  - { id: listNotifications,          method: GET,  path: "/notifications",                       roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: getUnreadNotificationCount, method: GET,  path: "/notifications/unread-count",          roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: markNotificationRead,       method: POST, path: "/notifications/{notificationId}/read", roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: markAllNotificationsRead,   method: POST, path: "/notifications/read-all",              roles: { USER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }

  # ── 3.9 Admin — VM request approval ───────────────────────────────────────
  - { id: listAdminRequests,  method: GET,    path: "/admin/requests",                        roles: { USER: deny, ORG_MANAGER: allow_org_scoped, ORG_ADMIN: allow_org_scoped, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: getAdminRequest,    method: GET,    path: "/admin/requests/{requestId}",            roles: { USER: deny, ORG_MANAGER: allow_org_scoped, ORG_ADMIN: allow_org_scoped, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: getApprovalContext,   method: GET,    path: "/admin/requests/{requestId}/context",    roles: { USER: deny, ORG_MANAGER: allow_org_scoped, ORG_ADMIN: allow_org_scoped, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: approveRequest,     method: POST,   path: "/admin/requests/{requestId}/approve",    roles: { USER: deny, ORG_MANAGER: allow_org_scoped, ORG_ADMIN: allow_org_scoped, SYS_MANAGER: deny, SYS_ADMIN: allow } }
  - { id: rejectRequest,      method: POST,   path: "/admin/requests/{requestId}/reject",     roles: { USER: deny, ORG_MANAGER: allow_org_scoped, ORG_ADMIN: allow_org_scoped, SYS_MANAGER: deny, SYS_ADMIN: allow } }

  # ── 3.10 Admin — orgs & users ─────────────────────────────────────────────
  - { id: listAdminOrgs,        method: GET,    path: "/admin/orgs",                       roles: { USER: deny, ORG_MANAGER: deny, ORG_ADMIN: deny, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: createOrg,            method: POST,   path: "/admin/orgs",                       roles: { USER: deny, ORG_MANAGER: deny, ORG_ADMIN: deny, SYS_MANAGER: deny, SYS_ADMIN: allow } }
