# Operator-confirmed permission matrix (contract v0.57.0, 195 ops × 7 roles),
# enforced 1:1 by PermissionMatrixTest. One entry per operationId. This file is
# POLICY; PermissionMatrixTest asserts the live @PreAuthorize gates match it 1:1
# and that the runtime op set equals this file exactly.
#
# Tokens (legend):
#   public                       — no authentication (security: []); no role gate
#   allow                        — allowed, authentication only (no org scoping)
#   allow_org_scoped             — allowed; service layer forces caller's own org
#                                  (cross-org target -> 404 existence mask)
#   allow_workspace_scoped:<ROLE> — allowed to the named WORKSPACE rung or above
#                                  (OWNER/MEMBER), enforced in the service layer
#                                  (no @PreAuthorize)
#   allow_resource_scoped:<ROLE> — allowed to the named RESOURCE rung or above on
#                                  the resource in the path, read from its access
#                                  list (OWNER/EDITOR/MEMBER/VIEWER); a workspace
#                                  owner additionally holds a standing VIEWER
#                                  read plus deletion and access management.
#                                  Service layer, no @PreAuthorize
#   <token>+<token>              — two independent paths to the same operation;
#                                  holding either is enough. Written out so a
#                                  standing right is greppable rather than
#                                  living only in a note (revokeLlmKey)
#   deny                         — denied (403 via method security / not offered)
#
# How the test reads tokens: a row with >=1 `deny` is role-gated, and its
# @PreAuthorize must name exactly the roles marked allow / allow_org_scoped. A
# row with no `deny` (self / catalog / workspace-scoped / notifications / deleteVm)
# is authentication-only and must carry NO @PreAuthorize (service layer decides).
# `public` rows carry no gate and must not require authentication.
#
# Roles in privilege order: USER, ORG_VIEWER, ORG_MANAGER, ORG_ADMIN, SYS_VIEWER,
# SYS_MANAGER, SYS_ADMIN. Each tier is three deep: an administrator does
# everything in its tier, an operator the daily work, a viewer only reads. The
# viewer roles are what one organisation grants another's staff so they can see
# its resources without touching them, so ORG_VIEWER holds exactly the reads
# ORG_MANAGER holds and nothing else. One exception: the audit log, which
# carries login addresses, so within the org tier it stays with the roles that
# may act and ORG_VIEWER is the one role denied there. SYS_VIEWER reads it like
# every other system read — "viewers are excluded" is true of the org viewer
# only, and the unqualified form of that sentence was wrong here until
# 2026-08-26.

operations:

  # ── 3.1 Auth & public meta (no authentication) ────────────────────────────
  - { id: signup,               method: POST,   path: "/auth/signup",                        roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: verifyEmail,          method: POST,   path: "/auth/verify-email",                  roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: resendVerification,   method: POST,   path: "/auth/resend-verification",           roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: login,                method: POST,   path: "/auth/login",                         roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: refresh,              method: POST,   path: "/auth/refresh",                       roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: logout,               method: POST,   path: "/auth/logout",                        roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: reverify,            method: POST,   path: "/auth/reverify",               roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: startGoogleOauth,                 method: POST,   path: "/auth/oauth/google/start",               roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: completeGoogleOauthCallback,      method: POST,   path: "/auth/oauth/google/callback",            roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: completeGoogleOauthRegistration,  method: POST,   path: "/auth/oauth/google/complete",            roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: requestPasswordReset, method: POST,   path: "/auth/password-reset",                roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: confirmPasswordReset, method: POST,   path: "/auth/password-reset/confirm",        roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: completeMfa,     method: POST,   path: "/auth/mfa",                           roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: systemStatus,      method: GET,    path: "/meta/status",                        roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: listTerms,    method: GET,    path: "/meta/terms",                         roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: getTerms,     method: GET,    path: "/meta/terms/{docType}",               roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }
  - { id: profileOptions, method: GET,  path: "/meta/profile-options",              roles: { USER: public, ORG_VIEWER: public, ORG_MANAGER: public, ORG_ADMIN: public, SYS_VIEWER: public, SYS_MANAGER: public, SYS_ADMIN: public } }

  # ── 3.2 Me / self (any authenticated) ─────────────────────────────────────
  - { id: me,                       method: GET,    path: "/me",                          roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: updateMyProfile,          method: PUT,    path: "/me/profile",                  roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: unlinkIdentity,           method: DELETE, path: "/me/identities/{provider}",    roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listMyActivity,              method: GET,    path: "/me/activity",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: changePassword,            method: PUT,    path: "/me/password",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: setPassword,               method: POST,   path: "/me/password",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: withdraw,           method: POST,   path: "/me/withdraw",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: begin,           method: POST,   path: "/me/mfa/totp",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: activate,             method: POST,   path: "/me/mfa/totp/activate",        roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: disable,                method: POST,   path: "/me/mfa/disable",              roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: regenerateRecoveryCodes,  method: POST,   path: "/me/mfa/recovery-codes",       roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listMyConsents,              method: GET,    path: "/me/consents",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: acceptConsents,              method: POST,   path: "/me/consents",                 roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }

  # ── 3.3 Catalog / lookup (any authenticated) ──────────────────────────────
  - { id: listOrgs,             method: GET,    path: "/orgs",                        roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listOsImages,        method: GET,    path: "/os-images",                   roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: listVmFlavors,        method: GET,    path: "/vm-flavors",                  roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: requestOptions,    method: GET,    path: "/meta/request-options",        roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }

  # ── 3.4 Workspaces (workspace-role-scoped, service level) ─────────────────────────
  - { id: listWorkspaces,           method: GET,    path: "/workspaces",                          roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: createWorkspace,          method: POST,   path: "/workspaces",                          roles: { USER: allow, ORG_VIEWER: allow, ORG_MANAGER: allow, ORG_ADMIN: allow, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
  - { id: getWorkspace,             method: GET,    path: "/workspaces/{workspaceId}",                roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: updateWorkspace,          method: PATCH,  path: "/workspaces/{workspaceId}",                roles: { USER: allow_workspace_scoped:OWNER, ORG_VIEWER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_VIEWER: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: deleteWorkspace,          method: DELETE, path: "/workspaces/{workspaceId}",                roles: { USER: allow_workspace_scoped:OWNER, ORG_VIEWER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_VIEWER: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: addWorkspaceMember,       method: POST,   path: "/workspaces/{workspaceId}/members",        roles: { USER: allow_workspace_scoped:OWNER, ORG_VIEWER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_VIEWER: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: updateWorkspaceMember,    method: PATCH,  path: "/workspaces/{workspaceId}/members/{userId}", roles: { USER: allow_workspace_scoped:OWNER, ORG_VIEWER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_VIEWER: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }
  - { id: removeWorkspaceMember,    method: DELETE, path: "/workspaces/{workspaceId}/members/{userId}", roles: { USER: allow_workspace_scoped:OWNER, ORG_VIEWER: allow_workspace_scoped:OWNER, ORG_MANAGER: allow_workspace_scoped:OWNER, ORG_ADMIN: allow_workspace_scoped:OWNER, SYS_VIEWER: allow_workspace_scoped:OWNER, SYS_MANAGER: allow_workspace_scoped:OWNER, SYS_ADMIN: allow_workspace_scoped:OWNER } }

  # ── 3.5 VM requests (workspace-role-scoped) ───────────────────────────────────
  - { id: createRequest,      method: POST,   path: "/requests",                     roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: listResources,      method: GET,    path: "/resources",                       roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: listRequests,       method: GET,    path: "/requests",                     roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: getRequest,         method: GET,    path: "/requests/{requestId}",         roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: cancelRequest,      method: POST,   path: "/requests/{requestId}/cancel",  roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }

  # ── 3.6 VMs (access-list scoped; deleteVm has service-layer admin override) ─
  - { id: listVms,              method: GET,    path: "/vms",                             roles: { USER: allow_workspace_scoped:MEMBER, ORG_VIEWER: allow_workspace_scoped:MEMBER, ORG_MANAGER: allow_workspace_scoped:MEMBER, ORG_ADMIN: allow_workspace_scoped:MEMBER, SYS_VIEWER: allow_workspace_scoped:MEMBER, SYS_MANAGER: allow_workspace_scoped:MEMBER, SYS_ADMIN: allow_workspace_scoped:MEMBER } }
  - { id: getVm,                method: GET,    path: "/vms/{vmId}",                      roles: { USER: allow_resource_scoped:VIEWER, ORG_VIEWER: allow_resource_scoped:VIEWER, ORG_MANAGER: allow_resource_scoped:VIEWER, ORG_ADMIN: allow_resource_scoped:VIEWER, SYS_VIEWER: allow_resource_scoped:VIEWER, SYS_MANAGER: allow_resource_scoped:VIEWER, SYS_ADMIN: allow_resource_scoped:VIEWER } }
  # deleteVm: workspace OWNER for everyone, plus ORG_ADMIN (own org) / SYS_ADMIN admin
  # override in VmDeletionService. ORG_MANAGER/SYS_MANAGER keep ONLY the workspace-OWNER
  # path. No role is denied -> no @PreAuthorize.
  - { id: deleteVm,             method: DELETE, path: "/vms/{vmId}",                      roles: { USER: allow_resource_scoped:OWNER, ORG_VIEWER: allow_resource_scoped:OWNER, ORG_MANAGER: allow_resource_scoped:OWNER, ORG_ADMIN: allow_org_scoped, SYS_VIEWER: allow_resource_scoped:OWNER, SYS_MANAGER: allow_resource_scoped:OWNER, SYS_ADMIN: allow } }
  - { id: startVm,              method: POST,   path: "/vms/{vmId}/start",                roles: { USER: allow_resource_scoped:MEMBER, ORG_VIEWER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_VIEWER: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: shutdownVm,           method: POST,   path: "/vms/{vmId}/shutdown",             roles: { USER: allow_resource_scoped:MEMBER, ORG_VIEWER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_VIEWER: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: rebootVm,             method: POST,   path: "/vms/{vmId}/reboot",               roles: { USER: allow_resource_scoped:MEMBER, ORG_VIEWER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_VIEWER: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: forceStopVm,          method: POST,   path: "/vms/{vmId}/force-stop",           roles: { USER: allow_resource_scoped:MEMBER, ORG_VIEWER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_VIEWER: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: revealVmPassword,     method: GET,    path: "/vms/{vmId}/password",             roles: { USER: allow_resource_scoped:MEMBER, ORG_VIEWER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_VIEWER: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  - { id: regenerateVmPassword, method: POST,   path: "/vms/{vmId}/password/regenerate",  roles: { USER: allow_resource_scoped:EDITOR, ORG_VIEWER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_VIEWER: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: getVmSettings,        method: GET,    path: "/vms/{vmId}/settings",             roles: { USER: allow_resource_scoped:EDITOR, ORG_VIEWER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_VIEWER: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: updateVmSettings,     method: PATCH,  path: "/vms/{vmId}/settings",             roles: { USER: allow_resource_scoped:EDITOR, ORG_VIEWER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_VIEWER: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  - { id: listVmEvents,         method: GET,    path: "/vms/{vmId}/events",               roles: { USER: allow_resource_scoped:VIEWER, ORG_VIEWER: allow_resource_scoped:VIEWER, ORG_MANAGER: allow_resource_scoped:VIEWER, ORG_ADMIN: allow_resource_scoped:VIEWER, SYS_VIEWER: allow_resource_scoped:VIEWER, SYS_MANAGER: allow_resource_scoped:VIEWER, SYS_ADMIN: allow_resource_scoped:VIEWER } }
  - { id: getVmMetrics,         method: GET,    path: "/vms/{vmId}/metrics",              roles: { USER: allow_resource_scoped:VIEWER, ORG_VIEWER: allow_resource_scoped:VIEWER, ORG_MANAGER: allow_resource_scoped:VIEWER, ORG_ADMIN: allow_resource_scoped:VIEWER, SYS_VIEWER: allow_resource_scoped:VIEWER, SYS_MANAGER: allow_resource_scoped:VIEWER, SYS_ADMIN: allow_resource_scoped:VIEWER } }
  - { id: createVmDomain,       method: POST,   path: "/vms/{vmId}/domains",              roles: { USER: allow_resource_scoped:EDITOR, ORG_VIEWER: allow_resource_scoped:EDITOR, ORG_MANAGER: allow_resource_scoped:EDITOR, ORG_ADMIN: allow_resource_scoped:EDITOR, SYS_VIEWER: allow_resource_scoped:EDITOR, SYS_MANAGER: allow_resource_scoped:EDITOR, SYS_ADMIN: allow_resource_scoped:EDITOR } }
  # createTerminalSession: workspace MEMBER+ mints a web-terminal ticket; non-members/VIEWER/missing → 404 mask (service-layer, no @PreAuthorize).
  - { id: createTerminalSession, method: POST, path: "/vms/{vmId}/terminal-sessions", roles: { USER: allow_resource_scoped:MEMBER, ORG_VIEWER: allow_resource_scoped:MEMBER, ORG_MANAGER: allow_resource_scoped:MEMBER, ORG_ADMIN: allow_resource_scoped:MEMBER, SYS_VIEWER: allow_resource_scoped:MEMBER, SYS_MANAGER: allow_resource_scoped:MEMBER, SYS_ADMIN: allow_resource_scoped:MEMBER } }
  # Per-VM SSH keys (v0.42.0): resource MEMBER+ throughout, non-member 404 mask
