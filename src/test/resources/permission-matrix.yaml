# Current authorization surface (contract v0.107.0, 313 operations, seven account roles).
# PermissionMatrixTest verifies the operation set, coarse controller role admission,
# and the unauthenticated boundary. It does not treat a display role as institution authority.
#
# Tokens:
#   public                       no authentication; normal visibility rules still apply
#   allow                        authentication or the operation's existing SYS exception
#   allow_institution_work       coarse admission only; the exact work and verified target
#                                must pass in one complete FULL/SELECTED source
#   allow_workspace_scoped:ROLE  ordinary personal workspace standing (no role gate)
#   allow_resource_scoped:ROLE   ordinary personal resource/OWNER standing (no role gate)
#   token+token                  independent paths; one does not borrow the other's scope
#   deny                         coarse role rejection
#
# Institution decisions retain account, source institution, mode, work, per-group
# ALL/LISTED workspace scope and revision. The highest display role does not grant
# another source's work or widen its scope. SYS exceptions remain operation-specific.
# Legacy FULL/finite SELECTED conversion and field/query/command projection are
# exercised by the institution, migration and per-surface HTTP tests separately.
# A public notice image still needs active public visibility or explicit notice work
# for scheduled/ended content; the public token records the permitAll boundary only.

operations:
  - { id: getAdminResourceAccess, method: GET, path: "/admin/resource-access/{resourceType}/{resourceId}", roles: { USER: deny, ORG_VIEWER: allow_institution_work, ORG_MANAGER: allow_institution_work, ORG_ADMIN: allow_institution_work, SYS_VIEWER: allow, SYS_MANAGER: allow, SYS_ADMIN: allow } }
