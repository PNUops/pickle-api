# JobRunr 8 spring starter reads the `jobrunr.*` prefix (NOT `org.jobrunr.*`).
# The background job server stays off for regular tests (enqueues are asserted
# on the jobrunr tables); ProvisioningEndToEndTest switches it on via test
# properties.
jobrunr:
  background-job-server:
    enabled: false
  job-scheduler:
    enabled: true
  dashboard:
    # Pinned off so a stray PICKLE_JOBRUNR_DASH_ENABLED env var can never start
    # the dashboard web server inside the test JVM.
    enabled: false

spring:
  datasource:
    # Zonky supplies the embedded instance, but the base document's placeholder
    # still has to resolve; the base carries no default so a deployment that
    # forgets PICKLE_DB_PASSWORD cannot start.
    password: pickle-test
  flyway:
    enabled: true

pickle:
  seed:
    # Test-only fixtures: the base document carries no seed password, so the
    # dev/test seeder takes its values from here (dev takes them from the env).
    sysadmin-password: pickle-test-sysadmin!
    orgadmin-password: pickle-test-orgadmin!
  jwt:
    secret: pickle-test-jwt-secret-0123456789abcdef-test
  credentials:
    encryption-key: 4IUuLkNP8ook5VuNU7By7GAq0J8rbFOcEfuExymtueM=
  openrouter:
    management-key: test-openrouter-legacy-management-key
    account-binding-enabled: true
  openrouter-credential-keyring:
    write-key-id: test-v1
    read-keys: test-v1=4IUuLkNP8ook5VuNU7By7GAq0J8rbFOcEfuExymtueM=
  ssh:
    advertised-host: ssh.pcl.kr
    advertised-port: 22
    platform-public-key: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlatformGatewayKeyFixtureForTests pickle-sshgw'
  sshgw:
    # Known token/source for the /internal/sshgw/route filter-chain tests.
    token: test-sshgw-token
    allowed-source-ip: 172.30.1.30
    rate-limit-per-minute: 60
  terminal:
    # Known control token/URL for the force-terminate tests (WireMock points here).
    bridge-control-base-url: http://127.0.0.1:0
    bridge-control-token: test-terminal-control-token
    # Multiple Spring test contexts are cached alive in one JVM; the PG advisory
    # single-instance lock would trip across contexts, so it is disabled in tests.
    enforce-single-instance: false
