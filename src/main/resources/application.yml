spring:
  application:
    name: pickle-api
  datasource:
    url: ${PICKLE_DB_URL:jdbc:postgresql://localhost:5432/pickle_dev}
    username: ${PICKLE_DB_USER:pickle}
    # No default: a database password is a credential, and the other credentials
    # here (JWT secret, credential-encryption key) refuse to start rather than
    # fall back to a guessable value. A literal default also
    # lets a deployment that forgot the variable connect to whatever database
    # happens to accept it, which is worse than not starting.
    password: ${PICKLE_DB_PASSWORD}
    hikari:
      # Explicit, not the Hikari default (10): worst-case transaction demand is
      # every job worker (16, below) in a short DB transaction at once plus web
      # requests; 20 covers that with headroom while staying far under the
      # Postgres default max_connections (100) on the shared host. Long agent
      # calls hold NO connection (they run outside transactions), so the pool
      # only ever serves short work.
      maximum-pool-size: 20
      # Backstop for the remaining short row locks (route apply prepare/record,
      # the reservation sweeper, the per-VM cap check): a lock wait past this
      # is a bug surfacing, and failing loudly beats pinning a pooled
      # connection indefinitely. Applies per session; Flyway shares the pool,
      # but boot-time migrations on a single instance see no lock contention.
      connection-init-sql: SET lock_timeout = '10s'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

# JobRunr 8 spring starter reads the `jobrunr.*` prefix (NOT `org.jobrunr.*`).
jobrunr:
  background-job-server:
    enabled: true
    # Explicit, not the default (cores x 16 = 64 on the 4-core host): a route
    # apply can legitimately block minutes on inline certificate issuance, and
    # 64 concurrent ones would queue-storm the agent. 16 bounds that while
    # staying below the DB pool (20), so even every worker in a transaction at
    # once cannot starve web requests of connections.
    worker-count: 16
  dashboard:
    # Off by default; ops enable it per environment via env (planned: dev only).
    # Property keys verified against jobrunr-spring-boot-4-starter 8.7.1
    # (META-INF/spring-configuration-metadata.json; JobRunrAutoConfiguration
    # wires username/password into andBasicAuthentication()). JobRunr itself is
    # fail-open when username or password is empty (it then starts the dashboard
    # with no auth at all), so JobRunrDashboardGuard refuses to start on that
    # combination. Keep port 8000 internal-only (no DNAT; vmbr1/firewall scope)
    # since basic auth goes over plain HTTP.
    enabled: ${PICKLE_JOBRUNR_DASH_ENABLED:false}
    port: 8000
    username: ${PICKLE_JOBRUNR_DASH_USER:}
    password: ${PICKLE_JOBRUNR_DASH_PASS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api/v1/openapi

pickle:
  jwt:
    # HS256 signing key, >= 32 bytes. No default in any profile: startup fails
    # fast when unset (secrets policy; set via /etc/pickle/api.env). Only the
    # test profile carries a fixed value, from the test classpath.
    secret: ${PICKLE_JWT_SECRET:}
    access-token-ttl: 15m
  credentials:
    # AES-256-GCM key (base64 32 bytes) for reversible credential storage
    # (VM initial passwords). Same fail-fast policy as the JWT secret.
    encryption-key: ${PICKLE_CREDENTIALS_KEY:}
  mfa:
    # Enforce 2FA enrollment for admin-tier accounts (scope-restrict the
    # unenrolled). Off in dev/test; the prod profile turns it on.
    enforce-admin: ${PICKLE_MFA_ENFORCE_ADMIN:false}
  auth:
    refresh-token-ttl: 14d
    verification-token-ttl: 24h
    # Console URL the verification mail links to; token is appended as ?token=
    verification-base-url: ${PICKLE_VERIFICATION_BASE_URL:https://pickle.pusan.ac.kr/verify-email}
    # Console URL the password-reset mail links to; token is appended as ?token=
    password-reset-base-url: ${PICKLE_PASSWORD_RESET_BASE_URL:https://pickle.pusan.ac.kr/reset-password}
  proxmox:
    # PVE API token. Deliberately no startup fail-fast: dev/test
    # profiles that never touch Proxmox may leave these unset — ProxmoxClient
    # throws a clear error at first use instead.
    token-id: ${PICKLE_PROXMOX_TOKEN_ID:}
    token-secret: ${PICKLE_PROXMOX_TOKEN_SECRET:}
    # PEM pinned as the only trusted CA for the PVE API (empty = JVM default).
    ca-cert-path: ${PICKLE_PROXMOX_CA_CERT:}
    connect-timeout: 5s
    read-timeout: 30s
    task-poll-interval: 2s
    task-poll-timeout: 5m
  ssh:
    # SSH gateway advertised in the initial-password response (contract
    # InitialPasswordResponse.sshHost/sshPort). Empty/0 → null in responses
    # (dev sets these via /etc/pickle/api.env).
    advertised-host: ${PICKLE_SSH_HOST:}
    advertised-port: ${PICKLE_SSH_PORT:0}
    # SSH gateway upstream public key, authorized on every VM. No default:
    # provisioning fails closed when unset.
    platform-public-key: ${PICKLE_SSH_PLATFORM_PUBLIC_KEY:}
    # Web-terminal bridge public key, injected alongside the gateway key
    # (independent revocation). Optional — when blank only the gateway key is
    # injected (warning logged); dev VMs are re-provisioned once it is set.
    terminal-public-key: ${PICKLE_TERMINAL_PUBLIC_KEY:}
  sshgw:
    # Internal SSH gateway route endpoint. No token default
    # outside dev/test: when blank the /internal filter chain fails closed
    # (rejects every request) instead of trusting an empty bearer.
    token: ${PICKLE_SSHGW_TOKEN:}
    allowed-source-ip: ${PICKLE_SSHGW_SOURCE_IP:172.30.1.30}
    # Per-client budget keyed on the PROXY-recovered client sourceIp (the TCP
    # peer is always the sshgw LXC — keying on it would be one global bucket).
    rate-limit-per-minute: ${PICKLE_SSHGW_RATE_LIMIT:60}
    # Whole-gateway backstop at the /internal filter, across all clients.
    global-rate-limit-per-minute: ${PICKLE_SSHGW_GLOBAL_RATE_LIMIT:600}
  relay:
    # Relay sync surface (/internal/relays/**, own filter chain + per-relay
    # token). Per-relay sync budget, ~3-5x the agent poll rate; deliberately
    # NOT the sshgw global bucket.
    sync-rate-limit-per-minute: ${PICKLE_RELAY_SYNC_RATE_LIMIT:20}
    # Agent poll interval as deployed on the relay; contact-lost derivation
    # flags a relay after 3x this without a sync.
    poll-interval-seconds: ${PICKLE_RELAY_POLL_INTERVAL_SECONDS:30}
    # Hard cap on a sync request body: larger Content-Length answers 413 and
    # chunked bodies are stream-capped.
    max-sync-body-bytes: ${PICKLE_RELAY_MAX_SYNC_BODY_BYTES:1048576}
    # Peers confined to the relay sync surface: a relay's tunnel address must
    # reach only /internal/relays/** (403 everywhere else, actuator included).
    restricted-source-ips: ${PICKLE_RELAY_RESTRICTED_SOURCE_IPS:10.100.100.1}
  proxy-agent:
    # Reverse-proxy control link to proxy-agent. pickle-api is the
    # client; a JobRunr job pushes desired routing state to the agent on LXC 100.
    # No token default outside dev/test: when blank the client fails closed at
    # first use instead of sending an empty bearer.
    # :9443 is the agent's own listener — the bare host would hit nginx :80.
    base-url: ${PICKLE_PROXY_AGENT_URL:http://172.30.1.10:9443}
    token: ${PICKLE_PROXY_AGENT_TOKEN:}
    connect-timeout: 5s
    read-timeout: 30s
  terminal:
    # Web terminal control link. pickle-api is
    # the client for force-terminate only; the browser WS + SSH bytes live on the
    # sshgw-terminal-bridge (LXC 102). The inbound redeem/session/revalidate calls
    # reuse the /internal filter (PICKLE_SSHGW_TOKEN, source 172.30.1.30).
    #
    # Control token has no default outside dev/test: when blank the terminate
    # call fails closed with 503 (never an empty bearer). :8083 is the bridge
    # control port (source 172.30.1.20 only, nftables-restricted).
    bridge-control-base-url: ${PICKLE_TERMINAL_BRIDGE_URL:http://172.30.1.30:8083}
    bridge-control-token: ${PICKLE_TERMINAL_CONTROL_TOKEN:}
    bridge-connect-timeout: 2s
    bridge-read-timeout: 3s
    # One-time ticket lifetime from mint. Short — the bridge
    # redeems within one WS handshake.
    ticket-ttl: 60s
    # Concurrent live-session caps enforced at mint over tickets + mirror
    # (per-org avoids a single global shared-fate cap).
    per-user-cap: ${PICKLE_TERMINAL_PER_USER_CAP:3}
    per-vm-cap: ${PICKLE_TERMINAL_PER_VM_CAP:5}
    per-org-cap: ${PICKLE_TERMINAL_PER_ORG_CAP:20}
    # Ticket-mint rate limit, applied on BOTH the client IP and the JWT userId
    # (dual key — IP is spoofable, userId is the fixed axis).
    rate-limit-per-minute: ${PICKLE_TERMINAL_RATE_LIMIT:10}
    # Mirror leak pruning: a redeemed-but-never-started entry is evicted after
    # pending-grace; a started entry with no revalidation heartbeat after
    # stale-after (60s poll × 5 + slack). Reclaims cap slots from a dead bridge.
    pending-grace: 120s
    stale-after: 330s
    # Boot-time single-instance assertion (PG advisory lock): the in-memory
    # session mirror + cap accounting require exactly one api instance.
    enforce-single-instance: ${PICKLE_TERMINAL_SINGLE_INSTANCE:true}
  publishing:
    # Reverse-proxy public IPv4 a custom domain's A record must point at
    # (verified campus proxy address).
    proxy-public-ip: ${PICKLE_PROXY_PUBLIC_IP:164.125.249.87}
    # Platform subdomains carry no configured ref: it is derived per root domain
    # (wildcard:<root>) so introducing a root is a data + certificate change only.
    lets-encrypt-cert-ref: letsencrypt
    le-cert-validity-days: 90
    # Recurring DNS scan gives up (domain FAILED) past this age; manual verify
    # still succeeds whenever the records finally match.
    verification-timeout: 72h
  seed:
    # Passwords have no default: the seeder runs only under dev/test and refuses
    # to start on a blank value, so a reachable environment cannot end up with a
    # seed account whose password is published in this file.
    sysadmin-email: ${PICKLE_SEED_SYSADMIN_EMAIL:admin@pickle.local}
    sysadmin-password: ${PICKLE_SEED_SYSADMIN_PASSWORD:}
    orgadmin-email: ${PICKLE_SEED_ORGADMIN_EMAIL:orgadmin@pickle.local}
    orgadmin-password: ${PICKLE_SEED_ORGADMIN_PASSWORD:}

---
# dev: local/LXC development. Mock mail. No secret defaults here on purpose —
# the JWT secret and the credentials key come from the env only (base document),
# so an unset value fails startup instead of silently signing tokens and
# encrypting credentials with a value that is public in git.
spring:
  config:
    activate:
      on-profile: dev

pickle:
  mail:
    # full mock-mail bodies (verification links = bearer tokens) go to this
    # service-user-only (rw-------) spool, not the journal
    mock-spool-path: ${PICKLE_MOCK_MAIL_SPOOL:/var/lib/pickle/mock-mail.log}

---
# staging/prod: real SMTP (Google SMTP creds provided by operator via env).
spring:
  config:
    activate:
      on-profile: staging | prod
  mail:
    host: ${PICKLE_SMTP_HOST}
    port: ${PICKLE_SMTP_PORT:587}
    username: ${PICKLE_SMTP_USERNAME}
    password: ${PICKLE_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

pickle:
  mfa:
    # Admin-tier 2FA is mandatory in production; override per env if needed.
    enforce-admin: ${PICKLE_MFA_ENFORCE_ADMIN:true}
  mail:
    from: ${PICKLE_SMTP_USERNAME}
